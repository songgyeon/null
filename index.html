<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content: 안드로이드 크롬은 키보드가 올라와도 레이아웃
     높이를 안 줄이는 게 기본(resizes-visual)이다. 그러면 100dvh가 전체 화면 높이로
     남아서, 브라우저가 입력칸만 보이게 스크롤하고 그 아래로 폰 껍데기가 남는다.
     이 값을 주면 키보드만큼 높이가 줄어 입력칸이 키보드 바로 위에 붙는다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>NULL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<!-- 데모 대사·매칭. 문구집에서 만들어진 파일이라 직접 고치지 않는다 -->
<script src="demo-lines.js"></script>
<style>
/* ── Y2K 파스텔 OS 팔레트 ──
   잉크 #4a4276 · 보더 #5d5490/#8a7fc0/#b0a6d8 · 크롬 #dcd6f2 · 핑크 #ff9ec6 · 라벤더 #c3b2f0 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Galmuri11","DungGeunMo",sans-serif;color:#4a4276;
 background:linear-gradient(165deg,#c9bff1 0%,#b3a7e6 60%,#c4b0e8 100%);
 -webkit-font-smoothing:none}
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
/* 메인 창(폰) */
.phone{position:relative;z-index:1;width:390px;height:844px;max-height:min(94vh,844px);overflow:hidden;
 background:#dcd6f2;border:1px solid #5d5490;border-radius:12px;
 box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #b0a6d8,6px 6px 0 rgba(93,84,144,.3),0 30px 60px rgba(93,84,144,.35)}
@media(max-width:500px){
 #root{align-items:stretch}
 .phone{width:100%;height:100dvh;max-height:none;border-radius:0;border:none;box-shadow:none}
}
.screen{position:absolute;inset:4px;display:flex;flex-direction:column;overflow:hidden;border-radius:9px;
 background:#ece8fa;animation:fade .25s steps(4)}
@media(max-width:500px){.screen{inset:0;border-radius:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blinkc{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes recblink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes spk{0%,100%{transform:scale(.35) rotate(0deg);opacity:.15}50%{transform:scale(1) rotate(90deg);opacity:.95}}
/* 창들을 세로 흐름에 얹는다. 흩어진 데스크톱처럼 보이는 건 좌우 정렬과
   살짝 겹치는 음수 여백으로 낸다 — 좌표로 흩어놓으면 화면 높이가 바뀔 때마다
   겹치거나 잘린다. */
.spstack{position:absolute;left:0;right:0;top:0;bottom:0;z-index:12;
 display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 26px 52px}
/* 세로가 모자라면 flex가 창들을 눌러버리고, overflow:hidden이라 안쪽 버튼이
   잘려나간다. 창은 절대 줄이지 않는다 — 모자라면 차라리 위아래가 잘리는 게 낫다. */
.spstack>*{flex:none}
.spstack .w1{align-self:flex-start;width:182px;margin-top:14px}
.spstack .w2{align-self:flex-end;width:194px;margin-top:-6px}
.spstack .w3{align-self:stretch;margin-top:8px}
.spcurwrap{position:relative}
/* 키라키라 반짝이 */
.spark{position:absolute;pointer-events:none;z-index:6;
 clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
 animation:spk 2.6s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(255,255,255,.9))}
/* ── 창 타이틀바 + 동그란 ─□✕ ── */
.tb{flex:none;display:flex;align-items:center;gap:8px;padding:8px 11px;
 background:linear-gradient(90deg,#ff9ec6,#c3b2f0);color:#fff;border-bottom:1px solid #5d5490;
 font-size:12px;letter-spacing:.1em;text-shadow:1px 1px 0 rgba(93,84,144,.55)}
.dots{margin-left:auto;display:flex;gap:5px}
.dots span{width:16px;height:16px;border-radius:50%;border:1px solid #5d5490;display:flex;align-items:center;justify-content:center;
 font-size:8px;line-height:1;color:#fff;text-shadow:none;
 box-shadow:inset -1px -2px 0 rgba(93,84,144,.3),inset 1px 1px 0 rgba(255,255,255,.7)}
.dots .d1{background:#ffd0e6;color:#c46a97}
.dots .d2{background:#ff9ec6}
.dots .d3{background:#ff7fae}
/* 메뉴바 / 베벨 버튼 / 선큰 패널 */
.menubar{flex:none;display:flex;align-items:center;gap:4px;padding:4px 8px;font-size:11px;color:#6b5fa8;

.mbtn{padding:5px 8px;cursor:pointer;border:1px solid transparent;border-radius:3px}
.mbtn.ico{position:relative;display:flex;align-items:center;gap:5px}
.spinslow{display:block;line-height:0;animation:spin 6s linear infinite}

.mbtn:hover{background:#e6def8}

.bevel{font-family:inherit;color:#4a4276;background:#ece8fa;border:1px solid #5d5490;cursor:pointer;
 box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 #cdc3ec,2px 2px 0 rgba(93,84,144,.22)}
.bevel:active{box-shadow:inset 1px 1px 0 #cdc3ec;transform:translate(1px,1px)}

/* 드롭다운 */
.ddwrap{position:relative}

.dlgov{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
 background:rgba(74,66,118,.4);padding:26px;animation:fade .15s steps(3) both}
.dlg{width:100%;max-width:290px;background:#ffd0e4;border:1px solid #5d5490;border-radius:8px;overflow:hidden;
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.8),5px 5px 0 rgba(93,84,144,.28);animation:fadeUp .2s steps(4) both}
.dlg .tb{background:linear-gradient(90deg,#ff8fbe,#ffb0d4);letter-spacing:.14em}
.dlgbody{background:#fdf3f8;padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.dlgline{font-size:12px;line-height:1.9;color:#6b5fa8}

.dlgbtns .bevel{flex:1;padding:9px 6px;font-size:11px;border-radius:0}
.dlgbtns .pink{background:linear-gradient(180deg,#fff0f7,#ffc2dd)}
/* etc. 팝업 — 미니홈피 게스트북 톤 */
.etc{position:relative;align-items:center;gap:0;padding:0 0 16px;overflow:hidden;
 background:linear-gradient(180deg,#fff6fb 0%,#ffeaf5 62%,#f4e9ff 100%)}

 background:linear-gradient(90deg,#ff9ec6,#ffd68a,#a8e6c9,#8fd8e8,#c3b2f0,#ff9ec6)}
.etcglit{position:absolute;inset:0;pointer-events:none;opacity:.5;
 background:radial-gradient(2px 2px at 14% 22%,#fff,transparent),radial-gradient(2px 2px at 78% 16%,#ffd0e6,transparent),
  radial-gradient(2px 2px at 30% 78%,#d5c8ff,transparent),radial-gradient(2px 2px at 88% 66%,#fff,transparent),
  radial-gradient(2px 2px at 55% 40%,#ffe9a8,transparent)}
.etccd{position:relative;width:62px;height:62px;margin:18px 0 12px;border-radius:50%;flex:none;
 background:conic-gradient(#ffd6ec,#d9c6ff,#bfe6f5,#d8f5e3,#ffeec2,#ffd6ec);
 border:1px solid #c9bce9;box-shadow:0 0 14px rgba(255,158,198,.5);animation:spin 5.5s linear infinite}
.etccd::after{content:"";position:absolute;left:50%;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;
 border-radius:50%;background:#fdf3f8;border:1px solid #d9cdf0}
.etchi{position:relative;font-size:14px;color:#8a4f74;letter-spacing:.06em;text-align:center;
 text-shadow:0 0 8px rgba(255,158,198,.7)}

.etcdiv{position:relative;margin:14px 0 12px;font-size:9px;letter-spacing:.5em;color:#f0a8c8}
.etcrow{position:relative;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.etctag{padding:4px 9px;font-size:9px;letter-spacing:.06em;color:#8a7fc0;background:#fff;white-space:nowrap;
 border:1px solid #e6d9f5;border-radius:11px}
.etcnote{position:relative;margin-top:14px;padding:0 16px;font-size:9.5px;line-height:2;letter-spacing:.02em;

/* ── 장바구니 ── 작은 다이얼로그가 아니라 창 하나를 통째로 쓴다 */
.cartscreen{position:absolute;inset:0;z-index:39;display:flex;flex-direction:column;
 background:linear-gradient(180deg,#cabdf2,#b9abe9);animation:fadeUp .22s steps(4) both}
.cartwin{position:absolute;left:14px;right:14px;top:22px;bottom:22px;display:flex;flex-direction:column;
 background:#fdf6fb;border:1px solid #5d5490;border-radius:10px;overflow:hidden;
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.9),5px 5px 0 rgba(93,84,144,.32)}
.cbar{flex:none;display:flex;align-items:center;gap:8px;padding:12px 13px 0}
input.csearch{flex:1;min-width:0;padding:8px 11px;font-family:inherit;font-size:12px;color:#4a4276;
 background:#fff;border:1px solid #8a7fc0;border-radius:0;outline:none;
 box-shadow:inset 1px 1px 0 rgba(93,84,144,.25)}
input.csearch::placeholder{color:#b9addc}
.ccoin{flex:none;display:flex;align-items:center;gap:5px;padding:8px 11px;font-size:11px;color:#8a4f74;
 background:linear-gradient(180deg,#fff6db,#ffe6a8);border:1px solid #d8b45c;
 box-shadow:inset 1px 1px 0 #fff,1px 1px 0 rgba(93,84,144,.25)}
.cchips{flex:none;display:flex;gap:6px;padding:11px 13px 4px}
.cchip{padding:5px 11px;font-family:inherit;font-size:10px;color:#a294cf;cursor:pointer;
 background:#f1ebfd;border:1px solid #cabbee;border-radius:14px}
.cchip.on{color:#fff;background:linear-gradient(180deg,#ffa8cd,#ff7fae);border-color:#e0699a;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.cgrid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
 display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:10px;padding:11px 13px 13px}
.cgrid::after{content:"";display:block;height:8px}
.citem{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;
 padding:14px 8px 32px;min-height:150px;font-family:inherit;cursor:pointer;
 background:#fff;border:1px solid #e6d7f2;border-radius:9px;
 box-shadow:inset 0 -14px 18px rgba(246,235,252,.9),2px 3px 0 rgba(138,127,192,.2)}
.citem:active{transform:translateY(1px)}

.cthumb{width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:50%;
 border:1px solid rgba(93,84,144,.18);box-shadow:inset 0 3px 0 rgba(255,255,255,.9);
 background:linear-gradient(180deg,#fff,#f1ecfb)}
.ciname{font-size:11px;color:#6b5fa8}
.cprice{position:absolute;left:0;right:0;bottom:0;padding:5px 0;text-align:center;font-size:10px;color:#c05f8c;
 background:#fff2f8;border-top:1px dashed #f4c3d8}
.cbadge{position:absolute;top:-7px;right:-6px;padding:2px 7px;font-size:8px;color:#fff;letter-spacing:.08em;
 background:#ff7fae;border:1px solid #5d5490;border-radius:9px;transform:rotate(6deg)}
.cbadge.mint{background:#5ec9c1}
.cfoot{flex:none;padding:0 13px 13px;text-align:center;font-size:9px;letter-spacing:.16em;color:#bdb0e0}
.cnone{grid-column:1/-1;padding:36px 0;text-align:center;font-size:11px;letter-spacing:.1em;color:#c46a97}
/* 선물 보내기 */
.cwrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
 display:flex;flex-direction:column;gap:12px;padding:14px 15px 15px}
.cwrap::after{content:"";display:block;flex:none;height:8px}
.cgcard{position:relative;display:flex;align-items:center;gap:13px;padding:14px;background:#fff;
 border:1px solid #f0c3da;border-radius:10px;box-shadow:2px 3px 0 rgba(240,182,210,.35)}
.cribbon{position:absolute;left:-1px;top:16px;bottom:16px;width:5px;border-radius:3px;
 background:repeating-linear-gradient(180deg,#ff9ec6 0 6px,#ffd0e6 6px 12px)}
.cgthumb{width:70px;height:70px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:9px;
 background:linear-gradient(180deg,#fff,#eef1fb);border:1px solid #d9d3f0}
.cgname{font-size:14px;color:#4a4276}
.cgdesc{margin-top:7px;font-size:10px;line-height:1.7;color:#a99bd0;white-space:pre-line}
.cgprice{margin-top:8px;display:inline-block;padding:3px 9px;font-size:10px;color:#c05f8c;
 background:#fff2f8;border:1px dashed #f4c3d8;border-radius:10px}
.csect{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.3em;color:#d3a0c0}
.csect::before,.csect::after{content:"";flex:1;height:1px;background:#f0dcea}
.cto{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;font-family:inherit;cursor:pointer;
 text-align:left;background:#fff;border:1px solid #e8d9f4;border-radius:10px;
 box-shadow:2px 2px 0 rgba(138,127,192,.14)}
.cto.sel{border-color:#ff9ec6;background:#fff7fb;box-shadow:2px 2px 0 rgba(255,158,198,.35)}
.cto:disabled{cursor:default}
.cradio{width:14px;height:14px;flex:none;border-radius:50%;border:1.5px solid #e0c8dc;background:#fff}
.cto.sel .cradio{border-color:#ff7fae;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 8px #ff7fae}
.cface{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid #8a7fc0}
.ctoname{flex:1;font-size:12.5px;color:#4a4276}
.csend{flex:none;padding:8px 15px;font-size:10.5px;letter-spacing:.12em;color:#fff;border-radius:16px;
 background:linear-gradient(180deg,#ffa8cd,#ff6ea6);border:1px solid #5d5490;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),1px 2px 0 rgba(93,84,144,.3)}
.csent{flex:none;padding:8px 15px;font-size:10.5px;letter-spacing:.12em;color:#a99bd0;border-radius:16px;
 background:#f2eefb;border:1px solid #d5cbee}
.chint{margin:5px 0 0 64px;font-size:9px;color:#b4a7d6}

 resize:none;outline:none;border:1px solid #ecd9c8;border-radius:8px;
 background:repeating-linear-gradient(180deg,#fffdf6 0 25px,#fdf4ea 25px 26px);
 box-shadow:2px 3px 0 rgba(198,170,150,.2)}
textarea.cmemo::placeholder{color:#cbbba8}
.cback{flex:none;margin-top:auto;padding:11px;font-family:inherit;font-size:11px;letter-spacing:.24em;color:#4a4276;
 cursor:pointer;background:linear-gradient(180deg,#ffffff,#e9e2fa);border:1px solid #5d5490;
 box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #cdc3ec,2px 2px 0 rgba(93,84,144,.22)}
/* input.을 붙이는 이유: .blankin이 이 뒤에 정의돼 있어서 그냥 .cartq로는
   width:74px에 눌린다. 검색창이 74px로 쭈그러든다. */
input.cartq{width:100%;padding:8px 10px;font-size:14px;text-align:left}
.cartgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:4px}
.cartcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 9px;cursor:pointer;
 background:#fff;border:1px solid #e79cc0;border-radius:4px;font-family:inherit;font-size:10.5px;color:#8a4f74}
.cartcell:active{background:#fff0f7;transform:translateY(1px)}

.cartsend .who{margin:4px 0 0;font-size:9.5px;letter-spacing:.16em;color:#c46a97}
/* 선물 태그 — 실물 선물에 매다는 종이 태그처럼. 구멍 뚫고 점선 두르고 To. */
.tag{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:11px 10px 11px 25px;
 font-family:inherit;font-size:12px;color:#8a4f74;text-align:left;cursor:pointer;
 background:linear-gradient(180deg,#fffdfe,#ffe9f3);border:1px solid #e79cc0;border-radius:4px;
 box-shadow:2px 2px 0 rgba(93,84,144,.16)}

 border:1px solid #e79cc0;border-radius:50%;background:#fdf3f8}   /* 끈 꿰는 구멍 */

.tag:disabled .go{background:#c1b8e0}

 background:#fff;border:1px dashed #e79cc0;border-radius:3px}
.blank:hover{background:#fff0f7}
.blank.filled{color:#8a4f74;border-style:solid}
.blankin{width:74px;padding:2px 5px;font-family:inherit;font-size:12px;color:#4a4276;text-align:center;outline:none;border-radius:0}
/* ── 소개 영상 ──
   데스크 CD를 누르면 나오는 11초짜리. 사진 넉 장과 문장 네 줄이 넘어가고
   NULL 로고로 끝난다. 실제 동영상 파일이 아니라 전부 CSS다.

   시작할 때 강제로 보여주면 프롤로그 나레이션이 되지만, 눌러야 나오는
   소개 영상이면 다르다 — 안 볼 사람은 안 보고, 궁금한 사람만 본다.

   .logo·.sub·.scan처럼 흔한 이름이 많아 전부 .film 아래로 가뒀다. */
.film{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;
 overflow:hidden;background:#0e0a24;cursor:pointer}
.film.out{animation:filmOut .45s ease-in both}
@keyframes filmOut{to{opacity:0;visibility:hidden}}
/* ══ NULL 소개 영상 (11초) · VHS 테이프 재생 느낌 ══

/* ── 폰 화면 ── */

/* ── 사진 스테이지 ── */
.film .stage{position:relative;flex:1;overflow:hidden;

@keyframes jump{
 0%,20.9%{transform:translateY(0)}
 21%{transform:translateY(-9px)}21.6%{transform:translateY(4px)}22%{transform:translateY(0)}
 46.9%{transform:translateY(0)}47%{transform:translateY(7px)}47.5%{transform:translateY(-5px)}48%{transform:translateY(0)}
 74.9%{transform:translateY(0)}75%{transform:translateY(-6px)}75.6%{transform:translateY(3px)}76%,100%{transform:translateY(0)}}

/* 사진 4장 — 지금은 색 블록, 나중에 background-image 로 교체 */
.film .fr{position:absolute;inset:0;opacity:0;background-size:cover;background-position:center;
 animation:cut .7s ease-out both}
@keyframes cut{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
/* jaeeon-museum.webp */
.film .f1{animation-delay:.2s;background-image:linear-gradient(160deg,#8fa8e8,#c3b2f0 55%,#f0c2de)}
/* minhyun-record.webp */
.film .f2{animation-delay:2.2s;background-image:linear-gradient(160deg,#ffb38f,#f0a2c8 55%,#c3b2f0)}
/* jaeeon-night.webp */
.film .f3{animation-delay:4.2s;background-image:linear-gradient(160deg,#3b2c6e,#7d5f9e 55%,#c98fb8)}
/* minhyun-roof.webp */
.film .f4{animation-delay:6.2s;background-image:linear-gradient(160deg,#ffd7a8,#ff9ec6 55%,#a2a8ea)}

/* 사진 위 글리터 · 반짝이 */
.film .glitter{position:absolute;inset:0;pointer-events:none;opacity:.5;
 background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px),
   radial-gradient(rgba(255,214,240,.8) 1px,transparent 1px);
 background-size:38px 38px,53px 53px;background-position:0 0,17px 21px;
 animation:glit 1.2s steps(2) infinite}
@keyframes glit{0%{background-position:0 0,17px 21px}100%{background-position:3px -2px,14px 24px}}

 animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

/* ── 문장 ── */
.film .lines{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);

 background:radial-gradient(ellipse at center,rgba(16,10,36,.62) 0%,rgba(16,10,36,.3) 46%,rgba(16,10,36,0) 74%);width:100%;text-align:center;font-size:19px;line-height:1.75;color:#fff;

@keyframes say{
 0%{opacity:0;transform:translateY(8px) scale(.98)}
 14%{opacity:1;transform:translateY(0) scale(1)}

 100%{opacity:0;transform:translateY(-6px)}}
.film .ln1{animation-delay:.7s}
.film .ln2{animation-delay:2.7s}
.film .ln3{animation-delay:4.7s}

@keyframes shim{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.film .rainbow{width:150px;height:5px;border-radius:3px;

.film .ending .heart{position:absolute;font-size:13px;color:#ff9ec6;animation:tw 2.6s ease-in-out infinite}

/* ── VHS 껍데기 ── */
.film .scan{position:absolute;inset:0;z-index:20;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
.film .rgb{position:absolute;inset:0;z-index:19;pointer-events:none;mix-blend-mode:screen;opacity:.28;
 background:linear-gradient(90deg,rgba(255,0,90,.45),transparent 12%,transparent 88%,rgba(0,190,255,.45));
 animation:fringe 2.6s steps(3) infinite}
@keyframes fringe{0%{transform:translateX(0)}33%{transform:translateX(1.5px)}66%{transform:translateX(-1.5px)}100%{transform:translateX(0)}}
.film .track{position:absolute;left:0;right:0;height:26px;z-index:21;pointer-events:none;opacity:.5;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 1px,rgba(255,255,255,0) 1px 2px,
   rgba(255,255,255,.25) 2px 3px,rgba(255,255,255,0) 3px 5px);
 filter:blur(.4px)}
.film .track.t1{top:0;animation:tr1 5.5s linear infinite}
.film .track.t2{bottom:0;animation:tr2 7.5s linear infinite}
@keyframes tr1{0%{transform:translateY(-26px);opacity:0}
 8%{opacity:.6}50%{transform:translateY(46vh);opacity:.45}92%{opacity:.5}100%{transform:translateY(90vh);opacity:0}}
@keyframes tr2{0%{transform:translateY(26px);opacity:0}
 10%{opacity:.55}55%{transform:translateY(-40vh);opacity:.4}100%{transform:translateY(-88vh);opacity:0}}
.film .hud{position:absolute;left:0;right:0;z-index:22;display:flex;align-items:center;justify-content:space-between;
 padding:12px 14px;font-family:"Galmuri9","Galmuri11",sans-serif;font-size:11px;color:#fff;
 text-shadow:1px 1px 0 rgba(0,0,0,.55);pointer-events:none;letter-spacing:.08em}
.film .hud.top{top:0}
.film .hud.bot{bottom:0;align-items:flex-end}
.film .rec{display:flex;align-items:center;gap:6px}
.film .dot{width:9px;height:9px;border-radius:50%;background:#ff5470;box-shadow:0 0 8px #ff5470;

@keyframes rb{0%,49%{opacity:1}50%,100%{opacity:.15}}
.film .tc{letter-spacing:.14em}
.film .play{letter-spacing:.16em}
.film .skip{color:#ffd0e6;font-size:10px;letter-spacing:.24em;animation:rb 1.7s steps(2) infinite}
/* 스티커 */
.film .sticker{position:absolute;z-index:23;pointer-events:none;font-size:13px;

.film .tape{position:absolute;z-index:23;width:52px;height:16px;pointer-events:none;

 border-left:1px solid rgba(255,255,255,.5);border-right:1px solid rgba(255,255,255,.5)}
/* 건너뛰기 상태 */
.tv.skipped .stage>.fr,.tv.skipped .lines{animation:none;opacity:0}
.film.skipped .blackout{animation:none;opacity:1}
.film.skipped .ending{animation:endin .4s ease-out both}

/* ── 오프닝 ──
   Y2K 데스크톱. 도는 CD, 올라오는 방울, 흩어진 가짜 오류창.
   오류창이 이 이야기를 대신 말한다 — "당신을 찾을 수 없습니다".
   그래서 이름 칸이 여기 있다. 이름을 넣는 것이 곧 그 오류를 지우는 일이다.
   로고곡은 여기서 돌고, 들어갈 때 페이드아웃된다. */
/* BGM: 방울 — 아래에서 올라오며 살짝 흔들림 */
@keyframes rise{0%{transform:translateY(0);opacity:0}6%{opacity:1}84%{opacity:.95}100%{transform:translateY(-940px);opacity:0}}
@keyframes sway{0%{margin-left:-15px}100%{margin-left:15px}}
.bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bub{position:absolute;bottom:-70px;border-radius:50%;
 background:radial-gradient(circle at 30% 26%,#fff 0 9%,rgba(255,255,255,.55) 20%,rgba(255,255,255,0) 46%),
   radial-gradient(circle at 72% 74%,rgba(255,170,215,.7),rgba(160,205,255,.5) 55%,rgba(255,255,255,.05) 78%);
 border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(255,255,255,.45),inset 0 0 8px rgba(255,255,255,.5);
 animation:rise linear infinite,sway ease-in-out infinite alternate}
/* 오픈닝 화면 — 미니홈피 부텀 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes fill{0%{width:14%}100%{width:92%}}
@keyframes flow{0%{background-position:0 0}100%{background-position:28px 0}}
@keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
.splash{display:block;cursor:pointer;background:linear-gradient(180deg,#dcd3f7 0%,#c3b2f0 50%,#f0c2de 100%)}
/* CD도 흐름에 얹는다. 좌표로 두면 짧은 화면에서 카드 뒤로 숨는다 */
.spcd{align-self:flex-end;margin-right:-4px;width:76px;height:76px;border-radius:50%;z-index:5;flex:none;
 animation:spin 7s linear infinite;
 background:conic-gradient(from 0deg,#ffd0e6,#c3b2f0,#a8e6e0,#ffe9a8,#ffc2dd,#b9e3ff,#ffd0e6);
 box-shadow:0 0 0 1px rgba(255,255,255,.9),0 6px 20px rgba(60,40,100,.32)}
.spcd::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px dashed rgba(255,255,255,.55)}
.spcd::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.9);
 box-shadow:inset 0 0 0 3px rgba(195,178,240,.5)}
.spcard{width:100%;z-index:16;background:#fff8fc;border:1px solid #5d5490;
 border-radius:9px;overflow:hidden;box-shadow:5px 6px 0 rgba(60,45,100,.28);animation:pop .4s steps(3) both}
.sptb{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:9.5px;color:#fff;letter-spacing:.06em;
 border-bottom:1px solid #5d5490;text-shadow:1px 1px 0 rgba(93,84,144,.5)}
.spcard .sptb{background:linear-gradient(90deg,#ff8fbe,#c3b2f0)}
.spbody{padding:34px 18px 22px;text-align:center}
.splogo{font-family:"Galmuri9","Galmuri11",sans-serif;font-size:40px;letter-spacing:.3em;text-indent:.3em;
 background:linear-gradient(120deg,#fff 0 12%,#ffd0f0 30%,#b9e3ff 50%,#fff 68%,#c3b2f0 92%);background-size:200% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.2px #b06f9e;
 filter:drop-shadow(2px 2px 0 rgba(176,111,158,.32));animation:shimmer 4.5s linear infinite}
.splogo .cur{-webkit-text-fill-color:#ff9ec6;color:#ff9ec6;-webkit-text-stroke:0;
 animation:blinkc 1s steps(1) infinite}
.spsub{margin-top:16px;font-size:10.5px;letter-spacing:.24em;color:#b48ac2}
.spinput{width:100%;margin-top:20px;padding:10px 12px;font-size:16px;font-family:inherit;color:#4a4276;text-align:center;
 outline:none;border-radius:0;background:#fff;border:1px solid #8a7fc0;
 box-shadow:inset 1px 1px 0 rgba(93,84,144,.28),inset 2px 2px 4px rgba(93,84,144,.12)}
.spinput::placeholder{color:#dbb0c8;font-size:12px;letter-spacing:.08em}

 box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 #f0c8de,2px 2px 0 rgba(93,84,144,.22)}
.spgo:active{transform:translate(1px,1px);box-shadow:inset 1px 1px 0 #f0c8de}

 box-shadow:inset 1px 1px 0 rgba(93,84,144,.3)}
.spbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ff9ec6 0 7px,#ffd0e6 7px 14px);
 animation:fill 3.6s ease-in-out infinite, flow 1s linear infinite}
.spnote{font-size:8.5px;letter-spacing:.16em;color:#c3aacd}
.spwin{position:relative;z-index:14;border:1px solid #5d5490;border-radius:5px;overflow:hidden;
 box-shadow:3px 4px 0 rgba(60,45,100,.3);animation:pop .35s steps(3) both}
.spwin .sptb{font-size:9px;padding:4px 7px}
.spwin .spbd{padding:11px 11px 9px;font-size:9.5px;line-height:1.75;background:#fff;color:#6b5fa8}
/* 버튼은 제 줄에서 오른쪽 아래. inline-block으로 두면 문장 뒤에 그대로 붙어
   "당신을 찾을 수 없습니다. [Cancel]" 처럼 한 줄이 된다 — 대화상자가 아니라 문장이 된다. */
.spbtn{display:block;width:fit-content;margin:11px 0 0 auto;padding:4px 14px;font-size:9px;color:#4a4276;
 background:#ece8fa;border:1px solid #5d5490;box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 #cdc3ec}
/* 커서 — CSS 보더로 만든 삼각형은 한쪽만 채워져서 작대기로 보였다. SVG로 그린다 */
.spcursor{position:absolute;z-index:30;width:15px;height:21px;left:-6px;bottom:-15px;
 filter:drop-shadow(1px 2px 0 rgba(74,66,118,.45));transform:rotate(-8deg)}
.sptap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10.5px;letter-spacing:.34em;color:#4a4276;
 z-index:19;animation:blinkc 1.6s steps(2) infinite}
/* ── 등록 화면 ──
   이름을 넣고 나서 메신저로 들어가기 전에 지나간다. 저절로 안 넘어간다.

   읽기만 하는 화면이 아니라 유저가 채우는 화면이다. 여기서 채운 빈칸은
   그대로 서버로 가서 인물이 알게 되는 값이다(user_profile). 그러니 이 앱을
   여는 첫 동작이 "나를 적는 것"이어야 맞다. 나중에 you 메뉴로 다시 고칠 수 있다.

   막대는 채운 칸 수를 그대로 보여준다. 다 안 채워도 들어갈 수 있다 —
   비워두는 것도 이 이야기에서는 답이다. DAYS LEFT는 끝까지 null이다. */
.enr{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
 padding:26px;background:#17123a}
.enr.out{animation:enrOut .42s steps(5) both}
@keyframes enrOut{
 0%{transform:scaleY(1);opacity:1}
 72%{transform:scaleY(.06);opacity:1}
 100%{transform:scaleY(.02);opacity:0}}
.enr .ecard{width:100%;max-width:286px;border:1px solid #5d5490;background:#1e1848;
 box-shadow:5px 5px 0 rgba(0,0,0,.35);animation:fadeUp .4s steps(4) both}
.enr .etb{display:flex;align-items:center;background:linear-gradient(90deg,#6b4aa8,#8a6fd0);color:#fff;
 font-size:9.5px;letter-spacing:.18em;padding:5px 9px}

 border-bottom:1px dotted #443a7d}

.enr .eline:nth-of-type(1){animation-delay:.30s}
.enr .eline:nth-of-type(2){animation-delay:.55s}
.enr .eline:nth-of-type(3){animation-delay:.80s}

.enr .blank{color:#ffb0d4;background:#2a2159;border-color:#6b5fa8}

.enr .blank.filled{color:#fff;border-style:solid}

.enr .ebar i{display:block;height:100%;background:linear-gradient(90deg,#ff8fbe,#c3b2f0);
 transition:width .35s steps(6)}
.enr .emsg{margin-top:8px;font-size:8.5px;letter-spacing:.18em;color:#8a7ac4}
.enr .emsg.done{color:#8fe0b0}
.enr .ego{width:100%;margin-top:13px;padding:9px;font-family:inherit;font-size:12px;letter-spacing:.3em;

@keyframes enrRow{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

function presence(id, now){
  const h=(now||new Date()).getHours();
  if(id==="jaeeon"){
    if(h>=8&&h<17)  return {s:"on",  t:"보건실"};
    if(h>=17&&h<23) return {s:"away",t:"퇴근"};
    if(h>=23||h<1)  return {s:"away",t:"집"};
    return {s:"off", t:"자는 중"};
  }
  if(id==="minhyun"){
    if(h>=8&&h<16)  return {s:"away",t:"수업 중"};
    if(h>=16&&h<22) return {s:"on",  t:"야자"};
    if(h>=22||h<2)  return {s:"on",  t:"안 자는 중"};
    return {s:"off", t:"꺼짐"};
  }
  return null;
}

   백엔드는 유저별 저장소도 없다. 돌아왔을 때 만들고 시각을 과거로 찍으면
   화면에 보이는 결과는 같고 값은 돌아온 사람 수만큼만 든다. */
const AUTO_AWAY=60*60*1000;    // 이만큼 자리를 비운 뒤에 있었던 일로 찍는다
const AUTO_MAX_DAY=2;          // 하루 상한. 관전 프롬프트가 22,000자로 제일 비싸다
const loadAutoDay=()=>{try{return localStorage.getItem("null_auto_day")||""}catch(e){return""}};
const saveAutoDay=v=>{try{localStorage.setItem("null_auto_day",v)}catch(e){}};
/* 다녀온 자리 / 거절한 자리. 서버가 다음 제안을 고르는 근거다 */
const loadMet=()=>{try{return JSON.parse(localStorage.getItem("null_met"))||[]}catch(e){return[]}};
const saveMet=a=>{try{localStorage.setItem("null_met",JSON.stringify(a))}catch(e){}};
const loadRefused=()=>{try{return JSON.parse(localStorage.getItem("null_refused"))||[]}catch(e){return[]}};
const saveRefused=a=>{try{localStorage.setItem("null_refused",JSON.stringify(a))}catch(e){}};
/* 눌러서 만드는 사건(선물·해금·약속) 말고, 그냥 쌓여서 되는 사건이 둘 있다.
   한 번씩만 찍는다 — 같은 일이 매일 나오면 그건 사건이 아니라 배경이다. */
const PHOTO_EVENT_AT=5;      // 재언에게 사진을 이만큼 받으면 민현이 눈치챈다
const DDAY_MARKS=[7,3,1];    // 남은 날이 이 값이 되는 날
const loadEvDone=()=>{try{return JSON.parse(localStorage.getItem("null_ev_done"))||[]}catch(e){return[]}};
const saveEvDone=a=>{try{localStorage.setItem("null_ev_done",JSON.stringify(a))}catch(e){}};
const loadAutoEvent=()=>{try{return JSON.parse(localStorage.getItem("null_auto_event"))}catch(e){return null}};
const saveAutoEvent=v=>{try{v?localStorage.setItem("null_auto_event",JSON.stringify(v)):localStorage.removeItem("null_auto_event")}catch(e){}};
const loadAutoAt=()=>{const v=+localStorage.getItem("null_auto_at");return v||0};
const saveAutoAt=t=>{try{localStorage.setItem("null_auto_at",String(t))}catch(e){}};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

/* ── 사진첩(Cam) ──
   처음부터 다 보여주면 앨범이 아니라 목록이다.
   실제로 받은 사진만 한 장씩 꽂힌다. 대화 기록에서 그대로 뽑으므로 별도 저장이 없다. */
function seenPhotos(msgs){
  const set=new Set();
  Object.values(msgs||{}).forEach(list=>(list||[]).forEach(m=>{if(m.photo)set.add(m.photo)}));
  return set;
}

/* 프로필 사진 줄맄 스타일 */
/* 확대율·위치는 사진마다 다르다. 사진을 갈아끼우면 CHARS의 zoom/pos를 다시 잡을 것.
   너무 키우면 머리 위가 잘린다 — 150% 근처가 머리 전체가 들어오는 한계다. */
const faceBg=ch=>({backgroundImage:`url("${ch.img+AV_V}")`,backgroundSize:ch.zoom||"150%",backgroundPosition:ch.pos,backgroundColor:ch.pale});
function Avatar({room,size=42,onProfile,heat}){
  const st={width:size,height:size,...(heat!=null?heatRing(CHARS[room.id],heat):null)};
  // 1:1 방의 얼굴만 눌러서 프로필로 들어간다. 단톡/관전방은 대상이 없다.
  const hit=onProfile&&room.type==="dm"
    ? {className:"avatar face clickable",onClick:e=>{e.stopPropagation();onProfile(room.id)}}
    : {className:"avatar face"};
  if(room.type==="group"){ // 물방울
    return <div className="avatar" style={{...st,background:"linear-gradient(180deg,#ffffff,#e0ecfa)"}}><BubbleIcon size={size*.6}/></div>;
  }
  if(room.type==="watch"){ // 관전방: 달
    return <div className="avatar" style={{...st,color:"#8a7fc0",background:"linear-gradient(180deg,#ffffff,#dde3f4)"}}><MoonIcon size={size*.5}/></div>;
  }
  return <div {...hit} style={{...st,...faceBg(CHARS[room.id])}}/>;
}

   관계 단계에 따라 상태메시지와 프로필 뮤직이 바뀐다.
   단계 기준(0/16/40/80)은 worker.js의 STAGES와 같아야 한다. */
/* 프로필이 바뀌는 지점. 마지막 120은 .hidden의 일기가 열리는 지점과 같다 —
   마지막 달에 배경과 일기가 함께 열린다.
   worker.js의 STAGES는 0/16/40/80 네 단계로 모델의 연기 톤을 정한다.
   그쪽은 "관계가 어디까지 왔나"고 이쪽은 "화면이 어떻게 보이나"라 길이가 달라도 된다.
   다만 HEAT는 이 배열과 길이가 같아야 한다. */
const STAGE_AT=[0,16,40,80,120];
const stageIdx=n=>{let i=0;STAGE_AT.forEach((a,k)=>{if(n>=a)i=k});return i};

/* 인물마다 넉 장. 관계가 깊어지면 배경과 같이 다음 곡이 걸린다.
   단계는 다섯인데 곡은 넷이라, 처음 두 단계(0~16)가 첫 곡을 같이 쓴다 —
   아직 아무 일도 안 일어난 구간이라 곡이 바뀔 이유가 없다.

/* 단계별 프로필 — 상태메시지(빈 문자열이면 안 띄운다) / 배경 / BGM.

/* 프로필 뮤직 — 눌러야 나온다. 곡 정보가 비어 있으면 "BGM 없음"으로 둔다.
   (없는 곡 제목을 지어내지 않기 위해 TRACKS의 artist/title은 비워둔 상태다) */
/* 배경 파일이 아직 없을 수 있다(사진은 나중에 올라온다).
   CSS background-image는 파일이 없어도 알려주지 않고 그냥 빈 화면이 되므로,
   먼저 불러보고 실패하면 그 인물의 기존 배경으로 돌아간다.
   파일을 올리는 순간 코드를 고치지 않아도 새 배경이 뜬다. */
function useBg(src,fallback){
  const [ok,setOk]=useState(null);   // null=확인 중
  useEffect(()=>{
    if(!src){setOk(false);return}
    let alive=true; const img=new Image();
    img.onload =()=>{if(alive)setOk(true)};
    img.onerror=()=>{if(alive)setOk(false)};
    img.src=src;
    return()=>{alive=false};
  },[src]);
  return ok?src:fallback;   // 확인 중에도 fallback을 보여준다 — 빈 화면이 깜빡이지 않게
}

function MusicBar({track,color,onPlay}){
  const ref=useRef(null);
  const [playing,setPlaying]=useState(false);
  const [dead,setDead]=useState(false);   // 파일이 없으면 재생 불가로 처리
  useEffect(()=>{const a=ref.current;return()=>{if(a)a.pause()}},[]);
  const label=track?[track.artist,track.title].filter(Boolean).join(" — "):"";
  if(!track||dead)return <div className="pfbgmoff">♪  no bgm</div>;
  const toggle=()=>{
    const a=ref.current;if(!a)return;
    if(playing){a.pause();setPlaying(false)}
    // 인물 BGM이 시작되면 데스크 CD는 멈춘다 — 두 곡이 겹쳐 나오면 안 된다
    else a.play().then(()=>{onPlay&&onPlay();setPlaying(true)}).catch(()=>setDead(true));
  };
  return <React.Fragment>
    <audio ref={ref} src={track.src} loop preload="none" onError={()=>setDead(true)} onEnded={()=>setPlaying(false)}/>
    <button className={"pfbgm"+(playing?" on":"")} onClick={toggle} style={{color}}>
      {playing&&<span className="np">now playing</span>}
      <span className="play" style={{borderColor:color,color}}>{playing?"❚❚":"▶"}</span>
      <span className="lab">{label||"press play ♪"}</span>
      <span className="eq"><i/><i/><i/></span>
    </button>
  </React.Fragment>;
}

function Profile({char,count,onBack,gifts}){
  const ch=CHARS[char], p=PROFILES[char], room=roomOf(char);
  const [full,setFull]=useState(false);   // 배경만 크게 보기
  const st=p?(p.stages[stageIdx(count)]||p.stages[0]):null;
  /* 배경은 단계를 따라간다. 파일이 아직 없으면 그 인물의 기존 배경으로 돌아간다.
     훅은 아래 조건부 return보다 위에 있어야 한다 — 밑으로 내려가면 렌더마다
     훅 호출 수가 달라져서 React가 터진다. */
  /* 배경 우선순위: 유저가 준 선물 > 단계 배경. 자동으로 바뀌는 것보다
     유저가 건 것이 앞선다 — 그게 이 기능의 요지다.
     다만 GIFT_AT 단계는 지나야 한다. 주자마자 걸리면 사는 것이지 관계가 아니다. */
  const given=(gifts&&gifts[char])||[];
  /* 배경이 되는 건 사진이 있는 선물뿐이다. 그냥 마지막 선물을 집으면
     사진 없는 걸 방금 준 순간 단계 배경까지 같이 날아간다.
     그래서 뒤에서부터 사진 있는 것을 찾는다. */
  const hung=stageIdx(count)>=GIFT_AT
    ? given.slice().reverse().find(k=>(GIFTS.find(g=>g.key===k)||{}).bg) : null;
  const wanted=hung?(GIFTS.find(g=>g.key===hung)||{}).bg:(st&&st.bg);
  const bg=useBg(wanted,(p&&p.fallback)||char+"-bg.webp");
  if(!ch||!p)return null;
  const status=(st.status||"").trim();
  return <div className="pfscreen" style={{backgroundImage:`url("${bg}")`}}>
    <div className="pfdim" onClick={e=>{if(e.target===e.currentTarget)setFull(true)}}>
      <Sparkles/>
      <div className="pfcard">
        <div className="tb" style={{background:`linear-gradient(90deg, ${rgba(ch.color,.95)}, #ffb0d4)`}}>
          {char}.hompy<WinDots onClose={onBack}/>
        </div>
        <div className="pftop">
          <div className="pfpola">
            <span className="tape t1"/><span className="tape t2"/>
            <div className="shot" style={faceBg(ch)}/>
            <div className="cap">{room?room.empty:""}</div>
          </div>
          <div className="pfnamerow">
            <span className="deco" style={{color:ch.dk}}>✦</span>
            <span className="nm">{ch.name}</span>
            <span className="deco" style={{color:"#ff7fae"}}>♡</span>
          </div>
          {status&&<div className="pfbubble"><div className="b">{status}</div><div className="tail"/></div>}
        </div>
        <MusicBar track={trackOf(st.track)} color={ch.dk}/>
        <div className="pfstats">
          <div className="s"><span className="l">TODAY</span><span className="v" style={{color:"#ff7fae"}}>1</span></div>
          <div className="s"><span className="l">TALK</span><span className="v" style={{color:ch.dk}}>{count}</span></div>
        </div>
        <div className="pfstickers">
          {["✿","★","♡","✧","☾"].map((x,i)=><span key={i} style={{color:["#ff9ec6","#ffd68a","#c3b2f0","#8fd8e8","#ffb0d4"][i]}}>{x}</span>)}
        </div>
        <button className="pfclose bevel" onClick={onBack}>◁  back</button>
      </div>
    </div>
    {full&&<div className="bgfull" style={{backgroundImage:`url("${bg}")`}} onClick={()=>setFull(false)}>
      <span className="bgclose">tap to close</span>
    </div>}
  </div>;
}

/* ── 소개 영상 ── 데스크 CD를 누르면 11초 돌고 끝난다.
   연출은 전부 CSS이고 여기서는 타임코드·건너뛰기·소리만 맡는다. */
/* 얼굴이 안 나온 사진만 고른다. 사람은 있되 얼굴은 안 보이는 것 —
   뒷모습, 폰으로 가린 셀카, 그림자. 얼굴이 나오는 사진을 잘라서 가리는 게
   아니라 처음부터 그렇게 찍힌 사진만 쓴다.
   민현 → 재언 → 민현 → 재언으로 번갈아 놓는다. 마지막 재언 뒷모습에는
   유저가 준 머그가 식은 채로 같이 찍혀 있어서 "당신이 모르는 건 따로 있다"
   자리에 뒀다.
   주의: 민현 쪽에서 얼굴이 안 나온 사진은 전부 PROFILES의 단계 배경이기도
   하다. 영상에 쓰면 나중에 해금될 배경이 먼저 보인다. 지금은 그걸 감수하고
   얼굴이 제일 잘 가려진 것을 골랐다. */
const FILM_SHOTS=["minhyun-roof.webp","jaeeon-shelf.webp","minhyun-street.webp","jaeeon-back.webp"];
/* 소개 영상 브금. 부팅 로고곡과 다른 곡이다 */
const FILM_TRACK="null-film.mp3";
const FILM_LINES=["겨울이 끝나간다","당신은 한 달 뒤에 떠난다","두 사람은 그걸 알고 있다","당신이 모르는 건 따로 있다"];
function IntroFilm({onClose}){
  const [sec,setSec]=useState(0);
  const [done,setDone]=useState(false);   // 결말로 건너뛰었나
  const [out,setOut]=useState(false);
  const audio=useRef(null);
  /* 곡을 끝까지 못 듣고 나가는 게 보통이라 반복시킨다. 안 그러면 기다리는
     동안 곡이 먼저 끝나 조용해진다. */
  const fade=(a)=>{
    if(!a||a.faded)return; a.faded=true;
    const f=setInterval(()=>{if(a.volume>.04)a.volume=Math.max(0,a.volume-.03);
      else{a.pause();clearInterval(f)}},45);
    setTimeout(()=>{clearInterval(f);a.pause()},1400);
  };
  useEffect(()=>{
    const a=new Audio(FILM_TRACK); a.volume=.6; a.loop=true; audio.current=a; a.play().catch(()=>{});
    const t=setInterval(()=>setSec(v=>Math.min(11,v+1)),1000);
    return()=>{clearInterval(t);fade(a)};
  },[]);
  /* 나가기 시작할 때 소리도 같이 줄인다. 언마운트에서만 줄이면 화면이 다 사라진
     뒤에야 페이드가 시작돼서, 닫히는 순간에는 그대로 뚝 끊긴 것처럼 들린다. */
  const leave=()=>{if(out)return;setOut(true);fade(audio.current);setTimeout(onClose,450)};
  // 처음 누르면 결말로 건너뛰고, 거기서 또 누르면 닫힌다
  const tap=()=>{ if(!done){setDone(true);setSec(11);return} leave() };
  const mm=String(Math.floor(sec/60)).padStart(2,"0"), ss=String(sec%60).padStart(2,"0");
  return <div className={"film"+(done?" skipped":"")+(out?" out":"")} onClick={tap}>
    <div className="stage">
      {FILM_SHOTS.map((f,i)=><div key={f} className={"fr f"+(i+1)} style={{backgroundImage:`url("${f}")`}}/>)}
      <div className="glitter"/>
      <span className="tw" style={{left:"11%",top:"16%"}}>✦</span>
      <span className="tw" style={{left:"82%",top:"12%",animationDelay:".7s"}}>✦</span>
      <span className="tw" style={{left:"74%",top:"74%",animationDelay:"1.4s"}}>✦</span>
      <span className="tw" style={{left:"16%",top:"80%",animationDelay:"2s"}}>✦</span>
      <div className="lines">{FILM_LINES.map((t,i)=><div key={i} className={"ln ln"+(i+1)}>{t}</div>)}</div>
      <div className="blackout"/>
      <div className="ending">
        <span className="heart" style={{left:"22%",top:"32%"}}>♡</span>
        <span className="heart" style={{right:"20%",top:"38%",animationDelay:"1s"}}>✦</span>
        <div className="logo">NULL</div>
        <div className="rainbow"/>
        <div className="sub">the blank u fill in</div>
        <span className="heart" style={{left:"30%",bottom:"30%",animationDelay:"1.6s"}}>✦</span>
      </div>
    </div>
    <div className="track t1"/><div className="track t2"/><div className="rgb"/><div className="scan"/>
    <div className="hud top"><span className="rec"><i className="dot"/>REC</span>
      <span className="tc">00:{mm}:{ss}</span></div>
    <div className="hud bot"><span className="play">▶ PLAY</span>
      <span className="skip">{done?"tap to close":"tap to skip"}</span></div>
    <span className="sticker" style={{left:"8%",top:"33%",transform:"rotate(-12deg)",color:"#ffe3f6"}}>☆彡</span>
    <span className="sticker" style={{right:"7%",bottom:"16%",transform:"rotate(9deg)",color:"#ffd0e6"}}>♡ 2026</span>
    <span className="tape" style={{left:-10,top:"23%",transform:"rotate(-16deg)"}}/>
    <span className="tape" style={{right:-12,bottom:"31%",transform:"rotate(13deg)"}}/>
  </div>;
}

    a.play().then(()=>setArmed(true)).catch(()=>setArmed(false));
    /* loop만 켜두면 끝에서 앞으로 뚝 끊긴다. 끝 2.2초를 줄이고 처음 1.2초를 올려
       한 바퀴 돌 때 숨을 한 번 쉬는 것처럼 들리게 한다. timeupdate는 초당 네 번쯤이라
       그 간격으로 볼륨을 만지면 지직거려서, 50ms로 직접 잰다. */
    const ramp=setInterval(()=>{
      const d=a.duration, t=a.currentTime;
      if(!d||!isFinite(d)){a.volume=BOOT_VOL;return}
      const up=Math.min(1,t/1.2), down=Math.min(1,Math.max(0,d-t)/2.2);
      a.volume=BOOT_VOL*Math.min(up,down);
    },50);
    return()=>{
      clearInterval(ramp);   // 나가는 페이드와 싸우지 않게 먼저 끈다
      const f=setInterval(()=>{if(a.volume>.06)a.volume-=.06;else{a.pause();clearInterval(f)}},60);
      setTimeout(()=>{clearInterval(f);a.pause()},900);
    };
  },[]);
  const wake=()=>{const a=audio.current;if(!armed&&a)a.play().then(()=>setArmed(true)).catch(()=>{})};
  const go=()=>{const t=v.trim();if(t)onEnter(t)};
  return <div className="screen splash" onClick={wake}>
    <Bubbles/>
    <Sparkles/>
    <div className="spstack">
      <span className="spcd"/>
      <div className="spcard">
        <div className="sptb">null.exe<WinDots/></div>
        <div className="spbody">
          <div className="splogo">NULL<i className="cur">_</i></div>
          <input className="spinput" value={v} maxLength={12} placeholder="안녕, 널 입력해줘."
            onChange={e=>setV(e.target.value)} onFocus={wake} onKeyDown={e=>e.key==="Enter"&&go()}/>
          <button className="spgo" disabled={!v.trim()} onClick={go}>Click!</button>
        </div>
      </div>
      {/* 이 화면에서 이야기를 말하는 건 이 셋뿐이다 */}
      <div className="spwin w1" style={{animationDelay:".2s"}}>
        <div className="sptb" style={{background:"linear-gradient(90deg,#b9a8ea,#8a7fc0)"}}>Error<WinDots/></div>
        <div className="spbd">이름을 입력해야 존재할 수 있어요.<div className="spbtn">ok</div></div>
      </div>
      {/* 커서는 창에 매달아 둔다 — 좌표로 놓으면 글자를 깔고 앉는다 */}
      <div className="spcurwrap w2">
        <div className="spwin" style={{animationDelay:".35s"}}>
          <div className="sptb" style={{background:"linear-gradient(90deg,#ff7fae,#ff5fa8)"}}>System error<WinDots/></div>
          <div className="spbd">당신을 찾을 수 없습니다.<div className="spbtn">Cancel</div></div>
        </div>
        <SpCursor/>
      </div>
      <div className="spwin w3" style={{animationDelay:".5s"}}>
        <div className="sptb" style={{background:"linear-gradient(90deg,#8fd8e8,#c3b2f0)"}}>loading...<WinDots/></div>
        <div className="spbd" style={{background:"#fff8fc"}}>
          <span className="spbar"><i/></span>
        </div>
      </div>
    </div>
    <div className="sptap">{armed?"♪ NULL!":"TAP FOR MUSIC ♪"}</div>
  </div>;
}

  const [edit,setEdit]=useState(false);

  const done=()=>{setEdit(false);onSave(v.trim())};

/* ── 채팅방 ── */
function ChatRoom({room,msgs,busy,failed,onBack,onSend,onRetry,onProfile}){
  const [v,setV]=useState("");
  const [zoom,setZoom]=useState(null);   // 사진 확대해서 보기
  const boxRef=useRef(null);
  const watch=room.type==="watch";
  useEffect(()=>{const el=boxRef.current;if(el)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})},[msgs.length,busy,failed]);
  const send=()=>{const t=v.trim();if(!t||busy)return;setV("");onSend(t)};
  const senderMeta=s=>s==="user"?null:(CHARS[s]||{name:s,color:"#9aa3d8",pale:"#e2e6f5",dk:"#6b5fa8"});
  return <div className={"screen"+(watch?" watchbg":"")}>
    <div className="tb" style={{background:watch?"linear-gradient(90deg,#aab3d6,#c9c0ee)":`linear-gradient(90deg, ${rgba(room.color,.95)}, #c3b2f0)`}}>
      {room.name}{watch?".cam":".chat"}<WinDots/>
    </div>
    <div className="chatbar">
      <button className="backbtn bevel" onClick={onBack}><BackIcon/></button>
      <Avatar room={room} size={31} onProfile={onProfile}/>
      <div>
        <div className="cname">{room.name}</div>
        <div className="csub">{watch?<><span className="rec"/> watching</>:room.sub}</div>
      </div>
    </div>
    <div className="msgs" ref={boxRef}>
      {msgs.length===0&&!busy&&room.empty&&<div className="empty">
        <span style={{fontSize:13,color:"#ff8fbe"}}>✧ ✦ ✧</span><br/>{room.empty}
      </div>}
      {msgs.map((m,i)=>{
        const prev=msgs[i-1];
        const gap=!prev||m.ts-prev.ts>10*60*1000;
        const me=m.sender==="user";
        const meta=senderMeta(m.sender);
        // 클러스터 시작. 지문 줄이 끼면 흐름이 끊기므로 다음 말은 프로필부터 다시 보여준다
        const head=gap||!prev||prev.sender!==m.sender||isNarr(prev);
        const showName=head&&!me&&(room.type==="group"||watch);
        return <React.Fragment key={m.id||i}>
          {gap&&<div className="divider">✦ {fmtDivider(m.ts)} ✦</div>}
          {isNarr(m)
          ?<div className="narr">{m.text}</div>
          :<div className={"mrow"+(me?" me":"")} style={{marginTop:head?8:0}}>
            {!me&&(head?
              <div className={"mavatar"+(meta.img?" face":"")+(CHARS[m.sender]?" clickable":"")}
                   onClick={()=>CHARS[m.sender]&&onProfile&&onProfile(m.sender)}
                   style={meta.img?faceBg(meta):{background:`linear-gradient(180deg,#ffffff, ${meta.pale}`+")"}}>{!meta.img&&<CharIcon id={m.sender} size={13}/>}</div>
              :<div className="sp"/>)}
            <div className="mcol">
              {showName&&<span className="mname" style={{color:meta.dk}}>{meta.name}</span>}
              <div className={"bubble"+(m.photo?" photo":"")} style={me?{background:`linear-gradient(135deg, ${rgba(room.color,.5)} 0%, #ffffff 135%)`}:null}>
                {m.photo
                  ?<React.Fragment>
                    <img src={photoSrc(m.photo)} alt="" loading="lazy" onClick={()=>setZoom(photoSrc(m.photo))}/>
                    {m.text&&<div className="cap">{m.text}</div>}
                  </React.Fragment>
                  :m.text}
              </div>
            </div>
          </div>}
        </React.Fragment>;
      })}
      {busy&&<div className="mrow" style={{marginTop:8}}>
        <div className="mavatar" style={{background:"#ece8fa"}}/>
        <div className="bubble typing"><i/><i/><i/></div>
      </div>}
      {failed&&!busy&&<button className="retry" onClick={onRetry}>
        no reply... try again?
        {failed.detail&&<span className="why">{failed.detail}</span>}
      </button>}
    </div>
    {watch?
      <div className="watchbar"><span className="rec"/>u can't join this one</div>
      :<div className="inputbar">
        <input className="sunken" value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button className="sendbtn bevel" disabled={!v.trim()||busy} onClick={send} style={{background:`linear-gradient(180deg, #ffffff -30%, ${room.color} 95%)`}}><SendIcon/></button>
      </div>}
    {zoom&&<div className="lightbox" onClick={()=>setZoom(null)}><img src={zoom} alt=""/></div>}
  </div>;
}

/* ── 앱 ── */
function App(){
  const [name,setName]=useState(()=>localStorage.getItem("null_name")||"");
  const [profile,setProfile]=useState(loadProfile);
  const [store,setStore]=useState(loadStore);
  const [unlocked,setUnlocked]=useState(loadUnlocked);
  const [gifts,setGifts]=useState(loadGifts);   // {jaeeon:["mug"], ...} 누구에게 뭘 줬나
  const [toast,setToast]=useState(null);            // 해금 알림
  const [view,setView]=useState("list");            // 'list' | roomId
  const [busy,setBusy]=useState({});                // 방별 타이핑 인디케이터
  const [failed,setFailed]=useState({});            // 방별 실패 payload (재시도용)
  const [autoLoading,setAutoLoading]=useState(false);
  const viewRef=useRef(view); viewRef.current=view;
  const storeRef=useRef(store); storeRef.current=store;
  const profileRef=useRef(profile); profileRef.current=profile;
  const unlockedRef=useRef(unlocked); unlockedRef.current=unlocked;
  const giftsRef=useRef(gifts); giftsRef.current=gifts;
  const queueRef=useRef([]);                        // 순차 표시 대기열
  const runningRef=useRef(false);
  const inflightRef=useRef({});
  useEffect(()=>{saveStore(store)},[store]);
  useEffect(()=>{try{localStorage.setItem("null_profile",JSON.stringify(profile))}catch(e){}},[profile]);
  useEffect(()=>{saveUnlocked(unlocked)},[unlocked]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t)},[toast]);

  /* 메시지 추가 (+현재 안 보고 있는 방이면 unread 증가) */
  const appendMsg=(room,msg)=>setStore(s=>({
    msgs:{...s.msgs,[room]:[...(s.msgs[room]||[]),msg]},
    unread:viewRef.current!==room?{...s.unread,[room]:(s.unread[room]||0)+1}:s.unread
  }));

  /* 대기열 처리: 0.6초 간격 순차 등장 */
  const pump=()=>{
    if(runningRef.current)return;
    runningRef.current=true;
    const step=()=>{
      const it=queueRef.current.shift();
      if(!it){runningRef.current=false;return}
      appendMsg(it.room,{id:Date.now()+Math.random(),sender:it.sender,text:it.text,photo:it.photo,ts:Date.now()});
      if(!queueRef.current.some(q=>q.room===it.room)&&!inflightRef.current[it.room])
        setBusy(b=>({...b,[it.room]:false}));
      setTimeout(step,600);
    };
    setTimeout(step,500); // 타이핑 인디케이터를 잠깐 보여준 뒤 첫 버블
  };
  const enqueue=(room,messages)=>{
    messages.forEach(m=>{
      if(!m)return;
      const photo=photoSrc(m.photo)?m.photo:null;   // 없는 파일이면 사진은 버리고 말만 남긴다
      const text=(m.text||"").trim();
      if(text||photo)queueRef.current.push({room,sender:m.sender||room,text,photo});
    });
    pump();
  };

  /* history / signals / counts / user_profile 구성 */
  const buildHistory=ms=>ms.slice(-30).map(m=>({role:m.sender==="user"?"user":"assistant",sender:m.sender,
    content:m.photo?((m.text?m.text+" ":"")+"(사진을 보냈다)"):m.text}))
    .filter(m=>m.content&&m.content.trim());
  /* 최근에 보낸 사진 — 같은 사진이 연달아 나오지 않게 백엔드에 알려준다 */
  const recentPhotos=room=>{
    const ms=(storeRef.current.msgs[room]||[]).slice(-24),out=[];
    for(let i=ms.length-1;i>=0&&out.length<4;i--) if(ms[i].photo&&!out.includes(ms[i].photo))out.push(ms[i].photo);
    return out;
  };
  /* 방별 누적 대화 수 — 관계 단계와 .hidden 해금의 근거.
     방금 보낸 메시지는 아직 상태에 반영되기 전이라 override로 직접 넘긴다 */
  const roomCounts=override=>{
    const c={};
    ["jaeeon","minhyun","group","health"].forEach(r=>{
      c[r]=(override&&override[r]!=null)?override[r]:(storeRef.current.msgs[r]||[]).length;
    });
    return c;
  };
  const buildSignals=exclude=>{
    const sig={},t0=new Date();t0.setHours(0,0,0,0);
    ["jaeeon","minhyun","group"].forEach(r=>{
      if(r===exclude)return;
      const ms=storeRef.current.msgs[r]||[];if(!ms.length)return;
      sig[r]={count:ms.filter(m=>m.ts>=t0.getTime()).length,minsAgo:Math.max(0,Math.floor((Date.now()-ms[ms.length-1].ts)/60000))};
    });
    return sig;
  };
  /* 채워진 칸만 보낸다 */
  const userProfile=()=>{
    const out={};
    Object.entries(profileRef.current).forEach(([k,v])=>{if(v)out[k]=v});
    return Object.keys(out).length?out:null;
  };

  /* 같이 가자는 제안이 오면 답을 받는다. 수락하면 그 자리에 다녀온 것이 되고,
     한 시간 뒤 관전방에서 다른 한 사람이 그 얘기를 꺼낸다. 거절하면 안 간다 —
     그리고 그 자리는 다시 안 나온다. 두 번 조르지 않는 것이 이 두 사람의 성격이다. */
  const [invite,setInvite]=useState(null);
  const answerInvite=ok=>{
    const iv=invite; setInvite(null); if(!iv)return;
    const line=ok?`${CHARS[iv.char].name}과 ${iv.place}에 가기로 했다`:`${iv.place}은 다음에 가기로 했다`;
    appendMsg(iv.char,{id:Date.now()+Math.random(),sender:"user",sys:true,text:line,ts:Date.now()});
    if(ok){ saveMet([...loadMet(),iv.place]); markEvent({kind:"met",to:iv.char,name:iv.place}); }
    else  { saveRefused([...loadRefused(),iv.place]); }
  };

  /* 백엔드가 알려준 해금 목록을 반영하고, 새로 열린 게 있으면 알린다 */
  const applyUnlocked=list=>{
    if(!Array.isArray(list)||!list.length)return;
    const now=unlockedRef.current;
    const fresh=list.filter(k=>HIDDEN_LABEL[k]&&!now.includes(k));
    if(!fresh.length)return;
    setUnlocked([...now,...fresh]);
    setToast(fresh.length===1?`.hidden — ${HIDDEN_LABEL[fresh[0]]}`:`.hidden — ${fresh.length}개가 열렸다`);
    markEvent({kind:"unlock",name:HIDDEN_LABEL[fresh[0]]});
  };

  /* API 요청 — 실패 시 조용한 재시도 버튼 */
  const request=async(bucket,payload)=>{
    const up=userProfile();
    // 다녀온 자리·거절한 자리 — 서버가 다음 제안을 고르는 근거
    if(payload.mode==="chat"){ payload.met=loadMet(); payload.refused=loadRefused(); }
    if(up)payload.user_profile=up; else delete payload.user_profile;
    if(!payload.counts)payload.counts=roomCounts();
    inflightRef.current[bucket]=true;
    setBusy(b=>({...b,[bucket]:true}));
    setFailed(f=>({...f,[bucket]:null}));
    // 데모로 굳었으면 네트워크를 아예 타지 않는다
    if(demoOn()){
      inflightRef.current[bucket]=false;
      setTimeout(()=>enqueue(bucket,demoReply(bucket,demoAsk(payload),name)),450);
      return;
    }
    try{
      const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const data=await res.json().catch(()=>null);
      if(!res.ok){
        // 서버가 알려준 실패 사유를 그대로 들고 올라간다
        const err=new Error("HTTP "+res.status);
        err.detail=(data&&(data.detail||data.error))||("HTTP "+res.status);
        throw err;
      }
      inflightRef.current[bucket]=false;
      const list=(data&&data.messages)||[];
      if(list.length)enqueue(bucket,list);
      else setBusy(b=>({...b,[bucket]:false}));
      applyUnlocked(data&&data.unlocked);
      if(data&&data.invite&&data.invite.place) setInvite(data.invite);
    }catch(e){
      inflightRef.current[bucket]=false;
      setBusy(b=>({...b,[bucket]:false}));
      const detail=String(e.detail||e.message||e).slice(0,500);
      // 화면(재시도 버튼 아래)과 콘솔 양쪽에 남긴다 — 어느 쪽을 보든 원인이 보이게
      console.error("%c[NULL] 실패 원인 ▶ "+detail,"color:#c23b50;font-size:13px;font-weight:bold");
      /* 처음 실패하면 데모로 넘어간다. 저장소 링크만 보고 들어온 사람이
         재시도 버튼만 마주하는 것보다 각본이라도 움직이는 편이 낫다.
         원인은 위 콘솔에 그대로 남고 하단 바에 demo가 뜬다 — 조용히 가짜로
         바뀌면 진짜 장애를 못 알아채기 때문이다. */
      DEMO.auto=true;
      setBusy(b=>({...b,[bucket]:true}));
      setTimeout(()=>enqueue(bucket,demoReply(bucket,demoAsk(payload),name)),450);
    }
  };

  /* 일반 대화 전송 */
  const send=(room,text)=>{
    const userMsg={id:Date.now()+Math.random(),sender:"user",text,ts:Date.now()};
    appendMsg(room,userMsg);
    const next=[...(storeRef.current.msgs[room]||[]),userMsg];
    const history=buildHistory(next);
    request(room,{mode:"chat",room,user_name:name,history,signals:buildSignals(room),
      recent_photos:recentPhotos(room),counts:roomCounts({[room]:next.length})});
  };
  /* 선물 보내기.
     사진은 채팅창에 띄우지 않는다 — 줄글 한 줄만 남기고 반응은 인물이 알아서 한다.
     그 줄은 유저의 말이 아니라 일어난 일이므로 sys로 표시해 지문처럼 그린다.
     history에도 이 줄이 그대로 들어가서 모델이 "무엇을 받았는지" 알게 된다. */
  const giveGift=(char,gift,memo)=>{
    if(!char||!gift)return;
    const have=giftsRef.current[char]||[];
    if(have.includes(gift.key))return;              // 같은 걸 두 번 주지 않는다
    const next={...giftsRef.current,[char]:[...have,gift.key]};
    setGifts(next); saveGifts(next);
    const note=(memo||"").trim().slice(0,60);
    const line=`${CHARS[char].name}이 ${gift.name}을(를) 받았다`+(note?` — “${note}”`:"");
    const sysMsg={id:Date.now()+Math.random(),sender:"user",sys:true,text:line,ts:Date.now()};
    appendMsg(char,sysMsg);
    setToast(`${CHARS[char].name} — ${gift.name}`);
    markEvent({kind:"gift",to:char,name:gift.name});
    const nextMsgs=[...(storeRef.current.msgs[char]||[]),sysMsg];
    request(char,{mode:"chat",room:char,user_name:name,history:buildHistory(nextMsgs),
      signals:buildSignals(char),recent_photos:recentPhotos(char),
      counts:roomCounts({[char]:nextMsgs.length}),gift:{name:gift.name,key:gift.key,note}});
  };

  /* 재시도: 저장해둔 payload를 최신 history로 갱신해 다시 전송 */
  const retry=room=>{
    const p=failed[room]&&failed[room].payload;if(!p)return;
    if(p.mode==="chat")p.history=buildHistory(storeRef.current.msgs[room]||[]);
    p.recent_photos=recentPhotos(p.mode==="auto"?"health":room);
    request(room,p);
  };
  /* 시간 경과(달 버튼): 자율 대화 생성 → 관전방에 축적 */
  /* 선물이나 해금이 있으면 그 일을 적어둔다. 바로 만들지는 않는다 —
     유저가 자리를 비운 지 한 시간이 지나 다시 들어왔을 때 만든다.
     원문은 여전히 서버로 안 간다. 무슨 물건을 줬는지만 알려주고, 무슨 말이
     오갔는지는 프롬프트에서 못박아 막는다. */
  const markEvent=ev=>saveAutoEvent({...ev,at:Date.now()});

  /* 유저가 아무것도 안 눌러도 생기는 사건 둘.
     ① 재언에게 사진이 다섯 장 넘게 오면 — 민현이는 그 사진을 못 본다.
        찍는 것만 봤다. 그래서 묻는 쪽이 된다.
     ② 떠날 날이 7·3·1일 남는 날 — 둘 다 알지만 이름을 먼저 안 붙인다.
     찍어만 두고 만들지는 않는다. 한 시간 뒤 아래 효과가 가져간다. */
  useEffect(()=>{
    if(!name)return;
    const done=loadEvDone();
    const mark=(key,ev)=>{ if(done.includes(key))return false;
      saveEvDone([...loadEvDone(),key]); markEvent(ev); return true };
    const m=storeRef.current.msgs||{};
    const shots=(m.jaeeon||[]).filter(x=>x.photo&&x.sender!=="user").length;
    if(shots>=PHOTO_EVENT_AT&&mark("photos",{kind:"photos",to:"jaeeon"}))return;
    const all=Object.values(m).flat();
    const firstTs=all.reduce((a,x)=>!a||x.ts<a?x.ts:a,0);
    if(!firstTs)return;
    const d=Math.max(0,ENROLL_DAYS-Math.floor((Date.now()-firstTs)/864e5));
    if(DDAY_MARKS.includes(d))mark("dday:"+d,{kind:"dday",name:String(d)});
  },[name,view,store.msgs]);

  const autoBusy=useRef(false);
  useEffect(()=>{
    if(!name||view!=="list"||autoBusy.current)return;
    (async()=>{
      const ev=loadAutoEvent(); if(!ev||!ev.kind)return;
      const m=storeRef.current.msgs||{};
      const all=Object.values(m).flat();
      const lastAny=all.reduce((a,x)=>x.ts>a?x.ts:a,ev.at||0);
      const now=Date.now();
      if(now-lastAny<AUTO_AWAY)return;
      const day=new Date().toISOString().slice(0,10);
      const [d,n]=loadAutoDay().split("|");
      const used=d===day?Number(n)||0:0;
      if(used>=AUTO_MAX_DAY){ saveAutoEvent(null); return; }
      autoBusy.current=true;
      saveAutoEvent(null); saveAutoDay(`${day}|${used+1}`);
      saveAutoAt(now); setAutoAt(now);
      // 유저가 나가고 한 시간쯤 뒤의 일로 찍는다
      const at=Math.min(lastAny+AUTO_AWAY+Math.floor(Math.random()*30*60*1000),now-5*60*1000);
      let list=null;
      if(demoOn()){ list=demoReply("health"); }
      else{
        try{
          const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({mode:"auto",user_name:name,counts:roomCounts(),
              history:buildHistory(storeRef.current.msgs.health||[]),
              signals:buildSignals(null),event:{kind:ev.kind,to:ev.to,name:ev.name}})});
          const data=await res.json().catch(()=>null);
          if(res.ok&&data) list=data.messages;
        }catch(e){ /* 유저가 부른 적 없는 호출이라 실패를 알릴 이유가 없다 */ }
      }
      autoBusy.current=false;
      if(!list||!list.length)return;
      let t=at;
      list.forEach(x=>{
        if(!x)return;
        const photo=photoSrc(x.photo)?x.photo:null;
        const text=(x.text||"").trim();
        if(!text&&!photo)return;
        appendMsg("health",{id:t+Math.random(),sender:x.sender||"health",text,photo,ts:t});
        t+=40000+Math.floor(Math.random()*80000);
      });
    })();
  },[name,view]);

  const doAuto=async()=>{
    if(autoLoading)return;
    setAutoLoading(true);
    await request("health",{mode:"auto",user_name:name,
      history:buildHistory(storeRef.current.msgs.health||[]),signals:buildSignals(null),recent_photos:recentPhotos("health")});
    setAutoLoading(false);
  };

  /* [편집] 대화 저장: 전체 방 → .txt 다운로드 */
  const exportTxt=()=>{
    const lines=["NULL — 대화 기록","내보낸 시각: "+new Date().toLocaleString("ko-KR"),""];
    ROOMS.forEach(r=>{
      const ms=storeRef.current.msgs[r.id]||[];if(!ms.length)return;
      lines.push("──── "+r.name+" ────");
      ms.forEach(m=>{
        const who=m.sender==="user"?name:(CHARS[m.sender]?CHARS[m.sender].name:m.sender);
        lines.push(`[${fmtDivider(m.ts)}] ${who}: ${m.photo?"(사진) ":""}${m.text||""}`);
      });
      lines.push("");
    });
    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="NULL-대화기록.txt";a.click();
    URL.revokeObjectURL(a.href);
  };
  /* [대화] 읽음 처리 */
  const readAll=()=>setStore(s=>({...s,unread:{}}));
  /* [당신] 이름 변경 / 새로 시작 */
  const rename=n=>{localStorage.setItem("null_name",n);setName(n)};
  const reset=()=>{localStorage.clear();setStore({msgs:{},unread:{}});setProfile({});setUnlocked([]);setGifts({});setName("")};

  /* 데모에서는 캐릭터가 먼저 건다. 방을 열었는데 아무 말도 없으면 그건
     메신저가 아니라 빈 상자다. 처음 들어왔거나 한참 만에 들어왔을 때만
     한 번 — 들어올 때마다 말을 걸면 사람이 아니라 알림이 된다. */
  const demoGreet=id=>{
    if(!demoOn()||id==="health"||id==="group")return;
    const list=storeRef.current.msgs[id]||[];
    const gapMin=list.length?(Date.now()-list[list.length-1].ts)/60000:-1;
    if(gapMin>=0&&gapMin<180)return;
    const lines=demoProactive(id,demoWhen(gapMin,new Date().getHours()),name);
    if(lines.length)setTimeout(()=>enqueue(id,lines),700);
  };
  const openRoom=id=>{setView(id);setStore(s=>({...s,unread:{...s.unread,[id]:0}}));demoGreet(id)};
  /* 프로필 화면. 대화 수는 그 캐릭터가 낀 모든 방을 합쳐 센다 (worker의 단계 기준과 같다) */
  const [prof,setProf]=useState(null);
  const profCount=id=>{
    const s=storeRef.current.msgs||{};
    return (s[id]||[]).length+(s.group||[]).filter(m=>m.sender===id||m.sender==="user").length;
  };
  const [film,setFilm]=useState(false);   // 데스크 CD가 트는 소개 영상
  /* 이름을 넣으면 등록 화면이 한 번 지나간다. 처음 들어온 사람에게만이다 —
     이미 이름이 있으면 오프닝도 등록도 건너뛰고 바로 메신저다. */
  const [enrolling,setEnrolling]=useState(false);
  const enter=n=>{localStorage.setItem("null_name",n);setName(n);setEnrolling(true)};

  return <div className="phone">
    {enrolling&&<Enroll name={name} profile={profile} onDone={()=>setEnrolling(false)}
      onSaveField={(k,v)=>setProfile(p=>({...p,[k]:v}))}/>}
    {!name?<Splash onEnter={enter}/>
    :view==="list"?<RoomList store={store} name={name} unlocked={unlocked} counts={roomCounts()}
       onOpen={openRoom} onProfile={setProf} onAuto={doAuto} autoLoading={autoLoading}
       onExport={exportTxt} onReadAll={readAll} onRename={rename} onReset={reset} onToast={setToast}
       profile={profile} onSaveField={(k,v)=>setProfile(p=>({...p,[k]:v}))} onFilm={()=>setFilm(true)} gifts={gifts} onGift={giveGift} hearts={heartsOf(store,gifts)}/>
    :<ChatRoom room={roomOf(view)} msgs={store.msgs[view]||[]} busy={!!busy[view]} failed={failed[view]}
       onBack={()=>setView("list")} onSend={t=>send(view,t)} onRetry={()=>retry(view)} onProfile={setProf}/>}
    {invite&&<div className="dlgov" onClick={()=>answerInvite(false)}>
      <div className="dlg" onClick={e=>e.stopPropagation()}>
        <div className="tb">{CHARS[invite.char].name}<div className="dots"><span className="d3"/></div></div>
        <div className="dlgbody">
          <div className="dlgline" style={{textAlign:"center",padding:"10px 0",fontSize:13,color:"#8a4f74"}}>
            {invite.place}, 같이 갈래요?</div>
          <div className="dlgbtns">
            <button className="bevel pink" onClick={()=>answerInvite(true)}>갈게요</button>
            <button className="bevel" onClick={()=>answerInvite(false)}>다음에요</button>
          </div>
        </div>
      </div>
    </div>}
    {prof&&<Profile char={prof} count={profCount(prof)} onBack={()=>setProf(null)} gifts={gifts}/>}
    {film&&<IntroFilm onClose={()=>setFilm(false)}/>}
    {toast&&<div className="toast"><span>✧ {toast}</span></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
