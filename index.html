*{box-sizing:border-box;margin:0;padding:0}

}

input.cartq{width:100%;padding:8px 10px;font-size:14px;text-align:left}

   오류창이 이 이야기를 대신 말한다 — "당신을 찾을 수 없습니다".
   그래서 이름 칸이 여기 있다. 이름을 넣는 것이 곧 그 오류를 지우는 일이다.
   로고곡은 여기서 돌고, 들어갈 때 페이드아웃된다. */
/* BGM: 방울 — 아래에서 올라오며 살짝 흔들림 */

 animation:rise linear infinite,sway ease-in-out infinite alternate}

/* ── 등록 화면 ──
   이름을 넣고 나서 메신저로 들어가기 전에 잠깐 지나간다.
   이야기를 설명하지 않는다. 방금 적은 이름이 값으로 채워지는 것만 보여준다 —
   이 프로덕트의 이름이 NULL이고 유저는 비어 있는 값이라서, 그 칸이 채워지는
   순간이 곧 오프닝이다. 4.6초 뒤 저절로 넘어간다. */
.enr{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
 background:#17123a;animation:enrOut .5s ease-in 4.1s both}
.enr .ecard{width:100%;max-width:268px;border:1px solid #5d5490;background:#1e1848;
 box-shadow:5px 5px 0 rgba(0,0,0,.35);animation:fadeUp .4s steps(4) both}
.enr .etb{background:linear-gradient(90deg,#6b4aa8,#8a6fd0);color:#fff;font-size:9.5px;
 letter-spacing:.18em;padding:5px 9px}
.enr .ebody{padding:18px 16px 16px}
.enr .erow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
 padding:7px 0;border-bottom:1px dotted #443a7d;opacity:0;animation:enrRow .35s steps(3) both}
.enr .erow:nth-of-type(1){animation-delay:.35s}
.enr .erow:nth-of-type(2){animation-delay:1.00s}
.enr .erow:nth-of-type(3){animation-delay:1.65s}
.enr .erow span{font-size:8.5px;letter-spacing:.2em;color:#8a7ac4}
.enr .erow b{font-size:13px;font-weight:normal;color:#fff}
.enr .erow b.null{color:#6b5fa8}
.enr .ebar{margin-top:16px;height:6px;background:#2a2159;border:1px solid #5d5490;overflow:hidden}
.enr .ebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fbe,#c3b2f0);
 animation:bootBar 3.4s steps(14) .3s both}
.enr .emsg{margin-top:9px;font-size:8.5px;letter-spacing:.18em;color:#8a7ac4;opacity:0;
 animation:enrRow .4s steps(3) 2.3s both}
@keyframes enrRow{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
@keyframes enrOut{to{opacity:0;visibility:hidden}}

const demoAt={};
const demoPick=(key,arr)=>{const i=(demoAt[key]||0)%arr.length;demoAt[key]=i+1;return arr[i]};
function demoReply(bucket,lastText){
  if(bucket==="health")return demoPick("health",DEMO_AUTO);
  if(bucket==="group") return demoPick("group",DEMO_GROUP);
  const set=DEMO_LINES[bucket]; if(!set)return [{sender:bucket,text:"…"}];
  const b=demoBucket(lastText);
  return demoPick(bucket+":"+b,set[b]||set.any).map(t=>({sender:bucket,text:t}));
}

const fmtClock=ts=>{const d=new Date(ts);const h=d.getHours(),ap=h<12?"오전":"오후";return `${ap} ${h%12||12}:${String(d.getMinutes()).padStart(2,"0")}`};
const isToday=ts=>{const d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()};
const fmtDivider=ts=>isToday(ts)?fmtClock(ts):`${new Date(ts).getMonth()+1}월 ${new Date(ts).getDate()}일 ${fmtClock(ts)}`;

const MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const fmtDay=ts=>{const d=new Date(ts),y=d.getFullYear();
  return `${MON[d.getMonth()]} ${d.getDate()}`+(y!==new Date().getFullYear()?", "+y:"")};

/* ── 접속 상태 ──
   시간대만 보고 정한다. 서버를 부르지 않으므로 비용이 없다.
   재언은 근무 시간에 보건실에 있고, 민현은 학교에 매여 있다. */
function presence(id, now){
  const h=(now||new Date()).getHours();
  if(id==="jaeeon"){
    if(h>=8&&h<17)  return {s:"on",  t:"보건실"};
    if(h>=17&&h<23) return {s:"away",t:"퇴근"};
    if(h>=23||h<1)  return {s:"away",t:"집"};
    return {s:"off", t:"자는 중"};
  }
  if(id==="minhyun"){
    if(h>=8&&h<16)  return {s:"away",t:"수업 중"};
    if(h>=16&&h<22) return {s:"on",  t:"야자"};
    if(h>=22||h<2)  return {s:"on",  t:"안 자는 중"};
    return {s:"off", t:"꺼짐"};
  }
  return null;
}

function seenPhotos(msgs){
  const set=new Set();
  Object.values(msgs||{}).forEach(list=>(list||[]).forEach(m=>{if(m.photo)set.add(m.photo)}));

}

/* ── 캐릭터 프로필 ──
   관계 단계에 따라 상태메시지와 프로필 뮤직이 바뀐다.
   단계 기준(0/16/40/80)은 worker.js의 STAGES와 같아야 한다. */
/* 프로필이 바뀌는 지점. 마지막 120은 .hidden의 일기가 열리는 지점과 같다 —
   마지막 달에 배경과 일기가 함께 열린다.
   worker.js의 STAGES는 0/16/40/80 네 단계로 모델의 연기 톤을 정한다.
   그쪽은 "관계가 어디까지 왔나"고 이쪽은 "화면이 어떻게 보이나"라 길이가 달라도 된다.
   다만 HEAT는 이 배열과 길이가 같아야 한다. */
const STAGE_AT=[0,16,40,80,120];
const stageIdx=n=>{let i=0;STAGE_AT.forEach((a,k)=>{if(n>=a)i=k});return i};

/* 음원 위치. 저장소에 파일을 올리면 그대로 잡히고,
   R2 같은 외부 호스팅을 쓰면 MEDIA만 그 주소로 바꾸면 된다.
   파일이 없으면 재생 버튼은 조용히 숨는다. */
/* 앱(lib/profiles.ts)과 같은 R2 버킷·같은 파일명을 쓴다 */
const MEDIA="https://pub-6e08882e001c49cbb013168e4b9e8d38.r2.dev/";
const TRACKS={
  "jaeeon-1": {file:"jaeeon-1.mp3", artist:"Noah Vane", title:"Two Bowls"},
  "minhyun-1":{file:"minhyun-1.mp3",artist:"Luca Riot", title:"Ask Again Tomorrow"},
  // 메신저 자체의 BGM — 데스크 가운데 CD를 누르면 나온다.
  // R2에 null-1.mp3를 올리면 살아난다. 없으면 CD가 "no disc"만 띄운다.
  "null-1":   {file:"null-1.mp3",   artist:"",          title:""},
};
const MAIN_TRACK="null-1";
const trackOf=k=>{const t=k&&TRACKS[k];return t&&t.file?{...t,src:MEDIA+t.file}:null};

/* 단계별 프로필 — 상태메시지(빈 문자열이면 안 띄운다) / 배경 / BGM.
   bg는 관계가 깊어질수록 바뀐다. app/profiles.ts의 stages와 같아야 한다 —
   어긋나면 같은 사람 프로필이 웹과 앱에서 다른 배경으로 나온다.
   단계 경계(0/16/40/80)는 stageIdx가 정하고, worker.js의 STAGES와 맞춰져 있다. */
const PROFILES={
  // 재언 — 밝은 데서 어두운 데로 들어갔다가 마지막에 바다로 트인다
  jaeeon:{fallback:"jaeeon-bg.webp",stages:[
    {status:"",              bg:"jaeeon-museum.webp",  track:"jaeeon-1"},

    {status:"약 채워 놓을 것.",  bg:"jaeeon-night.webp",   track:"jaeeon-1"},
    {status:"정리할 것들.",     bg:"jaeeon-hall.webp",    track:"jaeeon-1"},
    {status:"괜찮습니다.",      bg:"jaeeon-stairs.webp",  track:"jaeeon-1"},
  ]},
  // 민현 — 안에서 밖으로 나가다가 마지막엔 옥상에 혼자다
  minhyun:{fallback:"minhyun-bg.webp",stages:[
    {status:"",                      bg:"minhyun-record.webp",   track:"minhyun-1"},
    {status:"보건실 침대가 제일 낫다",  bg:"minhyun-poster.webp",   track:"minhyun-1"},
    {status:"안 물어보면 말 안 함",    bg:"minhyun-elevator.webp", track:"minhyun-1"},
    {status:"남은 날 세는 중",         bg:"minhyun-street.webp",   track:"minhyun-1"},
    {status:"이제 안 셈",             bg:"minhyun-roof.webp",     track:"minhyun-1"},

};

/* 프로필 뮤직 — 눌러야 나온다. 곡 정보가 비어 있으면 "BGM 없음"으로 둔다.
   (없는 곡 제목을 지어내지 않기 위해 TRACKS의 artist/title은 비워둔 상태다) */
/* 배경 파일이 아직 없을 수 있다(사진은 나중에 올라온다).
   CSS background-image는 파일이 없어도 알려주지 않고 그냥 빈 화면이 되므로,
   먼저 불러보고 실패하면 그 인물의 기존 배경으로 돌아간다.
   파일을 올리는 순간 코드를 고치지 않아도 새 배경이 뜬다. */
function useBg(src,fallback){
  const [ok,setOk]=useState(null);   // null=확인 중
  useEffect(()=>{
    if(!src){setOk(false);return}
    let alive=true; const img=new Image();
    img.onload =()=>{if(alive)setOk(true)};
    img.onerror=()=>{if(alive)setOk(false)};
    img.src=src;
    return()=>{alive=false};
  },[src]);
  return ok?src:fallback;   // 확인 중에도 fallback을 보여준다 — 빈 화면이 깜빡이지 않게
}

/* 데스크 CD — 메신저 자체의 BGM.
   오디오를 App이 들고 있는 이유: 방에 들어가면 RoomList가 통째로 사라져서
   거기 있던 <audio>도 같이 죽는다. 그러면 방에 들어갈 때마다 음악이 끊긴다.
   파일이 없으면 조용히 아무 일도 안 일어나는 대신 "no disc"를 띄운다 —
   안 그러면 눌러도 반응이 없어서 고장인지 원래 그런 건지 알 수가 없다. */
function useMainBgm(){
  const ref=useRef(null);
  const [on,setOn]=useState(false);
  useEffect(()=>()=>{if(ref.current)ref.current.pause()},[]);
  const stop=()=>{if(ref.current)ref.current.pause();setOn(false)};
  const toggle=onFail=>{
    const t=trackOf(MAIN_TRACK);
    if(!t){onFail&&onFail();return}
    if(!ref.current){const a=new Audio(t.src);a.loop=true;a.volume=.5;ref.current=a}
    if(on){ref.current.pause();setOn(false);return}
    ref.current.play().then(()=>setOn(true)).catch(()=>{setOn(false);onFail&&onFail()});
  };
  return {on,toggle,stop};
}

function MusicBar({track,color,onPlay}){
  const ref=useRef(null);
  const [playing,setPlaying]=useState(false);
  const [dead,setDead]=useState(false);   // 파일이 없으면 재생 불가로 처리
  useEffect(()=>{const a=ref.current;return()=>{if(a)a.pause()}},[]);
  const label=track?[track.artist,track.title].filter(Boolean).join(" — "):"";
  if(!track||dead)return <div className="pfbgmoff">♪  no bgm</div>;
  const toggle=()=>{
    const a=ref.current;if(!a)return;
    if(playing){a.pause();setPlaying(false)}
    // 인물 BGM이 시작되면 데스크 CD는 멈춘다 — 두 곡이 겹쳐 나오면 안 된다
    else a.play().then(()=>{onPlay&&onPlay();setPlaying(true)}).catch(()=>setDead(true));
  };
  return <React.Fragment>
    <audio ref={ref} src={track.src} loop preload="none" onError={()=>setDead(true)} onEnded={()=>setPlaying(false)}/>
    <button className={"pfbgm"+(playing?" on":"")} onClick={toggle} style={{color}}>
      {playing&&<span className="np">now playing</span>}
      <span className="play" style={{borderColor:color,color}}>{playing?"❚❚":"▶"}</span>
      <span className="lab">{label||"press play ♪"}</span>
      <span className="eq"><i/><i/><i/></span>
    </button>
  </React.Fragment>;
}

function Profile({char,count,onBack,onBgm,gifts}){
  const ch=CHARS[char], p=PROFILES[char], room=roomOf(char);
  const [full,setFull]=useState(false);   // 배경만 크게 보기
  const st=p?(p.stages[stageIdx(count)]||p.stages[0]):null;
  /* 배경은 단계를 따라간다. 파일이 아직 없으면 그 인물의 기존 배경으로 돌아간다.
     훅은 아래 조건부 return보다 위에 있어야 한다 — 밑으로 내려가면 렌더마다
     훅 호출 수가 달라져서 React가 터진다. */
  /* 배경 우선순위: 유저가 준 선물 > 단계 배경. 자동으로 바뀌는 것보다
     유저가 건 것이 앞선다 — 그게 이 기능의 요지다.
     다만 GIFT_AT 단계는 지나야 한다. 주자마자 걸리면 사는 것이지 관계가 아니다. */
  const given=(gifts&&gifts[char])||[];
  /* 배경이 되는 건 사진이 있는 선물뿐이다. 그냥 마지막 선물을 집으면
     사진 없는 걸 방금 준 순간 단계 배경까지 같이 날아간다.
     그래서 뒤에서부터 사진 있는 것을 찾는다. */
  const hung=stageIdx(count)>=GIFT_AT
    ? given.slice().reverse().find(k=>(GIFTS.find(g=>g.key===k)||{}).bg) : null;
  const wanted=hung?(GIFTS.find(g=>g.key===hung)||{}).bg:(st&&st.bg);
  const bg=useBg(wanted,(p&&p.fallback)||char+"-bg.webp");
  if(!ch||!p)return null;
  const status=(st.status||"").trim();
  return <div className="pfscreen" style={{backgroundImage:`url("${bg}")`}}>
    <div className="pfdim" onClick={e=>{if(e.target===e.currentTarget)setFull(true)}}>
      <Sparkles/>
      <div className="pfcard">
        <div className="tb" style={{background:`linear-gradient(90deg, ${rgba(ch.color,.95)}, #ffb0d4)`}}>
          {char}.hompy<WinDots onClose={onBack}/>
        </div>
        <div className="pftop">
          <div className="pfpola">
            <span className="tape t1"/><span className="tape t2"/>
            <div className="shot" style={faceBg(ch)}/>
            <div className="cap">{room?room.empty:""}</div>
          </div>
          <div className="pfnamerow">
            <span className="deco" style={{color:ch.dk}}>✦</span>
            <span className="nm">{ch.name}</span>
            <span className="deco" style={{color:"#ff7fae"}}>♡</span>
          </div>
          {status&&<div className="pfbubble"><div className="b">{status}</div><div className="tail"/></div>}
        </div>
        <MusicBar track={trackOf(st.track)} color={ch.dk} onPlay={onBgm}/>
        <div className="pfstats">
          <div className="s"><span className="l">TODAY</span><span className="v" style={{color:"#ff7fae"}}>1</span></div>
          <div className="s"><span className="l">TALK</span><span className="v" style={{color:ch.dk}}>{count}</span></div>
        </div>
        <div className="pfstickers">
          {["✿","★","♡","✧","☾"].map((x,i)=><span key={i} style={{color:["#ff9ec6","#ffd68a","#c3b2f0","#8fd8e8","#ffb0d4"][i]}}>{x}</span>)}
        </div>
        <button className="pfclose bevel" onClick={onBack}>◁  back</button>
      </div>
    </div>
    {full&&<div className="bgfull" style={{backgroundImage:`url("${bg}")`}} onClick={()=>setFull(false)}>
      <span className="bgclose">tap to close</span>
    </div>}
  </div>;
}

/* ── 오프닝 ──
   Y2K 데스크톱 한 장. 도는 CD, 올라오는 방울, 흩어진 가짜 오류창.
   설명하는 문장이 없다 — 오류창이 대신 말한다. "당신을 찾을 수 없습니다".
   그래서 이름 칸이 이 화면에 같이 있다. 이름을 넣는 것이 그 오류를 지우는 일이다.

   로고곡은 여기서 돌고 들어갈 때 페이드아웃된다. 브라우저는 사용자가 이 페이지에서
   아무것도 누르기 전에는 소리를 막으므로(자동재생 정책), 막히면 아무 데나 누를 때
   다시 켠다. 아래 글자가 지금 어느 쪽인지 알려준다. */
// 저장소에 같이 있는 파일이라 상대 경로로 잡는다 (R2를 안 거친다)
const LOGO_TRACK="null-logo.mp3";
const BOOT_VOL=.55;   // 앱(App.tsx)의 BOOT_VOL과 같아야 한다

/* 방울 — 음악과 같이 올라온다. [왼쪽%, 지름, 한 바퀴 초, 시작 지연] */

const Bubbles=()=><div className="bubbles">{BUBS.map((b,i)=>
  <span key={i} className="bub" style={{left:b[0]+"%",width:b[1],height:b[1],
    animationDuration:`${b[2]}s,${(b[2]*0.28).toFixed(1)}s`,animationDelay:b[3]+"s"}}/>)}</div>;

function Splash({onEnter}){
  const [v,setV]=useState("");
  const [armed,setArmed]=useState(false);   // 자동재생이 됐는가
  const audio=useRef(null);
  useEffect(()=>{
    const a=new Audio(LOGO_TRACK); a.volume=0; a.loop=true; audio.current=a;
    a.play().then(()=>setArmed(true)).catch(()=>setArmed(false));
    /* loop만 켜두면 끝에서 앞으로 뚝 끊긴다. 끝 2.2초를 줄이고 처음 1.2초를 올려
       한 바퀴 돌 때 숨을 한 번 쉬는 것처럼 들리게 한다. timeupdate는 초당 네 번쯤이라
       그 간격으로 볼륨을 만지면 지직거려서, 50ms로 직접 잰다. */
    const ramp=setInterval(()=>{
      const d=a.duration, t=a.currentTime;
      if(!d||!isFinite(d)){a.volume=BOOT_VOL;return}
      const up=Math.min(1,t/1.2), down=Math.min(1,Math.max(0,d-t)/2.2);
      a.volume=BOOT_VOL*Math.min(up,down);
    },50);
    return()=>{
      clearInterval(ramp);   // 나가는 페이드와 싸우지 않게 먼저 끈다
      const f=setInterval(()=>{if(a.volume>.06)a.volume-=.06;else{a.pause();clearInterval(f)}},60);
      setTimeout(()=>{clearInterval(f);a.pause()},900);
    };
  },[]);
  const wake=()=>{const a=audio.current;if(!armed&&a)a.play().then(()=>setArmed(true)).catch(()=>{})};
  const go=()=>{const t=v.trim();if(t)onEnter(t)};
  return <div className="screen splash" onClick={wake}>
    <span className="spcd"/>
    <Bubbles/>
    <Sparkles/>
    <div className="spcard">
      <div className="sptb">null.exe<WinDots/></div>
      <div className="spbody">
        <div className="splogo">NULL</div>
        <input className="spinput" value={v} maxLength={12} placeholder="안녕, 널 입력해줘."
          onChange={e=>setV(e.target.value)} onFocus={wake} onKeyDown={e=>e.key==="Enter"&&go()}/>
        <button className="spgo" disabled={!v.trim()} onClick={go}>Click!</button>
      </div>
    </div>
    {/* 가짜 오류창 셋. 이 화면에서 이야기를 말하는 건 이것들뿐이다 */}
    <div className="spwin" style={{left:28,top:452,width:182,animationDelay:".2s"}}>
      <div className="sptb" style={{background:"linear-gradient(90deg,#b9a8ea,#8a7fc0)"}}>Error<WinDots/></div>
      <div className="spbd">이름을 입력해야 존재할 수 있어요.<div className="spbtn">ok</div></div>
    </div>
    <div className="spwin" style={{right:24,top:534,width:194,animationDelay:".35s"}}>
      <div className="sptb" style={{background:"linear-gradient(90deg,#ff7fae,#ff5fa8)"}}>System error<WinDots/></div>
      <div className="spbd">당신을 찾을 수 없습니다.<div className="spbtn">Cancel</div></div>
    </div>
    <div className="spcursor" style={{left:214,top:596}}/>
    <div className="spwin" style={{left:28,right:28,top:648,animationDelay:".5s"}}>
      <div className="sptb" style={{background:"linear-gradient(90deg,#8fd8e8,#c3b2f0)"}}>loading...<WinDots/></div>
      <div className="spbd" style={{background:"#fff8fc"}}>
        <span className="spbar flowing"><i/></span>
      </div>
    </div>
    <div className="sptap">{armed?"♪ NULL!":"TAP FOR MUSIC ♪"}</div>
  </div>;
}

function Blank({value,onSave,width}){

  const [v,setV]=useState(value||"");
  useEffect(()=>setV(value||""),[value,edit]);
  const done=()=>{setEdit(false);onSave(v.trim())};
  if(edit)return <input className="blankin sunken" style={width?{width}:null} value={v} autoFocus maxLength={20}
    onChange={e=>setV(e.target.value)} onBlur={done} onKeyDown={e=>e.key==="Enter"&&done()}/>;
  return <span className={"blank"+(value?" filled":"")} onClick={()=>setEdit(true)}>{value||"□□"}</span>;
}

/* [편집 → 기록] 지금까지 채운 빈칸을 숫자로 보여준다.
   대사로 못 하는 말을 통계가 대신한다 — 이 앱의 주제 그대로. */
function LogPanel({store,counts,unlocked,album}){
  const allPhotos=Object.values(CHARS).reduce((n,c)=>n+c.gallery.length,0);
  const first=Object.values(store.msgs||{}).flat().reduce((a,m)=>!a||m.ts<a?m.ts:a,0);
  const rows=[
    ["w/ 재언", (counts.jaeeon||0)],
    ["w/ 민현", (counts.minhyun||0)],
    ["group", (counts.group||0)],
    ["pics", album.size+" / "+allPhotos],
    [".hidden", unlocked.length+" / "+HIDDEN.length],
  ];
  return <div style={{padding:"4px 2px"}}>
    {rows.map(([k,v])=><div key={k} className="dlgline"
      style={{display:"flex",justifyContent:"space-between",gap:14,fontSize:12}}>
      <span style={{color:"#8a4f74"}}>{k}</span><span style={{color:"#4a4276"}}>{v}</span></div>)}
    <div className="dlgline" style={{marginTop:10,fontSize:10.5,color:"#b0a6d8",textAlign:"center"}}>
      {first?"first met u · "+fmtDay(first):"nothing yet"}
    </div>
  </div>;
}

/* [대화 → 찾기] 방을 넘나들며 찾는다. 어디서 그 말을 했는지 기억나지 않을 때. */
function FindPanel({store,name,onOpen}){
  const [q,setQ]=useState("");
  const key=q.trim();
  const hits=!key?[]:ROOMS.flatMap(r=>(store.msgs[r.id]||[])
    .filter(m=>(m.text||"").includes(key))
    .map(m=>({r,m}))).slice(-40).reverse();
  return <div style={{padding:"2px"}}>
    <input className="sunken" value={q} onChange={e=>setQ(e.target.value)} autoFocus
      placeholder="search..." style={{width:"100%",padding:"9px 11px",fontSize:15,
      fontFamily:"inherit",color:"#4a4276",outline:"none",borderRadius:0}}/>
    <div style={{maxHeight:260,overflowY:"auto",marginTop:10}}>
      {key&&!hits.length&&<div className="dlgline" style={{textAlign:"center",color:"#b0a6d8",fontSize:11}}>nothing found</div>}
      {hits.map(({r,m},i)=><div key={i} onClick={()=>onOpen(r.id)}
        style={{padding:"7px 8px",marginBottom:5,cursor:"pointer",background:"#fff",
        border:"1px solid #e7dcf4",fontSize:11,lineHeight:1.6}}>
        <div style={{fontSize:9,color:CHARS[m.sender]?CHARS[m.sender].dk:"#8a7fc0",letterSpacing:".06em"}}>
          {m.sender==="user"?name:(CHARS[m.sender]?CHARS[m.sender].name:r.name)} · {r.name}
        </div>
        <div style={{color:"#4a4276",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.text}</div>
      </div>)}
    </div>
  </div>;
}

/* [당신] 프로필 카드 */
/* 장바구니 — 목록에서 고르고, 누구에게 보낼지와 쪽지를 그 자리에서 정한다.
   작은 다이얼로그가 아니라 창 하나를 통째로 쓴다. 목록 + 쪽지까지 들어가면
   290px 상자로는 스크롤만 생긴다. */
function Cart({gifts,hearts,onSend,onClose}){
  const [q,setQ]=useState("");
  const [cat,setCat]=useState("전체");
  const [pick,setPick]=useState(null);
  const [to,setTo]=useState(null);
  const [memo,setMemo]=useState("");
  const key=q.trim().toLowerCase();
  /* 검색어가 비면 그 분류를 전부 보여준다. 아이템이 몇 개 없어서 정확한 낱말을
     맞춰야만 나오면 뭐가 있는지 모르는 채로 헤매게 된다. */
  const hits=GIFTS.filter(g=>(cat==="전체"||g.cat===cat)
    &&(!key||(g.name+" "+g.tags).toLowerCase().includes(key)));
  const back=()=>{setPick(null);setTo(null);setMemo("")};
  const given=c=>(gifts[c]||[]).includes(pick&&pick.key);
  const poor=pick&&hearts<pick.cost;

  return <div className="cartscreen"><div className="cartwin">
    <div className="tb">✿ cart{pick?" / wrap":""}<WinDots onClose={onClose}/></div>

    {!pick&&<React.Fragment>
      <div className="cbar">
        <input className="csearch" value={q} placeholder="무엇을 찾고 있어?"
          onChange={e=>setQ(e.target.value)}/>
        <span className="ccoin">♡ {hearts}</span>
      </div>
      <div className="cchips">{GIFT_CATS.map(c=>
        <button key={c} className={"cchip"+(cat===c?" on":"")} onClick={()=>setCat(c)}>{c}</button>)}</div>
      <div className="cgrid">
        {hits.length?hits.map(g=>
          <button key={g.key} className="citem" onClick={()=>setPick(g)}>
            {g.badge&&<span className={"cbadge"+(g.badge==="HOT"?" mint":"")}>{g.badge}</span>}
            <span className="cthumb">{React.createElement(GiftIcon[g.key],{size:31})}</span>
            <span className="ciname">{g.name}</span>
            <span className="cprice">♡ {g.cost}</span>
          </button>)
         :<div className="cnone">no result</div>}
      </div>
      <div className="cfoot">TAP TO WRAP ♡</div>
    </React.Fragment>}

    {pick&&<div className="cwrap">
      <div className="cgcard"><span className="cribbon"/>
        <span className="cgthumb">{React.createElement(GiftIcon[pick.key],{size:34})}</span>
        <div>
          <div className="cgname">{pick.name}</div>
          <div className="cgdesc">{pick.desc}</div>
          <div className="cgprice">♡ {pick.cost}</div>
        </div>
      </div>
      <div className="csect">WHO GETS THIS</div>
      {["jaeeon","minhyun"].map(c=>{
        const done=given(c), sel=to===c;
        return <div key={c}>
          <button className={"cto"+(sel?" sel":"")} disabled={done}
            onClick={()=>{ if(done)return;
              if(!sel){setTo(c);return}
              if(poor)return;
              onSend(c,pick,memo); onClose(); }}>
            <span className="cradio"/>
            <span className="cface" style={faceBg(CHARS[c])}/>
            <span className="ctoname">{CHARS[c].name}</span>
            <span className={done?"csent":"csend"}>{done?"SENT ♡":(sel?(poor?`NEED ♡${pick.cost-hearts}`:"SEND ♡"):"WRAP ♡")}</span>
          </button>
          {sel&&!done&&<div className="chint">{GIFT_HINT[c]}</div>}
        </div>;
      })}
      <div className="csect">A NOTE (선택)</div>
      <textarea className="cmemo" value={memo} maxLength={60} placeholder="P.S. ♡"
        onChange={e=>setMemo(e.target.value)}/>
      <button className="cback" onClick={back}>◁ back</button>
    </div>}
  </div></div>;
}

function ProfileDialog({name,profile,onSaveField,onRename,onReset,onClose}){
  const [renaming,setRenaming]=useState(false);
  const [nv,setNv]=useState(name);
  const [confirming,setConfirming]=useState(false);
  const doRename=()=>{const t=nv.trim();if(t)onRename(t);setRenaming(false)};

    {renaming
      ?<input className="blankin sunken" style={{width:"100%",fontSize:14,padding:"8px"}} value={nv} autoFocus maxLength={12}
        onChange={e=>setNv(e.target.value)} onBlur={doRename} onKeyDown={e=>e.key==="Enter"&&doRename()}/>
      :<div style={{fontSize:16,color:"#8a4f74",letterSpacing:".08em"}}>{name}</div>}
    <div className="dlgline"><Blank value={profile.subject} onSave={v=>onSaveField("subject",v)}/> 과목 교생</div>

    <div className="dlgline"><Blank value={profile.likes} onSave={v=>onSaveField("likes",v)}/> 를 좋아하고</div>

    {!confirming

/* ── 채팅방 ── */
function ChatRoom({room,msgs,busy,failed,onBack,onSend,onRetry,onProfile}){
  const [v,setV]=useState("");
  const [zoom,setZoom]=useState(null);   // 사진 확대해서 보기
  const boxRef=useRef(null);
  const watch=room.type==="watch";
  useEffect(()=>{const el=boxRef.current;if(el)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})},[msgs.length,busy,failed]);
  const send=()=>{const t=v.trim();if(!t||busy)return;setV("");onSend(t)};
  const senderMeta=s=>s==="user"?null:(CHARS[s]||{name:s,color:"#9aa3d8",pale:"#e2e6f5",dk:"#6b5fa8"});
  return <div className={"screen"+(watch?" watchbg":"")}>
    <div className="tb" style={{background:watch?"linear-gradient(90deg,#aab3d6,#c9c0ee)":`linear-gradient(90deg, ${rgba(room.color,.95)}, #c3b2f0)`}}>
      {room.name}{watch?".cam":".chat"}<WinDots/>
    </div>
    <div className="chatbar">
      <button className="backbtn bevel" onClick={onBack}><BackIcon/></button>
      <Avatar room={room} size={31} onProfile={onProfile}/>
      <div>
        <div className="cname">{room.name}</div>
        <div className="csub">{watch?<><span className="rec"/> watching</>:room.sub}</div>
      </div>
    </div>
    <div className="msgs" ref={boxRef}>
      {msgs.length===0&&!busy&&room.empty&&<div className="empty">
        <span style={{fontSize:13,color:"#ff8fbe"}}>✧ ✦ ✧</span><br/>{room.empty}
      </div>}
      {msgs.map((m,i)=>{
        const prev=msgs[i-1];
        const gap=!prev||m.ts-prev.ts>10*60*1000;
        const me=m.sender==="user";
        const meta=senderMeta(m.sender);
        // 클러스터 시작. 지문 줄이 끼면 흐름이 끊기므로 다음 말은 프로필부터 다시 보여준다
        const head=gap||!prev||prev.sender!==m.sender||isNarr(prev);
        const showName=head&&!me&&(room.type==="group"||watch);
        return <React.Fragment key={m.id||i}>
          {gap&&<div className="divider">✦ {fmtDivider(m.ts)} ✦</div>}
          {isNarr(m)
          ?<div className="narr">{m.text}</div>
          :<div className={"mrow"+(me?" me":"")} style={{marginTop:head?8:0}}>
            {!me&&(head?
              <div className={"mavatar"+(meta.img?" face":"")+(CHARS[m.sender]?" clickable":"")}
                   onClick={()=>CHARS[m.sender]&&onProfile&&onProfile(m.sender)}
                   style={meta.img?faceBg(meta):{background:`linear-gradient(180deg,#ffffff, ${meta.pale}`+")"}}>{!meta.img&&<CharIcon id={m.sender} size={13}/>}</div>
              :<div className="sp"/>)}
            <div className="mcol">
              {showName&&<span className="mname" style={{color:meta.dk}}>{meta.name}</span>}
              <div className={"bubble"+(m.photo?" photo":"")} style={me?{background:`linear-gradient(135deg, ${rgba(room.color,.5)} 0%, #ffffff 135%)`}:null}>
                {m.photo
                  ?<React.Fragment>
                    <img src={photoSrc(m.photo)} alt="" loading="lazy" onClick={()=>setZoom(photoSrc(m.photo))}/>
                    {m.text&&<div className="cap">{m.text}</div>}
                  </React.Fragment>
                  :m.text}
              </div>
            </div>
          </div>}
        </React.Fragment>;
      })}
      {busy&&<div className="mrow" style={{marginTop:8}}>
        <div className="mavatar" style={{background:"#ece8fa"}}/>
        <div className="bubble typing"><i/><i/><i/></div>
      </div>}
      {failed&&!busy&&<button className="retry" onClick={onRetry}>
        no reply... try again?
        {failed.detail&&<span className="why">{failed.detail}</span>}
      </button>}
    </div>
    {watch?
      <div className="watchbar"><span className="rec"/>u can't join this one</div>
      :<div className="inputbar">
        <input className="sunken" value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button className="sendbtn bevel" disabled={!v.trim()||busy} onClick={send} style={{background:`linear-gradient(180deg, #ffffff -30%, ${room.color} 95%)`}}><SendIcon/></button>
      </div>}
    {zoom&&<div className="lightbox" onClick={()=>setZoom(null)}><img src={zoom} alt=""/></div>}
  </div>;
}

/* ── 앱 ── */
function App(){
  const [name,setName]=useState(()=>localStorage.getItem("null_name")||"");
  const [profile,setProfile]=useState(loadProfile);
  const [store,setStore]=useState(loadStore);
  const [unlocked,setUnlocked]=useState(loadUnlocked);
  const [gifts,setGifts]=useState(loadGifts);   // {jaeeon:["mug"], ...} 누구에게 뭘 줬나
  const [toast,setToast]=useState(null);            // 해금 알림
  const [view,setView]=useState("list");            // 'list' | roomId
  const [busy,setBusy]=useState({});                // 방별 타이핑 인디케이터
  const [failed,setFailed]=useState({});            // 방별 실패 payload (재시도용)
  const [autoLoading,setAutoLoading]=useState(false);
  const viewRef=useRef(view); viewRef.current=view;
  const storeRef=useRef(store); storeRef.current=store;
  const profileRef=useRef(profile); profileRef.current=profile;
  const unlockedRef=useRef(unlocked); unlockedRef.current=unlocked;
  const giftsRef=useRef(gifts); giftsRef.current=gifts;
  const queueRef=useRef([]);                        // 순차 표시 대기열
  const runningRef=useRef(false);
  const inflightRef=useRef({});
  useEffect(()=>{saveStore(store)},[store]);
  useEffect(()=>{try{localStorage.setItem("null_profile",JSON.stringify(profile))}catch(e){}},[profile]);
  useEffect(()=>{saveUnlocked(unlocked)},[unlocked]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t)},[toast]);

  /* 메시지 추가 (+현재 안 보고 있는 방이면 unread 증가) */
  const appendMsg=(room,msg)=>setStore(s=>({
    msgs:{...s.msgs,[room]:[...(s.msgs[room]||[]),msg]},
    unread:viewRef.current!==room?{...s.unread,[room]:(s.unread[room]||0)+1}:s.unread
  }));

  /* 대기열 처리: 0.6초 간격 순차 등장 */
  const pump=()=>{
    if(runningRef.current)return;
    runningRef.current=true;
    const step=()=>{
      const it=queueRef.current.shift();
      if(!it){runningRef.current=false;return}
      appendMsg(it.room,{id:Date.now()+Math.random(),sender:it.sender,text:it.text,photo:it.photo,ts:Date.now()});
      if(!queueRef.current.some(q=>q.room===it.room)&&!inflightRef.current[it.room])
        setBusy(b=>({...b,[it.room]:false}));
      setTimeout(step,600);
    };
    setTimeout(step,500); // 타이핑 인디케이터를 잠깐 보여준 뒤 첫 버블
  };
  const enqueue=(room,messages)=>{
    messages.forEach(m=>{
      if(!m)return;
      const photo=photoSrc(m.photo)?m.photo:null;   // 없는 파일이면 사진은 버리고 말만 남긴다
      const text=(m.text||"").trim();
      if(text||photo)queueRef.current.push({room,sender:m.sender||room,text,photo});
    });
    pump();
  };

  /* history / signals / counts / user_profile 구성 */
  const buildHistory=ms=>ms.slice(-30).map(m=>({role:m.sender==="user"?"user":"assistant",sender:m.sender,
    content:m.photo?((m.text?m.text+" ":"")+"(사진을 보냈다)"):m.text}))
    .filter(m=>m.content&&m.content.trim());
  /* 최근에 보낸 사진 — 같은 사진이 연달아 나오지 않게 백엔드에 알려준다 */
  const recentPhotos=room=>{
    const ms=(storeRef.current.msgs[room]||[]).slice(-24),out=[];
    for(let i=ms.length-1;i>=0&&out.length<4;i--) if(ms[i].photo&&!out.includes(ms[i].photo))out.push(ms[i].photo);
    return out;
  };
  /* 방별 누적 대화 수 — 관계 단계와 .hidden 해금의 근거.
     방금 보낸 메시지는 아직 상태에 반영되기 전이라 override로 직접 넘긴다 */
  const roomCounts=override=>{
    const c={};
    ["jaeeon","minhyun","group","health"].forEach(r=>{
      c[r]=(override&&override[r]!=null)?override[r]:(storeRef.current.msgs[r]||[]).length;
    });
    return c;
  };
  const buildSignals=exclude=>{
    const sig={},t0=new Date();t0.setHours(0,0,0,0);
    ["jaeeon","minhyun","group"].forEach(r=>{
      if(r===exclude)return;
      const ms=storeRef.current.msgs[r]||[];if(!ms.length)return;
      sig[r]={count:ms.filter(m=>m.ts>=t0.getTime()).length,minsAgo:Math.max(0,Math.floor((Date.now()-ms[ms.length-1].ts)/60000))};
    });
    return sig;
  };
  /* 채워진 칸만 보낸다 */
  const userProfile=()=>{
    const out={};
    Object.entries(profileRef.current).forEach(([k,v])=>{if(v)out[k]=v});
    return Object.keys(out).length?out:null;
  };

  /* 백엔드가 알려준 해금 목록을 반영하고, 새로 열린 게 있으면 알린다 */
  const applyUnlocked=list=>{
    if(!Array.isArray(list)||!list.length)return;
    const now=unlockedRef.current;
    const fresh=list.filter(k=>HIDDEN_LABEL[k]&&!now.includes(k));
    if(!fresh.length)return;
    setUnlocked([...now,...fresh]);
    setToast(fresh.length===1?`.hidden — ${HIDDEN_LABEL[fresh[0]]}`:`.hidden — ${fresh.length}개가 열렸다`);
  };

  /* API 요청 — 실패 시 조용한 재시도 버튼 */
  const request=async(bucket,payload)=>{
    const up=userProfile();
    if(up)payload.user_profile=up; else delete payload.user_profile;
    if(!payload.counts)payload.counts=roomCounts();
    inflightRef.current[bucket]=true;
    setBusy(b=>({...b,[bucket]:true}));
    setFailed(f=>({...f,[bucket]:null}));
    // 데모로 굳었으면 네트워크를 아예 타지 않는다
    if(demoOn()){
      inflightRef.current[bucket]=false;
      const last=[...(payload.history||[])].reverse().find(m=>m.role==="user");
      setTimeout(()=>enqueue(bucket,demoReply(bucket,last&&last.content)),450);
      return;
    }
    try{
      const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const data=await res.json().catch(()=>null);
      if(!res.ok){
        // 서버가 알려준 실패 사유를 그대로 들고 올라간다
        const err=new Error("HTTP "+res.status);
        err.detail=(data&&(data.detail||data.error))||("HTTP "+res.status);
        throw err;
      }
      inflightRef.current[bucket]=false;
      const list=(data&&data.messages)||[];
      if(list.length)enqueue(bucket,list);
      else setBusy(b=>({...b,[bucket]:false}));
      applyUnlocked(data&&data.unlocked);
    }catch(e){
      inflightRef.current[bucket]=false;
      setBusy(b=>({...b,[bucket]:false}));
      const detail=String(e.detail||e.message||e).slice(0,500);
      // 화면(재시도 버튼 아래)과 콘솔 양쪽에 남긴다 — 어느 쪽을 보든 원인이 보이게
      console.error("%c[NULL] 실패 원인 ▶ "+detail,"color:#c23b50;font-size:13px;font-weight:bold");
      /* 처음 실패하면 데모로 넘어간다. 저장소 링크만 보고 들어온 사람이
         재시도 버튼만 마주하는 것보다 각본이라도 움직이는 편이 낫다.
         원인은 위 콘솔에 그대로 남고 하단 바에 demo가 뜬다 — 조용히 가짜로
         바뀌면 진짜 장애를 못 알아채기 때문이다. */
      DEMO.auto=true;
      setBusy(b=>({...b,[bucket]:true}));
      const last=[...(payload.history||[])].reverse().find(m=>m.role==="user");
      setTimeout(()=>enqueue(bucket,demoReply(bucket,last&&last.content)),450);
    }
  };

  /* 일반 대화 전송 */
  const send=(room,text)=>{
    const userMsg={id:Date.now()+Math.random(),sender:"user",text,ts:Date.now()};
    appendMsg(room,userMsg);
    const next=[...(storeRef.current.msgs[room]||[]),userMsg];
    const history=buildHistory(next);
    request(room,{mode:"chat",room,user_name:name,history,signals:buildSignals(room),
      recent_photos:recentPhotos(room),counts:roomCounts({[room]:next.length})});
  };
  /* 선물 보내기.
     사진은 채팅창에 띄우지 않는다 — 줄글 한 줄만 남기고 반응은 인물이 알아서 한다.
     그 줄은 유저의 말이 아니라 일어난 일이므로 sys로 표시해 지문처럼 그린다.
     history에도 이 줄이 그대로 들어가서 모델이 "무엇을 받았는지" 알게 된다. */
  const giveGift=(char,gift,memo)=>{
    if(!char||!gift)return;
    const have=giftsRef.current[char]||[];
    if(have.includes(gift.key))return;              // 같은 걸 두 번 주지 않는다
    const next={...giftsRef.current,[char]:[...have,gift.key]};
    setGifts(next); saveGifts(next);
    const note=(memo||"").trim().slice(0,60);
    const line=`${CHARS[char].name}이 ${gift.name}을(를) 받았다`+(note?` — “${note}”`:"");
    const sysMsg={id:Date.now()+Math.random(),sender:"user",sys:true,text:line,ts:Date.now()};
    appendMsg(char,sysMsg);
    setToast(`${CHARS[char].name} — ${gift.name}`);
    const nextMsgs=[...(storeRef.current.msgs[char]||[]),sysMsg];
    request(char,{mode:"chat",room:char,user_name:name,history:buildHistory(nextMsgs),
      signals:buildSignals(char),recent_photos:recentPhotos(char),
      counts:roomCounts({[char]:nextMsgs.length}),gift:{name:gift.name,key:gift.key,note}});
  };

  /* 재시도: 저장해둔 payload를 최신 history로 갱신해 다시 전송 */
  const retry=room=>{
    const p=failed[room]&&failed[room].payload;if(!p)return;
    if(p.mode==="chat")p.history=buildHistory(storeRef.current.msgs[room]||[]);
    p.recent_photos=recentPhotos(p.mode==="auto"?"health":room);
    request(room,p);
  };
  /* 시간 경과(달 버튼): 자율 대화 생성 → 관전방에 축적 */
  const doAuto=async()=>{
    if(autoLoading)return;
    setAutoLoading(true);
    await request("health",{mode:"auto",user_name:name,
      history:buildHistory(storeRef.current.msgs.health||[]),signals:buildSignals(null),recent_photos:recentPhotos("health")});
    setAutoLoading(false);
  };

  /* [편집] 대화 저장: 전체 방 → .txt 다운로드 */
  const exportTxt=()=>{
    const lines=["NULL — 대화 기록","내보낸 시각: "+new Date().toLocaleString("ko-KR"),""];
    ROOMS.forEach(r=>{
      const ms=storeRef.current.msgs[r.id]||[];if(!ms.length)return;
      lines.push("──── "+r.name+" ────");
      ms.forEach(m=>{
        const who=m.sender==="user"?name:(CHARS[m.sender]?CHARS[m.sender].name:m.sender);
        lines.push(`[${fmtDivider(m.ts)}] ${who}: ${m.photo?"(사진) ":""}${m.text||""}`);
      });
      lines.push("");
    });
    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="NULL-대화기록.txt";a.click();
    URL.revokeObjectURL(a.href);
  };
  /* [대화] 읽음 처리 */
  const readAll=()=>setStore(s=>({...s,unread:{}}));
  /* [당신] 이름 변경 / 새로 시작 */
  const rename=n=>{localStorage.setItem("null_name",n);setName(n)};
  const reset=()=>{localStorage.clear();setStore({msgs:{},unread:{}});setProfile({});setUnlocked([]);setGifts({});setName("")};

  const openRoom=id=>{setView(id);setStore(s=>({...s,unread:{...s.unread,[id]:0}}))};
  /* 프로필 화면. 대화 수는 그 캐릭터가 낀 모든 방을 합쳐 센다 (worker의 단계 기준과 같다) */
  const [prof,setProf]=useState(null);
  const profCount=id=>{
    const s=storeRef.current.msgs||{};
    return (s[id]||[]).length+(s.group||[]).filter(m=>m.sender===id||m.sender==="user").length;
  };
  const bgm=useMainBgm();   // 데스크 CD가 트는 메신저 BGM
  /* 이름을 넣으면 등록 화면이 한 번 지나간다. 처음 들어온 사람에게만이다 —
     이미 이름이 있으면 오프닝도 등록도 건너뛰고 바로 메신저다. */
  const [enrolling,setEnrolling]=useState(false);
  const enter=n=>{localStorage.setItem("null_name",n);setName(n);setEnrolling(true)};

  return <div className="phone">
    {enrolling&&<Enroll name={name} onDone={()=>setEnrolling(false)}/>}
    {!name?<Splash onEnter={enter}/>
    :view==="list"?<RoomList store={store} name={name} unlocked={unlocked} counts={roomCounts()}
       onOpen={openRoom} onProfile={setProf} onAuto={doAuto} autoLoading={autoLoading}
       onExport={exportTxt} onReadAll={readAll} onRename={rename} onReset={reset} onToast={setToast}
       profile={profile} onSaveField={(k,v)=>setProfile(p=>({...p,[k]:v}))} bgm={bgm} gifts={gifts} onGift={giveGift} hearts={heartsOf(store,gifts)}/>
    :<ChatRoom room={roomOf(view)} msgs={store.msgs[view]||[]} busy={!!busy[view]} failed={failed[view]}
       onBack={()=>setView("list")} onSend={t=>send(view,t)} onRetry={()=>retry(view)} onProfile={setProf}/>}
    {prof&&<Profile char={prof} count={profCount(prof)} onBack={()=>setProf(null)} onBgm={bgm.stop} gifts={gifts}/>}
    {toast&&<div className="toast"><span>✧ {toast}</span></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
