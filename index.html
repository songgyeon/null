<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NULL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
/* ── Y2K 파스텔 OS 팔레트 ──
   잉크 #4a4276 · 보더 #5d5490/#8a7fc0/#b0a6d8 · 크롬 #dcd6f2 · 핑크 #ff9ec6 · 라벤더 #c3b2f0 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Galmuri11","DungGeunMo",sans-serif;color:#4a4276;
 background:linear-gradient(165deg,#c9bff1 0%,#b3a7e6 60%,#c4b0e8 100%);
 -webkit-font-smoothing:none}
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
/* 메인 창(폰) */
.phone{position:relative;z-index:1;width:390px;height:844px;max-height:min(94vh,844px);overflow:hidden;
 background:#dcd6f2;border:1px solid #5d5490;border-radius:12px;
 box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #b0a6d8,6px 6px 0 rgba(93,84,144,.3),0 30px 60px rgba(93,84,144,.35)}
@media(max-width:500px){
 #root{align-items:stretch}
 .phone{width:100%;height:100dvh;max-height:none;border-radius:0;border:none;box-shadow:none}
}
.screen{position:absolute;inset:4px;display:flex;flex-direction:column;overflow:hidden;border-radius:9px;
 background:#ece8fa;animation:fade .25s steps(4)}
@media(max-width:500px){.screen{inset:0;border-radius:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blinkc{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes recblink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes spk{0%,100%{transform:scale(.35) rotate(0deg);opacity:.15}50%{transform:scale(1) rotate(90deg);opacity:.95}}
/* 키라키라 반짝이 */
.spark{position:absolute;pointer-events:none;z-index:6;
 clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
 animation:spk 2.6s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(255,255,255,.9))}
/* ── 창 타이틀바 + 동그란 ─□✕ ── */
.tb{flex:none;display:flex;align-items:center;gap:8px;padding:8px 11px;
 background:linear-gradient(90deg,#ff9ec6,#c3b2f0);color:#fff;border-bottom:1px solid #5d5490;
 font-size:12px;letter-spacing:.1em;text-shadow:1px 1px 0 rgba(93,84,144,.55)}
.dots{margin-left:auto;display:flex;gap:5px}
.dots span{width:16px;height:16px;border-radius:50%;border:1px solid #5d5490;display:flex;align-items:center;justify-content:center;
 font-size:8px;line-height:1;color:#fff;text-shadow:none;
 box-shadow:inset -1px -2px 0 rgba(93,84,144,.3),inset 1px 1px 0 rgba(255,255,255,.7)}
.dots .d1{background:#ffd0e6;color:#c46a97}
.dots .d2{background:#ff9ec6}
.dots .d3{background:#ff7fae}
/* 메뉴바 / 베벨 버튼 / 선큰 패널 */
.menubar{flex:none;display:flex;align-items:center;gap:4px;padding:4px 8px;font-size:11px;color:#6b5fa8;
 background:rgba(240,236,252,.78);border-bottom:1px solid #c5bce8;position:relative;z-index:20}
.mbtn{padding:5px 8px;cursor:pointer;border:1px solid transparent;border-radius:3px}
.mbtn:hover{background:#e6def8}
.mbtn.open{background:#fff;border-color:#8a7fc0;color:#4a4276;box-shadow:inset 1px 1px 0 rgba(93,84,144,.18)}
.bevel{font-family:inherit;color:#4a4276;background:#ece8fa;border:1px solid #5d5490;cursor:pointer;
 box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 #cdc3ec,2px 2px 0 rgba(93,84,144,.22)}
.bevel:active{box-shadow:inset 1px 1px 0 #cdc3ec;transform:translate(1px,1px)}
.bevel:disabled{opacity:.45;cursor:default}
.sunken{background:#fff;border:1px solid #8a7fc0;box-shadow:inset 1px 1px 0 rgba(93,84,144,.28),inset 2px 2px 4px rgba(93,84,144,.12)}
/* 드롭다운 */
.ddwrap{position:relative}
.dd{position:absolute;left:0;top:calc(100% + 3px);min-width:150px;background:#f6f2ff;border:1px solid #5d5490;border-radius:5px;
 padding:4px;box-shadow:inset 1px 1px 0 #fff,3px 3px 0 rgba(93,84,144,.25);animation:fadeUp .15s steps(3) both;z-index:30}
.dditem{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:11px;color:#4a4276;cursor:pointer;border-radius:3px;white-space:nowrap}
.dditem:hover{background:#ffd7e9;color:#8a4f74}
/* 다이얼로그(레트로 윈도우) */
.dlgov{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
 background:rgba(74,66,118,.4);padding:26px;animation:fade .15s steps(3) both}
.dlg{width:100%;max-width:290px;background:#ffd0e4;border:1px solid #5d5490;border-radius:8px;overflow:hidden;
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.8),5px 5px 0 rgba(93,84,144,.28);animation:fadeUp .2s steps(4) both}
.dlg .tb{background:linear-gradient(90deg,#ff8fbe,#ffb0d4);letter-spacing:.14em}
.dlgbody{background:#fdf3f8;padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.dlgline{font-size:12px;line-height:1.9;color:#6b5fa8}
.dlgbtns{display:flex;gap:7px;margin-top:10px}
.dlgbtns .bevel{flex:1;padding:9px 6px;font-size:11px;border-radius:0}
.dlgbtns .pink{background:linear-gradient(180deg,#fff0f7,#ffc2dd)}
/* 프로필 빈칸 */
.blank{display:inline-block;min-width:34px;padding:2px 6px;text-align:center;color:#c46a97;cursor:pointer;
 background:#fff;border:1px dashed #e79cc0;border-radius:3px}
.blank:hover{background:#fff0f7}
.blank.filled{color:#8a4f74;border-style:solid}
.blankin{width:74px;padding:2px 5px;font-family:inherit;font-size:12px;color:#4a4276;text-align:center;outline:none;border-radius:0}
/* ── 온보딩: 폰 속 파스텔 데스크톱 + now loading 창 ── */
.onb{justify-content:center;align-items:center;padding:26px;
 background:linear-gradient(rgba(203,186,240,.5),rgba(203,186,240,.5)),#c6b4ee url("bg-extra.png") center/cover}
.loadwin{position:relative;z-index:2;width:100%;max-width:290px;background:#ffd0e4;border:1px solid #5d5490;border-radius:8px;
 overflow:hidden;box-shadow:inset 1px 1px 0 rgba(255,255,255,.8),5px 5px 0 rgba(93,84,144,.28);animation:fadeUp .5s steps(5) both}
.loadwin .tb{background:linear-gradient(90deg,#ff8fbe,#ffb0d4);letter-spacing:.14em}
.loadbody{padding:30px 24px 26px;display:flex;flex-direction:column;align-items:center;text-align:center}
.loadbody .logo{font-family:"Galmuri9","Galmuri11",sans-serif;font-size:24px;letter-spacing:.5em;text-indent:.5em;color:#fff;
 text-shadow:0 0 8px #ff8fbe,2px 2px 0 #c3a0d8;margin-bottom:26px}
.loadbody .logo::after{content:"_";animation:blinkc 1s infinite}
.loadbody h1{font-size:14px;font-weight:400;color:#8a4f74;margin-bottom:24px}
.loadbody input{width:100%;padding:11px 12px;font-size:16px;font-family:inherit;color:#4a4276;text-align:center;outline:none;border-radius:0}
.loadbody input::placeholder{color:#c9a6c2}
.loadbody button{margin-top:12px;width:100%;padding:11px;font-size:13px;letter-spacing:.3em;text-indent:.3em;border-radius:0;
 background:linear-gradient(180deg,#fff0f7,#ffc2dd)}
.taskbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:5px 7px calc(5px + env(safe-area-inset-bottom));
 background:#dcd6f2;border-top:1px solid #8a7fc0;box-shadow:inset 0 1px 0 #fff}
.taskbar .start{display:flex;align-items:center;gap:5px;padding:5px 11px;font-size:11px}
.taskbar .clock{margin-left:auto;padding:5px 10px;font-size:10.5px;color:#6b5fa8}
/* 방 목록: 크롬 스타 월페이퍼 위 메신저 창 */
.desk{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)),#c6b9f0 url("bg-wallpaper.png") center/cover}
.iconbtn{width:34px;height:28px;display:flex;align-items:center;justify-content:center;flex:none;color:#6b5fa8}
.iconbtn.loading{animation:blink 1s steps(2) infinite}
.tabs{flex:none;display:flex;gap:4px;padding:9px 12px 0}
.tab{padding:6px 13px 7px;font-size:11px;color:#8a7fc0;background:rgba(226,220,246,.85);border:1px solid #8a7fc0;border-bottom:none;
 border-radius:7px 7px 0 0;cursor:pointer}
.tab.on{background:#fff;color:#4a4276;position:relative;top:1px}
.roomswrap{flex:1;display:flex;flex-direction:column;margin:0 12px;background:rgba(255,255,255,.9);border:1px solid #8a7fc0;
 box-shadow:inset 1px 1px 0 rgba(93,84,144,.2);overflow:hidden}
.rooms{flex:1;overflow-y:auto;padding:10px}
.sect{margin:12px 4px 6px;font-size:9.5px;letter-spacing:.32em;color:#b0a6d8}
.roomcard{position:relative;display:flex;align-items:center;gap:11px;padding:11px 9px;cursor:pointer;
 border-bottom:1px dotted #d8d1f0;animation:fadeUp .3s steps(4) both}
.roomcard:hover{background:#f3eefd}
.roomcard:active{background:#e9e2fa}
.roomcard.watch{background:linear-gradient(180deg,#ffffff,#e2e7f6);border:1px solid #9aa3d8;border-radius:6px;margin-top:2px;
 box-shadow:inset 0 1px 0 #fff,1px 2px 0 rgba(93,84,144,.22)}
.roomcard.watch:hover{background:linear-gradient(180deg,#ffffff,#eaeefb)}
.avatar{position:relative;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
 border:1px solid #8a7fc0;border-radius:50%;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(93,84,144,.14),1px 2px 0 rgba(93,84,144,.28)}
.rinfo{flex:1;min-width:0}
.rtop{display:flex;align-items:baseline;gap:7px}
.rname{font-size:13.5px}
.rtag{font-size:9px;padding:2px 6px;border:1px solid currentColor;border-radius:8px;letter-spacing:.05em;white-space:nowrap;flex:none}
.rtime{margin-left:auto;font-size:9.5px;color:#b0a6d8;flex:none}
.rprev{margin-top:5px;font-size:11px;color:#9a8fc8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch .rprev{color:#8a90b8}
.watch .rtime{color:#6d74a3}
.rbadge{flex:none;min-width:20px;height:20px;padding:0 6px;font-size:10px;color:#fff;border-radius:10px;
 display:flex;align-items:center;justify-content:center;background:#ff7fae;border:1px solid #5d5490;
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.5),1px 1px 0 rgba(93,84,144,.3)}
.statusbar{flex:none;display:flex;gap:4px;padding:7px 8px calc(8px + env(safe-area-inset-bottom))}
.statusbar span{padding:5px 9px;font-size:10px;color:#6b5fa8;background:#ece8fa;border:1px solid #b0a6d8;
 box-shadow:inset 1px 1px 0 rgba(93,84,144,.18)}
.statusbar span:first-child{flex:1}
/* 갤러리(Cam 탭) */
.gal{flex:1;overflow-y:auto;padding:12px}
.galgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:6px}
.galgrid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:5px;border:1px solid #cfc6ee;background:#efeaf9;cursor:pointer;
 box-shadow:1px 2px 0 rgba(93,84,144,.2)}
.galgrid img:active{opacity:.82}
/* .hidden 탭: 잠긴 사진 */
.tab.hid{color:#8f86c9;letter-spacing:.04em}
.tab.hid.on{color:#4a4276}
.hcell{position:relative;aspect-ratio:2/3;border-radius:5px;overflow:hidden;border:1px solid #cfc6ee;background:#efeaf9;cursor:pointer;
 box-shadow:1px 2px 0 rgba(93,84,144,.2)}
.hcell img{width:100%;height:100%;object-fit:cover;display:block}
.hcell.lock{cursor:default}
.hcell.lock img{filter:blur(8px) grayscale(.65) brightness(.7);transform:scale(1.08)}
.hlock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 filter:drop-shadow(1px 1px 0 rgba(43,36,78,.6))}
.hlabel{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;font-size:9.5px;letter-spacing:.08em;color:#fff;
 background:rgba(43,36,78,.55);text-shadow:1px 1px 0 rgba(43,36,78,.5)}
.hnote{margin:14px 4px 8px;text-align:center;font-size:10px;color:#b0a6d8;letter-spacing:.08em;line-height:1.9}
/* 해금 알림 */
.toast{position:absolute;left:0;right:0;bottom:74px;z-index:45;display:flex;justify-content:center;pointer-events:none}
.toast span{padding:9px 16px;font-size:10.5px;letter-spacing:.08em;color:#fff;border-radius:16px;
 background:rgba(43,36,78,.88);box-shadow:2px 2px 0 rgba(43,36,78,.3);animation:fadeUp .3s steps(4) both}
/* ── 채팅방 ── */
.chatbar{flex:none;display:flex;align-items:center;gap:9px;padding:8px 11px;background:#ece8fa;border-bottom:1px solid #c5bce8}
.backbtn{width:30px;height:27px;display:flex;align-items:center;justify-content:center;flex:none;color:#6b5fa8}
.cname{font-size:13.5px}
.csub{font-size:9.5px;color:#9a8fc8;margin-top:3px}
.msgs{flex:1;overflow-y:auto;padding:16px 12px 10px;display:flex;flex-direction:column;gap:3px;
 background:#fdfcff;border-top:1px solid #fff;box-shadow:inset 1px 2px 4px rgba(93,84,144,.14)}
/* 관전방: 미디어 플레이어 흰 스크린 */
.watchbg .msgs{background:#fdfffe}
.divider{align-self:center;margin:12px 0 8px;font-size:9.5px;color:#c39ede;letter-spacing:.1em}
.mrow{display:flex;align-items:flex-end;gap:8px;animation:fadeUp .28s steps(4) both}
.mrow.me{justify-content:flex-end}
.mrow .sp{width:26px;flex:none}
.mavatar{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
 border:1px solid #8a7fc0;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),1px 1px 0 rgba(93,84,144,.25)}
.mcol{display:flex;flex-direction:column;max-width:76%}
.mname{font-size:9.5px;margin:6px 0 3px 2px;letter-spacing:.04em;color:#9a8fc8}
.bubble{padding:8px 11px;font-size:12.5px;line-height:1.65;word-break:break-word;white-space:pre-wrap;border-radius:8px;
 background:#fff;border:1px solid #8a7fc0;color:#4a4276;box-shadow:2px 2px 0 rgba(138,127,192,.28)}
.mrow:not(.me) .bubble{border-bottom-left-radius:2px}
.mrow.me .bubble{border-bottom-right-radius:2px;box-shadow:-2px 2px 0 rgba(255,143,190,.4)}
/* 사진 말풍선 */
.bubble.photo{padding:4px;white-space:normal}
.bubble.photo img{display:block;width:100%;max-width:172px;border-radius:5px;border:1px solid #cfc6ee;
 background:#efeaf9;cursor:pointer;aspect-ratio:2/3;object-fit:cover}
.bubble.photo img:active{opacity:.82}
.bubble.photo .cap{padding:5px 7px 3px;font-size:12.5px;line-height:1.6;color:#4a4276;white-space:pre-wrap}
.lightbox{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
 background:rgba(43,36,78,.82);animation:fadeUp .18s steps(3) both;cursor:pointer;padding:22px}
.lightbox img{max-width:100%;max-height:100%;border:2px solid #fff;border-radius:4px;
 box-shadow:0 6px 24px rgba(0,0,0,.45)}
.typing{display:flex;gap:5px;padding:12px 12px}
.typing i{width:5px;height:5px;border-radius:50%;background:#8a7fc0;animation:blink 1s steps(2) infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.retry{align-self:flex-start;margin:8px 0 4px 34px;padding:8px 13px;font-family:inherit;font-size:11px;border-radius:0;
 border:1px solid #d4586b;background:#fff0f3;color:#c23b50;cursor:pointer;
 box-shadow:inset 1px 1px 0 #fff,2px 2px 0 rgba(212,88,107,.3);animation:fadeUp .3s steps(4)}
.retry:active{transform:translate(1px,1px);box-shadow:inset 1px 1px 0 #ffd7de}
.retry .why{display:block;margin-top:5px;font-size:9.5px;line-height:1.5;color:#a04255;
 opacity:.85;word-break:break-all;text-align:left;max-width:250px}
/* 입력바 */
.inputbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 10px calc(11px + env(safe-area-inset-bottom));
 background:#dcd6f2;border-top:1px solid #8a7fc0;box-shadow:inset 0 1px 0 #fff}
.inputbar input{flex:1;padding:10px 12px;font-size:16px;font-family:inherit;color:#4a4276;outline:none;border-radius:0}
.inputbar input::placeholder{color:#b0a6d8}
.sendbtn{width:40px;height:37px;display:flex;align-items:center;justify-content:center;flex:none;color:#4a4276}
.watchbar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
 padding:12px 14px calc(14px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.08em;color:#2f9e5a;
 background:#dcd6f2;border-top:1px solid #8a7fc0;box-shadow:inset 0 1px 0 #fff}

/* ── 캐릭터 프로필 — Y2K 미니홈피 카드 ── */
.avatar.clickable,.mavatar.clickable{cursor:pointer}
.avatar.clickable:active,.mavatar.clickable:active{transform:translateY(1px)}
.pfscreen{position:absolute;inset:0;z-index:38;background:#2b244e center/cover no-repeat;
 animation:fadeUp .22s steps(4) both}

.pfbgm .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
 font-family:inherit;font-size:9.5px;letter-spacing:.1em;color:#7a6cae}
.pfbgm .eq{flex:none;display:flex;align-items:flex-end;gap:2px;height:14px}
.pfbgm .eq i{width:3px;height:3px;border-radius:1px;background:currentColor}
.pfbgm.on .eq i{animation:eq .7s steps(3) infinite}
.pfbgm.on .eq i:nth-child(2){animation-delay:.2s}
.pfbgm.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
.pfbgmoff{margin:18px 18px 0;padding:9px 0;width:calc(100% - 36px);text-align:center;
 background:#f6f3fd;border:1px solid #e0d8f4;border-radius:20px;
 font-size:9.5px;letter-spacing:.1em;color:#c0b5dd}
/* TODAY / TALK */
.pfstats{display:flex;gap:8px;margin:14px 18px 0}
.pfstats .s{flex:1;padding:9px 0;text-align:center;background:#fff;border:1px solid #ecdff2}
.pfstats .l{display:block;font-size:8px;letter-spacing:.25em;color:#c3aacd}
.pfstats .v{display:block;margin-top:4px;font-size:14px}
.pfstickers{display:flex;justify-content:center;gap:12px;margin-top:16px;font-size:12px}
.pfclose{display:block;width:calc(100% - 36px);margin:14px 18px 18px;padding:10px 0;
 font-family:inherit;font-size:11px;letter-spacing:.2em;color:#4a4276;background:#ffe3f0;cursor:pointer}
/* ── 접속 상태 점 ── */
.pres{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:9px;color:#a79cd0}
.pres i{width:6px;height:6px;border-radius:50%;flex:none}
.pres.on i{background:#4fc98a;box-shadow:0 0 0 2px rgba(79,201,138,.22)}
.pres.away i{background:#f0b34a;box-shadow:0 0 0 2px rgba(240,179,74,.2)}
.pres.off i{background:#c3bcd8}
/* ── 🌙 관찰 버튼 ── */
.moonbtn{position:relative;display:flex;align-items:center;gap:6px;padding:0 9px;height:30px;
 font-family:inherit;font-size:10px;letter-spacing:.06em;color:#4a4276;white-space:nowrap;overflow:hidden}
.moonbtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(195,178,240,.5);
 transition:width .4s linear;pointer-events:none}
.moonbtn span{position:relative}
.moonbtn.cool{color:#9a8fc8}
/* ── 진행도 헤더 ── */
.progline{display:flex;align-items:center;gap:8px;margin:12px 4px 8px}
.progline .t{font-size:9.5px;letter-spacing:.3em;color:#b0a6d8;white-space:nowrap}
.progline .bar{flex:1;height:5px;background:#e6e0f6;border:1px solid #cfc6ee;overflow:hidden}
.progline .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb0d4,#c3b2f0)}
.progline .n{font-size:9.5px;color:#8a7fc0;white-space:nowrap}
/* 잠긴 칸의 남은 횟수 */
.hcell .need{position:absolute;left:0;right:0;top:50%;margin-top:14px;text-align:center;
 font-size:9px;letter-spacing:.05em;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.galcell{position:relative;aspect-ratio:2/3;border-radius:5px;overflow:hidden;border:1px solid #cfc6ee;
 background:#efeaf9;cursor:pointer;box-shadow:1px 2px 0 rgba(93,84,144,.2)}
.galcell img{width:100%;height:100%;object-fit:cover;display:block}
.galcell:active{opacity:.85}
.galcell.lock{background:#efeaf9;cursor:default}
.galcell.lock img{filter:blur(9px) grayscale(.8) brightness(1.06);transform:scale(1.1);opacity:.5}
.galcell .glock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:15px;color:#b7addb}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
const API = "https://null-api.re-moonroom.workers.dev/";

/* 프사를 교체해도 파일명이 같으면 브라우저·CDN이 옛 이미지를 계속 쓴다.
   사진을 갈아끼울 때마다 이 숫자를 올린다. */
const AV_V = "?v=2";

/* 캐릭터 / 방 정의 */
const CHARS = {
  jaeeon:{name:"이재언",color:"#7FD8D8",dk:"#2fa8a0",pale:"#cef0ee",img:"jaeeon-profile.png",zoom:"150%",pos:"50% 8%",
    gallery:["jaeeon-treat.png","jaeeon-care.png","jaeeon-cook.png","jaeeon-work.png","jaeeon-evening.png","jaeeon-market.png","jaeeon-laundry.png","jaeeon-car.png","jaeeon-classroom.png","jaeeon-rooftop.png"]},
  minhyun:{name:"이민현",color:"#FF9E80",dk:"#f0764a",pale:"#ffe0d2",img:"minhyun-profile.png",zoom:"150%",pos:"48% 8%",
    gallery:["minhyun-candy.png","minhyun-corridor.png","minhyun-rain.png","minhyun-gate.png","minhyun-morning.png","minhyun-alley.png","minhyun-store.png","minhyun-gym.png","minhyun-busstop.png","minhyun-winter.png","minhyun-snow.png"]},
};
const ROOMS = [
  {id:"jaeeon", name:"이재언", color:"#7FD8D8", type:"dm",    sub:"보건교사",   empty:"보건교사, 29세"},
  {id:"minhyun",name:"이민현", color:"#FF9E80", type:"dm",    sub:"3학년",      empty:"고등학생, 20세"},
  {id:"group",  name:"단톡방", color:"#B8A5E3", type:"group", sub:"group chat", empty:"loading..."},
  {id:"health", name:"두 사람", color:"#9aa3d8", type:"watch", sub:"LIVE cam",  empty:"access denied"},
];
const roomOf = id => ROOMS.find(r=>r.id===id);

/* 사진: 백엔드가 보내는 key ↔ 실제 파일(key.png). 목록에 없는 key는 무시한다. */
const PHOTO_FILES={};
Object.values(CHARS).forEach(c=>c.gallery.forEach(f=>{PHOTO_FILES[f.replace(/\.png$/,"")]=f}));
const photoSrc = k => (k&&PHOTO_FILES[k])||null;

/* .hidden: 대화가 쌓이면 백엔드가 해금해준다 */
/* .hidden — room/at은 worker.js의 UNLOCKS와 같아야 한다.
   어긋나면 화면에 표시되는 "N번 남음"이 실제 해금 시점과 달라진다. */
const HIDDEN=[
  {key:"jaeeon-bag",             file:"jaeeon-bag.png",             label:"재언의 가방", room:"jaeeon", at:12},
  {key:"minhyun-bag",            file:"minhyun-bag.png",            label:"민현의 가방", room:"minhyun", at:12},
  {key:"jaeeon-room",            file:"jaeeon-room.png",            label:"재언의 방", room:"jaeeon", at:26},
  {key:"minhyun-room",           file:"minhyun-room.png",           label:"민현의 방", room:"minhyun", at:26},
  {key:"jaeeon-playlist",        file:"jaeeon-playlist.png",        label:"재언의 플레이리스트", room:"jaeeon", at:44},
  {key:"minhyun-playlist",       file:"minhyun-playlist.png",       label:"민현의 플레이리스트", room:"minhyun", at:44},
  {key:"jaeeon-ticket",          file:"jaeeon-ticket.png",          label:"재언의 티켓", room:"jaeeon", at:64},
  {key:"minhyun-ticket",         file:"minhyun-ticket.png",         label:"민현의 티켓", room:"minhyun", at:64},
  {key:"jaeeon-yearbook",        file:"jaeeon-yearbook.png",        label:"재언의 졸업사진", room:"jaeeon", at:90},
  {key:"minhyun-yearbook",       file:"minhyun-yearbook.png",       label:"민현의 졸업사진", room:"minhyun", at:90},
  {key:"jaeeon-diary",           file:"jaeeon-diary.png",           label:"재언의 일기", room:"jaeeon", at:120},
  {key:"minhyun-diary",          file:"minhyun-diary.png",          label:"민현의 일기", room:"minhyun", at:120},
];
const HIDDEN_LABEL={};HIDDEN.forEach(h=>{HIDDEN_LABEL[h.key]=h.label});
const loadUnlocked=()=>{try{return JSON.parse(localStorage.getItem("null_unlocked"))||[]}catch(e){return[]}};
const saveUnlocked=a=>{try{localStorage.setItem("null_unlocked",JSON.stringify(a))}catch(e){}};

/* 색 유틸: hex → rgba */
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};

/* localStorage */
const loadStore=()=>{try{const s=JSON.parse(localStorage.getItem("null_store_v1"));if(s&&s.msgs)return{msgs:s.msgs,unread:s.unread||{}}}catch(e){}return{msgs:{},unread:{}}};
const saveStore=s=>{try{localStorage.setItem("null_store_v1",JSON.stringify(s))}catch(e){}};
const loadProfile=()=>{try{return JSON.parse(localStorage.getItem("null_profile"))||{}}catch(e){return{}}};

/* 시간 포맷 */
const fmtClock=ts=>{const d=new Date(ts);const h=d.getHours(),ap=h<12?"오전":"오후";return `${ap} ${h%12||12}:${String(d.getMinutes()).padStart(2,"0")}`};
const isToday=ts=>{const d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()};
const fmtDivider=ts=>isToday(ts)?fmtClock(ts):`${new Date(ts).getMonth()+1}월 ${new Date(ts).getDate()}일 ${fmtClock(ts)}`;
const fmtListTime=ts=>isToday(ts)?fmtClock(ts):`${new Date(ts).getMonth()+1}월 ${new Date(ts).getDate()}일`;
const fmtDay=ts=>{const d=new Date(ts),y=d.getFullYear();
  return (y!==new Date().getFullYear()?y+"년 ":"")+`${d.getMonth()+1}월 ${d.getDate()}일`};

/* 아이콘: 픽셀풍 (crispEdges) */
const px={shapeRendering:"crispEdges"};
const MoonIcon=({size=14,color})=><svg width={size} height={size} viewBox="0 0 14 14" style={px}><path d="M9 1h2v1h1v1h-1v-1h-2v1H7v1H6v2H5v3h1v1h1v1h2v1h2v1h1v1h-1v1H8v-1H6v-1H4v-1H3v-1H2v-2H1V6h1V4h1V3h1V2h2V1h3z" fill={color||"currentColor"} opacity=".9"/><rect x="8" y="2" width="3" height="1" fill={color||"currentColor"}/><rect x="7" y="3" width="1" height="1" fill={color||"currentColor"}/></svg>;
const BackIcon=()=><svg width="13" height="13" viewBox="0 0 14 14" style={px}><path d="M8 2h2v2H8v2H6v2h2v2h2v2H8v-2H6V8H4V6h2V4h2V2z" fill="currentColor"/></svg>;
const SendIcon=()=><svg width="14" height="14" viewBox="0 0 14 14" style={px}><path d="M6 1h2v2h2v2h2v2h-2V5H8v8H6V5H4v2H2V5h2V3h2V1z" fill="currentColor"/></svg>;
const StarGlyph=({color="#fff"})=><span style={{fontSize:11,color,textShadow:"1px 1px 0 rgba(93,84,144,.4)"}}>✦</span>;
/* ── 접속 상태 ──
   시간대만 보고 정한다. 서버를 부르지 않으므로 비용이 없다.
   재언은 근무 시간에 보건실에 있고, 민현은 학교에 매여 있다. */
function presence(id, now){
  const h=(now||new Date()).getHours();
  if(id==="jaeeon"){
    if(h>=8&&h<17)  return {s:"on",  t:"보건실"};
    if(h>=17&&h<23) return {s:"away",t:"퇴근"};
    if(h>=23||h<1)  return {s:"away",t:"집"};
    return {s:"off", t:"자는 중"};
  }
  if(id==="minhyun"){
    if(h>=8&&h<16)  return {s:"away",t:"수업 중"};
    if(h>=16&&h<22) return {s:"on",  t:"야자"};
    if(h>=22||h<2)  return {s:"on",  t:"안 자는 중"};
    return {s:"off", t:"꺼짐"};
  }
  return null;
}

/* ── 관계 온도 ──
   단계 이름은 화면에 쓰지 않는다. 대놓고 쓰면 몰입이 깨진다 — 색으로만 말한다. */
const HEAT=[
  {w:1,  a:.28},   // 처음
  {w:1.5,a:.55},   // 익숙
  {w:2,  a:.8 },   // 균열
  {w:2.5,a:1  },   // 시한
];
const heatRing=(ch,idx)=>({borderWidth:HEAT[idx].w+"px",borderStyle:"solid",
  borderColor:rgba(ch.dk,HEAT[idx].a)});

/* ── 🌙 관찰 쿨타임 ──
   관찰은 흔하면 값이 떨어진다. 연타로 새는 API 비용도 여기서 막힌다. */
const AUTO_COOL=5*60*1000;
const loadAutoAt=()=>{const v=+localStorage.getItem("null_auto_at");return v||0};
const saveAutoAt=t=>{try{localStorage.setItem("null_auto_at",String(t))}catch(e){}};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

/* ── 사진첩(Cam) ──
   처음부터 다 보여주면 앨범이 아니라 목록이다.
   실제로 받은 사진만 한 장씩 꽂힌다. 대화 기록에서 그대로 뽑으므로 별도 저장이 없다. */
function seenPhotos(msgs){
  const set=new Set();
  Object.values(msgs||{}).forEach(list=>(list||[]).forEach(m=>{if(m.photo)set.add(m.photo)}));
  return set;
}

/* 캐릭터 프로필 아이콘 */
const CrossIcon=({size=14,color="#3fbdb4"})=><svg width={size} height={size} viewBox="0 0 14 14" style={px}><path d="M5 2h4v3h3v4H9v3H5V9H2V5h3V2z" fill={color}/></svg>;
const Star4Icon=({size=14,color="#ff8a5f"})=><svg width={size} height={size} viewBox="0 0 14 14"><path d="M7 0l1.8 5.2L14 7l-5.2 1.8L7 14 5.2 8.8 0 7l5.2-1.8z" fill={color}/></svg>;
const LockIcon=({size=16})=><svg width={size} height={size} viewBox="0 0 14 14" style={px}><path d="M4 6V4h1V3h1V2h2v1h1v1h1v2" fill="none" stroke="#fff" strokeWidth="1.5"/><rect x="3" y="6" width="8" height="6" fill="#fff"/><rect x="6" y="8" width="2" height="3" fill="#8f86c9"/></svg>;
/* 단톡방: 물방울(비누방울) 아이콘 */
const BubbleIcon=({size=16})=><svg width={size} height={size} viewBox="0 0 16 16"><circle cx="7" cy="8" r="5.4" fill="none" stroke="#9db7e8" strokeWidth="1.3"/><circle cx="7" cy="8" r="5.4" fill="#cfe0f8" opacity=".45"/><path d="M4.4 6.2a3.4 3.4 0 0 1 2-1.7" fill="none" stroke="#fff" strokeWidth="1.4" strokeLinecap="round"/><circle cx="12.6" cy="3.6" r="1.7" fill="none" stroke="#9db7e8" strokeWidth="1"/><circle cx="12.6" cy="3.6" r="1.7" fill="#e2edfb" opacity=".5"/><circle cx="13.4" cy="12.4" r="1.1" fill="none" stroke="#9db7e8" strokeWidth=".9"/></svg>;
const CharIcon=({id,size=15})=>id==="jaeeon"?<CrossIcon size={size} color={CHARS.jaeeon.dk}/>:id==="minhyun"?<Star4Icon size={size} color={CHARS.minhyun.dk}/>:<BubbleIcon size={size}/>;

/* 떠다니는 반짝이 레이어 */
const SPARKS=[[6,10,10,"#fff"],[86,7,8,"#ffd0e6"],[70,24,12,"#fff"],[13,42,9,"#ffe9a8"],[91,50,10,"#d5c8ff"],[38,68,8,"#fff"],[76,84,11,"#ffd0e6"],[8,88,8,"#d5c8ff"]];
const Sparkles=()=><React.Fragment>{SPARKS.map((s,i)=><span key={i} className="spark" style={{left:s[0]+"%",top:s[1]+"%",width:s[2],height:s[2],background:s[3],animationDelay:(i*0.4)+"s"}}/>)}</React.Fragment>;

/* 창 타이틀바의 동그란 ─ □ ✕ */
const WinDots=({onClose})=><div className="dots"><span className="d1">─</span><span className="d2">□</span><span className="d3" onClick={onClose} style={onClose?{cursor:"pointer"}:null}>✕</span></div>;

/* 프로필 사진 줄맄 스타일 */
/* 확대율·위치는 사진마다 다르다. 사진을 갈아끼우면 CHARS의 zoom/pos를 다시 잡을 것.
   너무 키우면 머리 위가 잘린다 — 150% 근처가 머리 전체가 들어오는 한계다. */
const faceBg=ch=>({backgroundImage:`url("${ch.img+AV_V}")`,backgroundSize:ch.zoom||"150%",backgroundPosition:ch.pos,backgroundColor:ch.pale});
function Avatar({room,size=42,onProfile,heat}){
  const st={width:size,height:size,...(heat!=null?heatRing(CHARS[room.id],heat):null)};
  // 1:1 방의 얼굴만 눌러서 프로필로 들어간다. 단톡/관전방은 대상이 없다.
  const hit=onProfile&&room.type==="dm"
    ? {className:"avatar clickable",onClick:e=>{e.stopPropagation();onProfile(room.id)}}
    : {className:"avatar"};
  if(room.type==="group"){ // 물방울
    return <div className="avatar" style={{...st,background:"linear-gradient(180deg,#ffffff,#e0ecfa)"}}><BubbleIcon size={size*.6}/></div>;
  }
  if(room.type==="watch"){ // 관전방: 달
    return <div className="avatar" style={{...st,color:"#8a7fc0",background:"linear-gradient(180deg,#ffffff,#dde3f4)"}}><MoonIcon size={size*.5}/></div>;
  }
  return <div {...hit} style={{...st,...faceBg(CHARS[room.id])}}/>;
}

/* ── 캐릭터 프로필 ──
   관계 단계에 따라 상태메시지와 프로필 뮤직이 바뀐다.
   단계 기준(0/16/40/80)은 worker.js의 STAGES와 같아야 한다. */
const STAGE_AT=[0,16,40,80];
const stageIdx=n=>{let i=0;STAGE_AT.forEach((a,k)=>{if(n>=a)i=k});return i};

/* 음원 위치. 저장소에 파일을 올리면 그대로 잡히고,
   R2 같은 외부 호스팅을 쓰면 MEDIA만 그 주소로 바꾸면 된다.
   파일이 없으면 재생 버튼은 조용히 숨는다. */
/* 앱(lib/profiles.ts)과 같은 R2 버킷·같은 파일명을 쓴다 */
const MEDIA="https://pub-6e08882e001c49cbb013168e4b9e8d38.r2.dev/";
const TRACKS={
  "jaeeon-1": {file:"jaeeon-1.mp3", artist:"Noah Vane", title:"Two Bowls"},
  "minhyun-1":{file:"minhyun-1.mp3",artist:"Luca Riot", title:"Ask Again Tomorrow"},
};
const trackOf=k=>{const t=k&&TRACKS[k];return t&&t.file?{...t,src:MEDIA+t.file}:null};

/* 단계별 상태메시지 — 없으면 안 띄운다 */
const PROFILES={
  jaeeon:{bg:"jaeeon-bg.png",stages:[
    {status:"",                  track:"jaeeon-1"},
    {status:"별일 없음.",                  track:"jaeeon-1"},
    {status:"약 채워 놓을 것.",                  track:"jaeeon-1"},
    {status:"정리할 것들.",                  track:"jaeeon-1"},
  ]},
  minhyun:{bg:"minhyun-bg.png",stages:[
    {status:"",                  track:null},
    {status:"보건실 침대가 제일 낫다",                  track:"minhyun-1"},
    {status:"안 물어보면 말 안 함",                  track:"minhyun-1"},
    {status:"남은 날 세는 중",                  track:"minhyun-1"},
  ]},
};

/* 프로필 뮤직 — 눌러야 나온다. 곡 정보가 비어 있으면 "BGM 없음"으로 둔다.
   (없는 곡 제목을 지어내지 않기 위해 TRACKS의 artist/title은 비워둔 상태다) */
function MusicBar({track,color}){
  const ref=useRef(null);
  const [playing,setPlaying]=useState(false);
  const [dead,setDead]=useState(false);   // 파일이 없으면 재생 불가로 처리
  useEffect(()=>{const a=ref.current;return()=>{if(a)a.pause()}},[]);
  const label=track?[track.artist,track.title].filter(Boolean).join(" — "):"";
  if(!track||dead)return <div className="pfbgmoff">♪  BGM 없음</div>;
  const toggle=()=>{
    const a=ref.current;if(!a)return;
    if(playing){a.pause();setPlaying(false)}
    else a.play().then(()=>setPlaying(true)).catch(()=>setDead(true));
  };
  return <React.Fragment>
    <audio ref={ref} src={track.src} loop preload="none" onError={()=>setDead(true)} onEnded={()=>setPlaying(false)}/>
    <button className={"pfbgm"+(playing?" on":"")} onClick={toggle} style={{color}}>

      <span className="eq"><i/><i/><i/></span>
    </button>
  </React.Fragment>;
}

/* 레트로 다이얼로그 셸 */
function Dialog({title,onClose,children}){
  return <div className="dlgov" onClick={onClose}>

/* 탭하면 입력으로 바뀌는 빈칸 */
function Blank({value,onSave,width}){
  const [edit,setEdit]=useState(false);
  const [v,setV]=useState(value||"");
  useEffect(()=>setV(value||""),[value,edit]);
  const done=()=>{setEdit(false);onSave(v.trim())};
  if(edit)return <input className="blankin sunken" style={width?{width}:null} value={v} autoFocus maxLength={20}
    onChange={e=>setV(e.target.value)} onBlur={done} onKeyDown={e=>e.key==="Enter"&&done()}/>;
  return <span className={"blank"+(value?" filled":"")} onClick={()=>setEdit(true)}>{value||"□□"}</span>;
}

/* [편집 → 기록] 지금까지 채운 빈칸을 숫자로 보여준다.
   대사로 못 하는 말을 통계가 대신한다 — 이 앱의 주제 그대로. */
function LogPanel({store,counts,unlocked,album}){
  const allPhotos=Object.values(CHARS).reduce((n,c)=>n+c.gallery.length,0);
  const first=Object.values(store.msgs||{}).flat().reduce((a,m)=>!a||m.ts<a?m.ts:a,0);
  const rows=[
    ["이재언과", (counts.jaeeon||0)+"번"],
    ["이민현과", (counts.minhyun||0)+"번"],
    ["단톡방에서", (counts.group||0)+"번"],
    ["받은 사진", album.size+" / "+allPhotos],
    [".hidden", unlocked.length+" / "+HIDDEN.length],
  ];
  return <div style={{padding:"4px 2px"}}>
    {rows.map(([k,v])=><div key={k} className="dlgline"
      style={{display:"flex",justifyContent:"space-between",gap:14,fontSize:12}}>
      <span style={{color:"#8a4f74"}}>{k}</span><span style={{color:"#4a4276"}}>{v}</span></div>)}
    <div className="dlgline" style={{marginTop:10,fontSize:10.5,color:"#b0a6d8",textAlign:"center"}}>
      {first?"처음 널 만난 날 · "+fmtDay(first):"아직 아무 말도 오가지 않았다"}
    </div>
  </div>;
}

/* [대화 → 찾기] 방을 넘나들며 찾는다. 어디서 그 말을 했는지 기억나지 않을 때. */
function FindPanel({store,name,onOpen}){
  const [q,setQ]=useState("");
  const key=q.trim();
  const hits=!key?[]:ROOMS.flatMap(r=>(store.msgs[r.id]||[])
    .filter(m=>(m.text||"").includes(key))
    .map(m=>({r,m}))).slice(-40).reverse();
  return <div style={{padding:"2px"}}>
    <input className="sunken" value={q} onChange={e=>setQ(e.target.value)} autoFocus
      placeholder="찾을 말" style={{width:"100%",padding:"9px 11px",fontSize:15,
      fontFamily:"inherit",color:"#4a4276",outline:"none",borderRadius:0}}/>
    <div style={{maxHeight:260,overflowY:"auto",marginTop:10}}>
      {key&&!hits.length&&<div className="dlgline" style={{textAlign:"center",color:"#b0a6d8",fontSize:11}}>없습니다</div>}
      {hits.map(({r,m},i)=><div key={i} onClick={()=>onOpen(r.id)}
        style={{padding:"7px 8px",marginBottom:5,cursor:"pointer",background:"#fff",
        border:"1px solid #e7dcf4",fontSize:11,lineHeight:1.6}}>
        <div style={{fontSize:9,color:CHARS[m.sender]?CHARS[m.sender].dk:"#8a7fc0",letterSpacing:".06em"}}>
          {m.sender==="user"?name:(CHARS[m.sender]?CHARS[m.sender].name:r.name)} · {r.name}
        </div>
        <div style={{color:"#4a4276",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.text}</div>
      </div>)}
    </div>
  </div>;
}

function RoomList({store,name,unlocked,counts,onOpen,onProfile,onAuto,autoLoading,onExport,onReadAll,onRename,onReset,onToast,profile,onSaveField}){

  const [dlg,setDlg]=useState(null);       // 'profile'|'help'|'log'|'find'
  const [tab,setTab]=useState("rooms");    // 'rooms'|'cam'|'hidden'

      <span className="ddwrap">
        {mb("edit","편집")}

        {mb("chat","대화")}

      </span>
      {mb("help","etc.",()=>{setMenu(null);setDlg("help")})}
      <button className={"moonbtn bevel"+(left>0&&!autoLoading?" cool":"")} style={{marginLeft:"auto"}}
        title={autoLoading?"두 사람의 대화를 엿보는 중":left>0?"관찰은 자주 할 수 없다":"두 사람이 뭘 하고 있는지 본다"}
        onClick={()=>{ if(autoLoading)return;
          if(left>0){onToast("아직은 볼 수 없습니다 · "+mmss(left));return}
          const t=Date.now(); setAutoAt(t); saveAutoAt(t); onAuto(); }}>
        {autoLoading&&<span className="fill" style={{width:"100%"}}/>}
        <MoonIcon/>

              onClick={()=>un?setZoom(h.file):onToast(need?"아직 열 수 없습니다 · "+need+"번 남음":"곧 열립니다")}>

    </Dialog>}
    {zoom&&<div className="lightbox" onClick={()=>setZoom(null)}><img src={zoom} alt=""/></div>}

/* ── 채팅방 ── */
function ChatRoom({room,msgs,busy,failed,onBack,onSend,onRetry,onProfile}){
  const [v,setV]=useState("");
  const [zoom,setZoom]=useState(null);   // 사진 확대해서 보기
  const boxRef=useRef(null);
  const watch=room.type==="watch";
  useEffect(()=>{const el=boxRef.current;if(el)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})},[msgs.length,busy,failed]);
  const send=()=>{const t=v.trim();if(!t||busy)return;setV("");onSend(t)};
  const senderMeta=s=>s==="user"?null:(CHARS[s]||{name:s,color:"#9aa3d8",pale:"#e2e6f5",dk:"#6b5fa8"});
  return <div className={"screen"+(watch?" watchbg":"")}>
    <div className="tb" style={{background:watch?"linear-gradient(90deg,#aab3d6,#c9c0ee)":`linear-gradient(90deg, ${rgba(room.color,.95)}, #c3b2f0)`}}>
      {room.name}{watch?".cam":".chat"}<WinDots/>
    </div>
    <div className="chatbar">
      <button className="backbtn bevel" onClick={onBack}><BackIcon/></button>
      <Avatar room={room} size={31} onProfile={onProfile}/>
      <div>
        <div className="cname">{room.name}</div>
        <div className="csub">{watch?<><span className="rec"/> 두 사람의 대화를 보는 중</>:room.sub}</div>
      </div>
    </div>
    <div className="msgs" ref={boxRef}>
      {msgs.length===0&&!busy&&room.empty&&<div className="empty">
        <span style={{fontSize:13,color:"#ff8fbe"}}>✧ ✦ ✧</span><br/>{room.empty}
      </div>}
      {msgs.map((m,i)=>{
        const prev=msgs[i-1];
        const gap=!prev||m.ts-prev.ts>10*60*1000;
        const me=m.sender==="user";
        const meta=senderMeta(m.sender);
        const head=gap||!prev||prev.sender!==m.sender; // 클러스터 시작
        const showName=head&&!me&&(room.type==="group"||watch);
        return <React.Fragment key={m.id||i}>
          {gap&&<div className="divider">✦ {fmtDivider(m.ts)} ✦</div>}
          <div className={"mrow"+(me?" me":"")} style={{marginTop:head?8:0}}>
            {!me&&(head?
              <div className={"mavatar"+(CHARS[m.sender]?" clickable":"")}
                   onClick={()=>CHARS[m.sender]&&onProfile&&onProfile(m.sender)}
                   style={meta.img?faceBg(meta):{background:`linear-gradient(180deg,#ffffff, ${meta.pale}`+")"}}>{!meta.img&&<CharIcon id={m.sender} size={13}/>}</div>
              :<div className="sp"/>)}
            <div className="mcol">
              {showName&&<span className="mname" style={{color:meta.dk}}>{meta.name}</span>}
              <div className={"bubble"+(m.photo?" photo":"")} style={me?{background:`linear-gradient(135deg, ${rgba(room.color,.5)} 0%, #ffffff 135%)`}:null}>
                {m.photo
                  ?<React.Fragment>
                    <img src={photoSrc(m.photo)} alt="" loading="lazy" onClick={()=>setZoom(photoSrc(m.photo))}/>
                    {m.text&&<div className="cap">{m.text}</div>}
                  </React.Fragment>
                  :m.text}
              </div>
            </div>
          </div>
        </React.Fragment>;
      })}
      {busy&&<div className="mrow" style={{marginTop:8}}>
        <div className="mavatar" style={{background:"#ece8fa"}}/>
        <div className="bubble typing"><i/><i/><i/></div>
      </div>}
      {failed&&!busy&&<button className="retry" onClick={onRetry}>
        응답이 오지 않았어요 · 다시 시도
        {failed.detail&&<span className="why">{failed.detail}</span>}
      </button>}
    </div>
    {watch?
      <div className="watchbar"><span className="rec"/>이 대화에는 참여할 수 없습니다</div>
      :<div className="inputbar">
        <input className="sunken" value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button className="sendbtn bevel" disabled={!v.trim()||busy} onClick={send} style={{background:`linear-gradient(180deg, #ffffff -30%, ${room.color} 95%)`}}><SendIcon/></button>
      </div>}
    {zoom&&<div className="lightbox" onClick={()=>setZoom(null)}><img src={zoom} alt=""/></div>}
  </div>;
}

  const [unlocked,setUnlocked]=useState(loadUnlocked);
  const [toast,setToast]=useState(null);            // 해금 알림
  const [view,setView]=useState("list");            // 'list' | roomId
  const [busy,setBusy]=useState({});                // 방별 타이핑 인디케이터
  const [failed,setFailed]=useState({});            // 방별 실패 payload (재시도용)
  const [autoLoading,setAutoLoading]=useState(false);
  const viewRef=useRef(view); viewRef.current=view;
  const storeRef=useRef(store); storeRef.current=store;
  const profileRef=useRef(profile); profileRef.current=profile;
  const unlockedRef=useRef(unlocked); unlockedRef.current=unlocked;
  const queueRef=useRef([]);                        // 순차 표시 대기열
  const runningRef=useRef(false);
  const inflightRef=useRef({});
  useEffect(()=>{saveStore(store)},[store]);
  useEffect(()=>{try{localStorage.setItem("null_profile",JSON.stringify(profile))}catch(e){}},[profile]);
  useEffect(()=>{saveUnlocked(unlocked)},[unlocked]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t)},[toast]);

  /* 메시지 추가 (+현재 안 보고 있는 방이면 unread 증가) */
  const appendMsg=(room,msg)=>setStore(s=>({
    msgs:{...s.msgs,[room]:[...(s.msgs[room]||[]),msg]},
    unread:viewRef.current!==room?{...s.unread,[room]:(s.unread[room]||0)+1}:s.unread
  }));

  /* 대기열 처리: 0.6초 간격 순차 등장 */
  const pump=()=>{
    if(runningRef.current)return;
    runningRef.current=true;
    const step=()=>{
      const it=queueRef.current.shift();
      if(!it){runningRef.current=false;return}
      appendMsg(it.room,{id:Date.now()+Math.random(),sender:it.sender,text:it.text,photo:it.photo,ts:Date.now()});
      if(!queueRef.current.some(q=>q.room===it.room)&&!inflightRef.current[it.room])
        setBusy(b=>({...b,[it.room]:false}));
      setTimeout(step,600);
    };
    setTimeout(step,500); // 타이핑 인디케이터를 잠깐 보여준 뒤 첫 버블
  };
  const enqueue=(room,messages)=>{
    messages.forEach(m=>{
      if(!m)return;
      const photo=photoSrc(m.photo)?m.photo:null;   // 없는 파일이면 사진은 버리고 말만 남긴다
      const text=(m.text||"").trim();
      if(text||photo)queueRef.current.push({room,sender:m.sender||room,text,photo});
    });
    pump();
  };

  /* history / signals / counts / user_profile 구성 */
  const buildHistory=ms=>ms.slice(-30).map(m=>({role:m.sender==="user"?"user":"assistant",sender:m.sender,
    content:m.photo?((m.text?m.text+" ":"")+"(사진을 보냈다)"):m.text}))
    .filter(m=>m.content&&m.content.trim());
  /* 최근에 보낸 사진 — 같은 사진이 연달아 나오지 않게 백엔드에 알려준다 */
  const recentPhotos=room=>{
    const ms=(storeRef.current.msgs[room]||[]).slice(-24),out=[];
    for(let i=ms.length-1;i>=0&&out.length<4;i--) if(ms[i].photo&&!out.includes(ms[i].photo))out.push(ms[i].photo);
    return out;
  };
  /* 방별 누적 대화 수 — 관계 단계와 .hidden 해금의 근거.
     방금 보낸 메시지는 아직 상태에 반영되기 전이라 override로 직접 넘긴다 */
  const roomCounts=override=>{
    const c={};
    ["jaeeon","minhyun","group","health"].forEach(r=>{
      c[r]=(override&&override[r]!=null)?override[r]:(storeRef.current.msgs[r]||[]).length;
    });
    return c;
  };
  const buildSignals=exclude=>{
    const sig={},t0=new Date();t0.setHours(0,0,0,0);
    ["jaeeon","minhyun","group"].forEach(r=>{
      if(r===exclude)return;
      const ms=storeRef.current.msgs[r]||[];if(!ms.length)return;
      sig[r]={count:ms.filter(m=>m.ts>=t0.getTime()).length,minsAgo:Math.max(0,Math.floor((Date.now()-ms[ms.length-1].ts)/60000))};
    });
    return sig;
  };
  /* 채워진 칸만 보낸다 */
  const userProfile=()=>{
    const out={};
    Object.entries(profileRef.current).forEach(([k,v])=>{if(v)out[k]=v});
    return Object.keys(out).length?out:null;
  };

  /* 백엔드가 알려준 해금 목록을 반영하고, 새로 열린 게 있으면 알린다 */
  const applyUnlocked=list=>{
    if(!Array.isArray(list)||!list.length)return;
    const now=unlockedRef.current;
    const fresh=list.filter(k=>HIDDEN_LABEL[k]&&!now.includes(k));
    if(!fresh.length)return;
    setUnlocked([...now,...fresh]);
    setToast(fresh.length===1?`.hidden — ${HIDDEN_LABEL[fresh[0]]}`:`.hidden — ${fresh.length}개가 열렸다`);
  };

  /* API 요청 — 실패 시 조용한 재시도 버튼 */
  const request=async(bucket,payload)=>{
    const up=userProfile();
    if(up)payload.user_profile=up; else delete payload.user_profile;
    if(!payload.counts)payload.counts=roomCounts();
    inflightRef.current[bucket]=true;
    setBusy(b=>({...b,[bucket]:true}));
    setFailed(f=>({...f,[bucket]:null}));
    try{
      const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const data=await res.json().catch(()=>null);
      if(!res.ok){
        // 서버가 알려준 실패 사유를 그대로 들고 올라간다
        const err=new Error("HTTP "+res.status);
        err.detail=(data&&(data.detail||data.error))||("HTTP "+res.status);
        throw err;
      }
      inflightRef.current[bucket]=false;
      const list=(data&&data.messages)||[];
      if(list.length)enqueue(bucket,list);
      else setBusy(b=>({...b,[bucket]:false}));
      applyUnlocked(data&&data.unlocked);
    }catch(e){
      inflightRef.current[bucket]=false;
      setBusy(b=>({...b,[bucket]:false}));
      const detail=String(e.detail||e.message||e).slice(0,500);
      // 화면(재시도 버튼 아래)과 콘솔 양쪽에 남긴다 — 어느 쪽을 보든 원인이 보이게
      console.error("%c[NULL] 실패 원인 ▶ "+detail,"color:#c23b50;font-size:13px;font-weight:bold");
      setFailed(f=>({...f,[bucket]:{payload,detail}}));
    }
  };

  /* 일반 대화 전송 */
  const send=(room,text)=>{
    const userMsg={id:Date.now()+Math.random(),sender:"user",text,ts:Date.now()};
    appendMsg(room,userMsg);
    const next=[...(storeRef.current.msgs[room]||[]),userMsg];
    const history=buildHistory(next);
    request(room,{mode:"chat",room,user_name:name,history,signals:buildSignals(room),
      recent_photos:recentPhotos(room),counts:roomCounts({[room]:next.length})});
  };
  /* 재시도: 저장해둔 payload를 최신 history로 갱신해 다시 전송 */
  const retry=room=>{
    const p=failed[room]&&failed[room].payload;if(!p)return;
    if(p.mode==="chat")p.history=buildHistory(storeRef.current.msgs[room]||[]);
    p.recent_photos=recentPhotos(p.mode==="auto"?"health":room);
    request(room,p);
  };
  /* 시간 경과(달 버튼): 자율 대화 생성 → 관전방에 축적 */
  const doAuto=async()=>{
    if(autoLoading)return;
    setAutoLoading(true);
    await request("health",{mode:"auto",user_name:name,
      history:buildHistory(storeRef.current.msgs.health||[]),signals:buildSignals(null),recent_photos:recentPhotos("health")});
    setAutoLoading(false);
  };

  /* [편집] 대화 저장: 전체 방 → .txt 다운로드 */
  const exportTxt=()=>{
    const lines=["NULL — 대화 기록","내보낸 시각: "+new Date().toLocaleString("ko-KR"),""];
    ROOMS.forEach(r=>{
      const ms=storeRef.current.msgs[r.id]||[];if(!ms.length)return;
      lines.push("──── "+r.name+" ────");
      ms.forEach(m=>{
        const who=m.sender==="user"?name:(CHARS[m.sender]?CHARS[m.sender].name:m.sender);
        lines.push(`[${fmtDivider(m.ts)}] ${who}: ${m.photo?"(사진) ":""}${m.text||""}`);
      });
      lines.push("");
    });
    const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="NULL-대화기록.txt";a.click();
    URL.revokeObjectURL(a.href);
  };
  /* [대화] 읽음 처리 */
  const readAll=()=>setStore(s=>({...s,unread:{}}));
  /* [당신] 이름 변경 / 새로 시작 */
  const rename=n=>{localStorage.setItem("null_name",n);setName(n)};
  const reset=()=>{localStorage.clear();setStore({msgs:{},unread:{}});setProfile({});setUnlocked([]);setName("")};

  const openRoom=id=>{setView(id);setStore(s=>({...s,unread:{...s.unread,[id]:0}}))};
  /* 프로필 화면. 대화 수는 그 캐릭터가 낀 모든 방을 합쳐 센다 (worker의 단계 기준과 같다) */
  const [prof,setProf]=useState(null);
  const profCount=id=>{
    const s=storeRef.current.msgs||{};
    return (s[id]||[]).length+(s.group||[]).filter(m=>m.sender===id||m.sender==="user").length;
  };
  const enter=n=>{localStorage.setItem("null_name",n);setName(n)};

  return <div className="phone">
    {!name?<Onboarding onEnter={enter}/>
    :view==="list"?<RoomList store={store} name={name} unlocked={unlocked} counts={roomCounts()}
       onOpen={openRoom} onProfile={setProf} onAuto={doAuto} autoLoading={autoLoading}
       onExport={exportTxt} onReadAll={readAll} onRename={rename} onReset={reset} onToast={setToast}
       profile={profile} onSaveField={(k,v)=>setProfile(p=>({...p,[k]:v}))}/>
    :<ChatRoom room={roomOf(view)} msgs={store.msgs[view]||[]} busy={!!busy[view]} failed={failed[view]}
       onBack={()=>setView("list")} onSend={t=>send(view,t)} onRetry={()=>retry(view)} onProfile={setProf}/>}
    {prof&&<Profile char={prof} count={profCount(prof)} onBack={()=>setProf(null)}/>}
    {toast&&<div className="toast"><span>✧ {toast}</span></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
