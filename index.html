<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content: 안드로이드 크롬은 키보드가 올라와도 레이아웃
     높이를 안 줄이는 게 기본(resizes-visual)이다. 그러면 100dvh가 전체 화면 높이로
     남아서, 브라우저가 입력칸만 보이게 스크롤하고 그 아래로 폰 껍데기가 남는다.
     이 값을 주면 키보드만큼 높이가 줄어 입력칸이 키보드 바로 위에 붙는다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>NULL</title>
<!-- 아이콘 파일이 없으면 브라우저가 알아서 /favicon.ico를 찾다가 404를 낸다.
     파일을 새로 올리는 대신 여기에 그려 넣는다 — 요청이 아예 안 나간다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c3b2f0'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='monospace'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<!-- 데모 대사·매칭. 문구집에서 만들어진 파일이라 직접 고치지 않는다 -->
<script src="demo-lines.js?v=173"></script>
<script>
/* 리스타트의 뒷정리.
   지우고 바로 다시 여는 방식은 안 됐다 — 다시 열리기 전 몇 밀리초 사이에
   아직 살아 있는 화면이 상태를 도로 저장했다. 이름이 살아남아서 오프닝이
   안 뜬 적도 있다. 지우는 순간을 다음 판의 맨 앞으로 옮긴다.
   여기는 리액트가 뜨기도 전이라 도로 저장할 화면이 없다.

   ── clear()는 안 쓴다 ──
   여기는 이 게임만의 저장소가 아니다. 같은 출처에 다른 것이 들어 있으면
   그것까지 같이 날아간다. 열쇠(null_apikey)도 이야기가 아니라 접속 설정이라
   리스타트로 지울 것이 아니었다 — 새로 시작할 때마다 열쇠를 다시 넣어야 했다.
   그래서 이 게임이 쓴 이야기 key만 골라 지운다. 목록을 손으로 적지 않는
   이유는 늘 빠뜨리기 때문이다: null_로 시작하는 것 중 남길 것만 적는다.

   ── 판 갈이 ──
   옛 세이브에는 옛 정사(첫 만남 자리·D-day)가 섞여 있다. 그걸 새 정사로
   옮기는 변환은 안 만든다 — 어차피 맞출 수 없고, 반쯤 맞은 세계가 제일 나쁘다.
   판 번호가 다르면 이야기만 한 번 비운다. 딱 한 번이다: 비운 뒤 번호를
   찍으므로 다음 실행부터는 새로 쌓인 것이 그대로 남는다. */
window.NULL_STORY_REV = "4";
/* ── 개발 전용 시간 이동 ──
   한 판에 서른 날을 봐야 할 때 「지금」에만 오프셋을 더하는 단추 셋(+1d·D-7·
   D-0)이 D-칸 옆에 뜬다. 공개 스피드 모드의 비율은 안 건드린다 — 그건 세계의
   속도지 시험 도구가 아니다. 배포 전에 반드시 false로 되돌린다.
   localStorage로 켜지 않는 이유: 콘솔 한 줄로 켤 수 있으면 테스터의 판이
   조용히 달라진다. 켜는 자리는 이 한 줄이어야 한다. */
window.NULL_DEV = false;
function nullWipeStory(){
  var KEEP = ["null_apikey"];   // 이야기가 아닌 것 — 접속 설정은 남긴다
  var kill = [], i, k;
  for(i=0;i<localStorage.length;i++){
    k = localStorage.key(i);
    if(k && k.indexOf("null_")===0 && KEEP.indexOf(k)<0) kill.push(k);
  }
  for(i=0;i<kill.length;i++) localStorage.removeItem(kill[i]);
};
try{
  /* null_wipe도 null_로 시작하니 같이 지워진다 — 따로 치울 것이 없다 */
  /* 판 번호가 바뀌었다는 이유만으로 저장된 이야기를 자동 삭제하지 않는다.
     실제 restart에서 null_wipe를 명시했을 때만 지운다. */
  if(localStorage.getItem("null_wipe")) nullWipeStory();
  localStorage.setItem("null_rev", window.NULL_STORY_REV);
}catch(e){}
</script>
<!-- 갈라진 파일에는 전부 판 번호를 붙인다. 안 붙이면 브라우저가 옛 파일을
     계속 쓴다 — peek 넘치는 걸 고쳐 올렸는데 CSS만 캐시라 그대로 넘쳤다.
     고치고 올릴 때 네 개를 같이 올린다. 하나만 올리면 그 하나만 새것이 된다.
     ★ 이 넷 중 하나라도 고쳤으면 번호를 올린다. 안 올리면 배포는 됐는데
       사람은 안 고쳐졌다고 한다 — 두 번 겪었다. -->
<link rel="stylesheet" href="null.css?v=173">
</head>
<body>
<div id="root"></div>
<!-- 데이터·규칙. JSX가 없어서 바벨을 안 탄다 -->
<script src="app-data.js?v=173"></script>
<!-- 화면 조각 — 아이콘·창·방 목록. JSX라 바벨을 탄다 -->
<script type="text/babel" src="app-ui.js?v=173"></script>
<!-- 앱 — 상태를 들고 있는 곳 -->
<script type="text/babel" src="app.js?v=173"></script>

</body>
</html>
