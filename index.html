<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content: 안드로이드 크롬은 키보드가 올라와도 레이아웃
     높이를 안 줄이는 게 기본(resizes-visual)이다. 그러면 100dvh가 전체 화면 높이로
     남아서, 브라우저가 입력칸만 보이게 스크롤하고 그 아래로 폰 껍데기가 남는다.
     이 값을 주면 키보드만큼 높이가 줄어 입력칸이 키보드 바로 위에 붙는다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>NULL</title>
<!-- 아이콘 파일이 없으면 브라우저가 알아서 /favicon.ico를 찾다가 404를 낸다.
     파일을 새로 올리는 대신 여기에 그려 넣는다 — 요청이 아예 안 나간다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c3b2f0'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='monospace'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<!-- 데모 대사·매칭. 문구집에서 만들어진 파일이라 직접 고치지 않는다 -->
<script src="demo-lines.js?v=3"></script>
<style>
/* ── Y2K 파스텔 OS 팔레트 ──
   잉크 #4a4276 · 보더 #5d5490/#8a7fc0/#b0a6d8 · 크롬 #dcd6f2 · 핑크 #ff9ec6 · 라벤더 #c3b2f0 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* 바탕은 body에만 깐다. 전에는 html·body에 같이 깔아놓고 바로 다음 줄에서
   body의 background를 그라데이션으로 다시 써서, 그림이 늘 덮여 있었다.
   파일을 넣어도 화면에는 단색만 보였고 오류도 안 났다. */
body{font-family:"Galmuri11","DungGeunMo",sans-serif;color:#4a4276;
 background:#c3b2f0 url("bg-desk.webp") center/cover fixed no-repeat;
 -webkit-font-smoothing:none}
/* 배경 위에 얇은 막을 한 겹. 그림의 별빛이 창 양옆에서 너무 튀어서
   옅게 눌러두고 살짝 흐린다. z-index:-1이라 body 배경 바로 위,
   창 뒤 빛(#root::before, z-index:0)보다는 아래에 깔린다 —
   그래서 별만 가라앉고 창 뒤 빛은 그대로 남는다.
   blur는 별의 뾰족한 끝을 뭉개는 쪽이라 흰 막만 더 올리는 것보다
   덜 뿌옇게 같은 효과를 낸다. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:rgba(243,238,255,.62);backdrop-filter:blur(3px)}
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
/* 창 뒤에만 빛을 하나 둔다.
   창이 배경보다 밝으면 바닥에 올려둔 흰 종이로 보이고, 창 뒤가 밝으면
   빛 속에 놓인 유리로 보인다. 지금은 관계가 반대였다.
   구석은 안 건드린다 — 화면 전체를 밝히면 그냥 배경이 흐려진 것이 된다.
   .phone이 z-index:1이라 이 층 위에 그대로 올라온다. */
#root::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(ellipse 680px 900px at 50% 50%,
   rgba(255,255,255,.88) 0%,rgba(255,246,254,.62) 34%,
   rgba(255,238,252,.3) 58%,transparent 80%)}
/* 메인 창(폰) */
/* 폭에도 상한이 있어야 한다. 390px로 못박아두면 그보다 좁은 폰(375·360)에서
   창이 화면보다 넓어져 오른쪽이 잘린다. 높이만 막아두고 폭을 안 막았었다. */
.phone{position:relative;z-index:1;width:390px;max-width:100vw;height:844px;max-height:min(94vh,844px);overflow:hidden;
 background:#dcd6f2;border:2px solid #8f7ccb;border-radius:14px;
 box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #c3b2f0,6px 6px 0 rgba(93,84,144,.3),0 30px 60px rgba(93,84,144,.35)}
@media(max-width:500px){
 #root{align-items:stretch}
 .phone{width:100%;height:100dvh;max-height:none;border-radius:0;border:none;box-shadow:none}
}
.screen{position:absolute;inset:4px;display:flex;flex-direction:column;overflow:hidden;border-radius:9px;
 background:#ece8fa;animation:fade .25s steps(4)}
@media(max-width:500px){.screen{inset:0;border-radius:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blinkc{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes recblink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes spk{0%,100%{transform:scale(.35) rotate(0deg);opacity:.15}50%{transform:scale(1) rotate(90deg);opacity:.95}}
/* 창들을 세로 흐름에 얹는다. 흩어진 데스크톱처럼 보이는 건 좌우 정렬과
   살짝 겹치는 음수 여백으로 낸다 — 좌표로 흩어놓으면 화면 높이가 바뀔 때마다
   겹치거나 잘린다. */
.spstack{position:absolute;left:0;right:0;top:0;bottom:0;z-index:12;
 display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 26px 52px}
/* 세로가 모자라면 flex가 창들을 눌러버리고, overflow:hidden이라 안쪽 버튼이
   잘려나간다. 창은 절대 줄이지 않는다 — 모자라면 차라리 위아래가 잘리는 게 낫다. */
.spstack>*{flex:none}
.spstack .w1{align-self:flex-start;width:182px;margin-top:14px}
.spstack .w2{align-self:flex-end;width:194px;margin-top:-6px}
.spstack .w3{align-self:stretch;margin-top:8px}
.spcurwrap{position:relative}
/* 키라키라 반짝이 */
.spark{position:absolute;pointer-events:none;z-index:6;
 clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
 animation:spk 2.6s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(255,255,255,.9))}
/* ── 창 타이틀바 — Y2K 카드드 톤: 둥근 캐프슐 필드 + 3D 구슬 버튼 ── */
.tb{position:relative;flex:none;display:flex;align-items:center;gap:8px;padding:9px 11px;
 background:linear-gradient(100deg,#f3b9d8 0%,#d5b3ef 34%,#b79ceb 62%,#a992e6 100%);
 color:#fff;border-bottom:1.5px solid #7f6cbb;
 font-size:12px;letter-spacing:.12em;text-shadow:0 1px 0 rgba(80,66,140,.6);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.35)}
.tb::after{content:"";position:absolute;left:9px;right:9px;top:3px;height:34%;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.dots{position:relative;margin-left:auto;display:flex;gap:5px}
.dots>span{position:relative;overflow:hidden;width:15px;height:15px;border-radius:50%;
 border:1px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
 font-size:8px;line-height:1;color:#fff;text-shadow:none}
.dots>span::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;border-radius:999px 999px 0 0;
 background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0))}
.dots .d1{background:#e7e0fb;color:#8a7fc0}
.dots .d2{background:#c9bcf3}
.dots .d3{background:#ffb3d2}
/* 메뉴바 / 베벨 버튼 / 선큰 패널 */
/* 한 줄에 일곱 개가 앉는다. 폭이 390이라 여유가 없어서, 예전엔 맨 끝 peek이
   창 테두리에 잘렸다. 여백을 좁히고 줄이 절대 넘치지 않게 고정한다. */
.menubar{flex:none;display:flex;align-items:center;gap:3px;padding:6px 6px;font-size:11px;color:#6b5fa8;
 background:linear-gradient(180deg,#f6f2ff,#e9e1fb);border-bottom:1.5px solid #c5bce8;position:relative;z-index:20;
 max-width:100%;flex-wrap:nowrap}
/* 메뉴 항목 — 레퍼런스의 home/platforms/metrics 처럼 광택 알약 */
.mbtn{position:relative;padding:5px 7px 6px;cursor:pointer;white-space:nowrap;
 font-size:10.5px;letter-spacing:.03em;color:#6b5fa8;background:none;border:0;border-radius:5px}
.mbtn:hover{color:#4a4276;background:rgba(255,255,255,.6)}
.mbtn::after{display:none}
.mbtn:active{transform:translateY(1px)}
.mbtn.ico{position:relative;display:flex;align-items:center;gap:4px;
 background:none;border:0;box-shadow:none;color:#7a6cae;padding:5px 4px}
.mbtn.ico::after{display:none}
.mbtn.ico:hover{color:#5b4ba3}
/* flex 안에서 svg는 자리가 모자라면 폭 0까지 쭈그러든다. 글자는 최소 폭이
   있어서 버티는데 그림은 안 버틴다. 그래서 메뉴바가 빡빡해진 어느 날
   peek의 달만 소리 없이 사라졌다 — 아이콘은 안 줄어야 한다. */
.menubar svg{flex:none}
/* 관찰 버튼은 이 줄에서 제일 눌릴 것이다. 얘부터 줄이면 안 된다 */
.moonbtn{flex:none}

.mbtn.open{color:#4a4276;background:#fff;box-shadow:0 0 0 1px #cfc6ee}
.bevel{font-family:inherit;color:#4a4276;background:#ece8fa;border:1px solid #5d5490;cursor:pointer;
 box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 #cdc3ec,2px 2px 0 rgba(93,84,144,.22)}
.bevel:active{box-shadow:inset 1px 1px 0 #cdc3ec;transform:translate(1px,1px)}
.bevel:disabled{opacity:.45;cursor:default}
.sunken{background:#fff;border:1px solid #8a7fc0;box-shadow:inset 1px 1px 0 rgba(93,84,144,.28),inset 2px 2px 4px rgba(93,84,144,.12)}
/* 드롭다운 */
.ddwrap{position:relative}
.dd{position:absolute;left:0;top:calc(100% + 5px);min-width:158px;z-index:30;padding:5px;
 border:1.5px solid #8f7ccb;border-radius:10px;
 background:linear-gradient(180deg,#f8f5ff,#e9e1fb);
 box-shadow:inset 0 0 0 1.5px #fff,0 4px 10px rgba(93,84,144,.28);animation:fadeUp .15s steps(3) both}
.dditem{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;margin:3px 0;
 padding:9px 12px;font-size:10.5px;letter-spacing:.03em;cursor:pointer;white-space:nowrap;
 color:#fff;text-shadow:none;border:1px solid #8f7ccb;border-radius:999px;background:#a78fe0}
.dditem::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;border-radius:999px 999px 0 0;
 background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0));pointer-events:none}
.dditem:hover{filter:brightness(1.05)}
.dditem:active{transform:translateY(1px)}
.dditem svg{flex:none}
/* 다이얼로그(레트로 윈도우) */
.dlgov{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
 background:rgba(74,66,118,.4);padding:26px;animation:fade .15s steps(3) both}
.dlg{width:100%;max-width:290px;overflow:hidden;border-radius:16px;border:2px solid #fff;
 background:linear-gradient(180deg,#ffffff 0%,#f2ecfe 46%,#eae1fb 100%);
 box-shadow:0 3px 0 rgba(150,135,210,.35),0 0 0 1px #e4dbf8,0 10px 24px rgba(93,84,144,.28);
 animation:fadeUp .2s steps(4) both}
.dlg .tb{letter-spacing:.14em}
.dlg.etcwin .tb{background:linear-gradient(90deg,#a78fe0,#c9b6f5)}
.dlgbody{background:none;padding:18px 16px 16px;display:flex;flex-direction:column;gap:8px}
.dlgline{font-size:12px;line-height:1.9;color:#6b5fa8}
.dlgbtns{display:flex;gap:7px;margin-top:10px}
/* 다이얼로그 버튼 — 네모 베벨 대신 광택 알약으로 통일 */
.dlgbtns .bevel{position:relative;overflow:hidden;flex:1;padding:11px 6px;font-size:11px;letter-spacing:.1em;
 color:#fff;text-shadow:0 1px 0 rgba(120,100,180,.5);border:1.5px solid #fff;border-radius:999px;
 background:linear-gradient(180deg,#cfc0f5,#ae98ea);box-shadow:0 2px 0 rgba(150,135,210,.3)}
.dlgbtns .bevel::after{display:none}
.dlgbtns .bevel:active{transform:translateY(2px);box-shadow:0 0 0 rgba(150,135,210,.3)}
.dlgbtns .pink{color:#fff;text-shadow:0 1px 0 rgba(170,80,140,.5);border-color:#fff;
 background:linear-gradient(180deg,#ffc2e2,#f78fc6);box-shadow:0 2px 0 rgba(180,110,160,.3)}
/* etc. 팝업 — 미니홈피 게스트북 톤 */
.etc{position:relative;align-items:center;gap:0;padding:0 0 16px;overflow:hidden;
 background:linear-gradient(180deg,#fbf8ff 0%,#f2ecfe 60%,#e9e1fb 100%)}
.etc .rain{height:3px;align-self:stretch;
 background:linear-gradient(90deg,#c3b2f0,#d9c8ff,#bfe6f5,#e2d4ff,#a78fe0,#c3b2f0)}
.etcglit{position:absolute;inset:0;pointer-events:none;opacity:.5;
 background:radial-gradient(2px 2px at 14% 22%,#fff,transparent),radial-gradient(2px 2px at 78% 16%,#ffd0e6,transparent),
  radial-gradient(2px 2px at 30% 78%,#d5c8ff,transparent),radial-gradient(2px 2px at 88% 66%,#fff,transparent),
  radial-gradient(2px 2px at 55% 40%,#ffe9a8,transparent)}
.etccd{position:relative;width:62px;height:62px;margin:18px 0 12px;border-radius:50%;flex:none;
 background:conic-gradient(#ffd6ec,#d9c6ff,#bfe6f5,#d8f5e3,#ffeec2,#ffd6ec);
 border:1px solid #c9bce9;box-shadow:0 0 14px rgba(180,160,240,.55);animation:spin 5.5s linear infinite}
.etccd::after{content:"";position:absolute;left:50%;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;
 border-radius:50%;background:#f6f2ff;border:1px solid #d9cdf0}
.etchi{position:relative;font-size:14px;color:#6b5cae;letter-spacing:.06em;text-align:center;
 text-shadow:0 0 8px rgba(180,160,240,.7)}
.etcsub{position:relative;margin-top:8px;font-size:10px;letter-spacing:.22em;color:#a99cd4;text-align:center}
.etcdiv{position:relative;margin:14px 0 12px;font-size:9px;letter-spacing:.5em;color:#c3b2f0}
.etcrow{position:relative;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 16px}
/* restart — 위험한 버튼인데 못생기면 더 무섭다. 게스트북 톤의 분홍 알약 하나.
   bevel을 쓰지 않는다(각진 회색 테가 이 창에서 혼자 튄다). */
.etcdel{position:relative;display:inline-flex;align-items:center;gap:7px;overflow:hidden;
 padding:10px 22px 11px;font-family:inherit;font-size:11px;letter-spacing:.16em;
 color:#fff;text-shadow:0 1px 0 rgba(190,90,130,.55);cursor:pointer;
 border:1.5px solid #ff8fbe;border-radius:999px;
 background:linear-gradient(180deg,#ffc4dd 0%,#ff9ec6 48%,#ff7fae 52%,#ff96bf 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 3px 0 #f08bb2,0 6px 10px rgba(190,120,155,.22)}
/* 유리 광택 — 버튼 위에 흰 빛 한 줄. Y2K 버튼은 이게 있어야 단추로 보인다 */
.etcdel::before{content:"";position:absolute;left:6%;right:6%;top:3px;height:38%;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.etcdel:hover{filter:brightness(1.04)}
.etcdel:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(176,86,127,.4)}
.etcdel .rr{font-size:12px;line-height:1;color:#fff}
/* 지우기 확인. 되돌릴 수 없다는 말은 추상이고 숫자는 구체다 */
.etcwarn{position:relative;margin:16px 14px 0;padding:14px 12px 12px;text-align:center;
 border:1px solid #c3b2f0;background:linear-gradient(180deg,#fdfbff,#f4effe);border-radius:8px;
 box-shadow:0 3px 0 #e2d9f7}
.etcwarn .w{font-size:13px;color:#6b5cae;letter-spacing:.04em}
.etcwarn .n{margin-top:8px;font-size:10px;color:#a596cf;letter-spacing:.06em}
.etcwarn .n2{margin-top:5px;font-size:8.5px;color:#c4b8de;letter-spacing:.08em}
.etcwarn .dlgbtns{display:flex;gap:8px;margin-top:13px;justify-content:center}
.wbtn{position:relative;flex:1;max-width:112px;overflow:hidden;padding:11px 0;font-family:inherit;font-size:11px;
 letter-spacing:.1em;cursor:pointer;border-radius:999px;border:1.5px solid #c3b2f0;color:#6b5fa8;
 background:linear-gradient(180deg,#ffffff 0%,#efe9fc 48%,#e2d9f7 52%,#f0eafd 100%);
 box-shadow:inset 0 1px 0 #fff,0 3px 0 #d8cdf2}
.wbtn::before{content:"";position:absolute;left:7%;right:7%;top:3px;height:36%;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.wbtn.kill{border-color:#ff8fbe;color:#fff;text-shadow:0 1px 0 rgba(190,90,130,.55);
 background:linear-gradient(180deg,#ffc4dd 0%,#ff9ec6 48%,#ff7fae 52%,#ff96bf 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 0 #f08bb2}
.wbtn:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(120,100,170,.3)}
.etctag{position:relative;overflow:hidden;padding:5px 13px;font-size:9.5px;letter-spacing:.14em;color:#7a6cae;
 background:linear-gradient(180deg,#ffffff 0%,#f4eefe 48%,#e8dffb 52%,#f6f1ff 100%);white-space:nowrap;
 border:1.5px solid #c3b2f0;border-radius:999px;box-shadow:inset 0 1px 0 #fff,0 2px 0 #ded3f5}
.etctag::before{content:"";position:absolute;left:8%;right:8%;top:2px;height:36%;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.etcnote{position:relative;margin-top:14px;padding:0 16px;font-size:9.5px;line-height:2;letter-spacing:.02em;
 color:#b0a6d8;text-align:center}
.etcstk{position:relative;display:flex;gap:11px;margin-top:14px;font-size:12px}
/* ── 장바구니 ── 작은 다이얼로그가 아니라 창 하나를 통째로 쓴다 */
.cartscreen{position:absolute;inset:0;z-index:39;display:flex;flex-direction:column;
 background:linear-gradient(180deg,#cabdf2,#b9abe9);animation:fadeUp .22s steps(4) both}
.cartwin{position:absolute;left:14px;right:14px;top:22px;bottom:22px;display:flex;flex-direction:column;
 background:linear-gradient(180deg,#ffffff 0%,#f6f1ff 46%,#efe7fc 100%);
 border:2px solid #fff;border-radius:16px;overflow:hidden;

/* ── 오프닝 ──
   Y2K 데스크톱. 도는 CD, 올라오는 방울, 흩어진 가짜 오류창.
   오류창이 이 이야기를 대신 말한다 — "당신을 찾을 수 없습니다".
   그래서 이름 칸이 여기 있다. 이름을 넣는 것이 곧 그 오류를 지우는 일이다.
   로고곡은 여기서 돌고, 들어갈 때 페이드아웃된다. */
/* BGM: 방울 — 아래에서 올라오며 살짝 흔들림 */
@keyframes rise{0%{transform:translateY(0);opacity:0}6%{opacity:1}84%{opacity:.95}100%{transform:translateY(-940px);opacity:0}}
@keyframes sway{0%{margin-left:-15px}100%{margin-left:15px}}
.bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bub{position:absolute;bottom:-70px;border-radius:50%;
 background:radial-gradient(circle at 30% 26%,#fff 0 9%,rgba(255,255,255,.55) 20%,rgba(255,255,255,0) 46%),
   radial-gradient(circle at 72% 74%,rgba(255,170,215,.7),rgba(160,205,255,.5) 55%,rgba(255,255,255,.05) 78%);
 border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(255,255,255,.45),inset 0 0 8px rgba(255,255,255,.5);
 animation:rise linear infinite,sway ease-in-out infinite alternate}
/* 오픈닝 화면 — 미니홈피 부텀 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes fill{0%{width:14%}100%{width:92%}}
@keyframes flow{0%{background-position:0 0}100%{background-position:28px 0}}
@keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
.splash{display:block;cursor:pointer;background:linear-gradient(180deg,#dcd3f7 0%,#c3b2f0 50%,#f0c2de 100%)}

.spcd{align-self:flex-end;margin-right:-4px;width:76px;height:76px;border-radius:50%;z-index:5;flex:none;

 box-shadow:0 0 0 1px rgba(255,255,255,.9),0 6px 20px rgba(60,40,100,.32)}
.spcd::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px dashed rgba(255,255,255,.55)}
.spcd::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.9);
 box-shadow:inset 0 0 0 3px rgba(195,178,240,.5)}

 border-radius:9px;overflow:hidden;box-shadow:5px 6px 0 rgba(60,45,100,.28);animation:pop .4s steps(3) both}
.sptb{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:9.5px;color:#fff;letter-spacing:.06em;
 border-bottom:1px solid #5d5490;text-shadow:1px 1px 0 rgba(93,84,144,.5)}
.spcard .sptb{background:linear-gradient(90deg,#ff8fbe,#c3b2f0)}

/* 버튼은 제 줄에서 오른쪽 아래. inline-block으로 두면 문장 뒤에 그대로 붙어
   "당신을 찾을 수 없습니다. [Cancel]" 처럼 한 줄이 된다 — 대화상자가 아니라 문장이 된다. */
.spbtn{display:block;width:fit-content;margin:11px 0 0 auto;padding:4px 14px;font-size:9px;color:#4a4276;
 background:#ece8fa;border:1px solid #5d5490;box-shadow:inset 1px 1px 0 #fff,inset -2px -2px 0 #cdc3ec}
/* 커서 — CSS 보더로 만든 삼각형은 한쪽만 채워져서 작대기로 보였다. SVG로 그린다 */
.spcursor{position:absolute;z-index:30;width:15px;height:21px;left:-6px;bottom:-15px;
 filter:drop-shadow(1px 2px 0 rgba(74,66,118,.45));transform:rotate(-8deg)}
.sptap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10.5px;letter-spacing:.34em;color:#4a4276;
 z-index:19;animation:blinkc 1.6s steps(2) infinite}
/* ── 등록 화면 ──
   이름을 넣고 나서 메신저로 들어가기 전에 지나간다. 저절로 안 넘어간다.

   읽기만 하는 화면이 아니라 유저가 채우는 화면이다. 여기서 채운 빈칸은
   그대로 서버로 가서 인물이 알게 되는 값이다(user_profile). 그러니 이 앱을
   여는 첫 동작이 "나를 적는 것"이어야 맞다. 나중에 you 메뉴로 다시 고칠 수 있다.

   막대는 채운 칸 수를 그대로 보여준다. 다 안 채워도 들어갈 수 있다 —
   비워두는 것도 이 이야기에서는 답이다. DAYS LEFT는 끝까지 null이다. */
/* 등록 화면. 전에는 이 화면만 진보라였다 — 바로 앞 오프닝도
   파스텔이고 바로 뒤 방 목록도 파스텔이라, 1.5초짜리 어두운 화면 하나가
   다른 앱처럼 끼어 있었다. 어둠이 뜻을 지고 있던 것도 아니다:
   「아직 안 들어왔다」는 오프닝의 "당신을 찾을 수 없습니다"가 이미 말하고,
   null.exe도 d-0.exe도 밝은 창이다. 그래서 같은 가족으로 옮긴다. */
.enr{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
 padding:26px;background:linear-gradient(180deg,#dcd3f7 0%,#c9bff1 52%,#e6d3ef 100%)}
.enr.out{animation:enrOut .42s steps(5) both}
@keyframes enrOut{
 0%{transform:scaleY(1);opacity:1}
 72%{transform:scaleY(.06);opacity:1}
 100%{transform:scaleY(.02);opacity:0}}
.enr .ecard{width:100%;max-width:286px;overflow:hidden;border-radius:14px;border:2px solid #fff;
 background:linear-gradient(180deg,#ffffff 0%,#f2ecfe 46%,#eae1fb 100%);
 box-shadow:0 3px 0 rgba(150,135,210,.35),0 0 0 1px #e4dbf8,0 10px 24px rgba(93,84,144,.28);
 animation:fadeUp .4s steps(4) both}
.enr .etb{display:flex;align-items:center;color:#fff;font-size:9.5px;letter-spacing:.18em;padding:6px 10px;
 background:linear-gradient(100deg,#f3b9d8 0%,#d5b3ef 34%,#b79ceb 62%,#a992e6 100%);
 border-bottom:1.5px solid #7f6cbb;text-shadow:0 1px 0 rgba(80,66,140,.6)}
.enr .ebody{padding:16px 16px 15px}
/* 이름도 고칠 수 있다. 등록 화면인데 정작 이름만 못 고치면 그건 등록이 아니다 —
   여기서 놓치면 방 목록의 edit 메뉴까지 가야 한다. */
/* 「edit」 딱지는 뗐다. 눌러서 고치는 자리라는 건 커서가 이미 말한다 */
.enr .ename{display:flex;align-items:center;gap:6px;font-size:15px;color:#4a4276;letter-spacing:.06em;
 padding-bottom:11px;border-bottom:1px dotted #d9cbf3;cursor:text}
.enr .namein{flex:1;min-width:0;padding:3px 7px;font-family:inherit;font-size:15px;color:#4a4276;
 background:#fff;border:1px solid #c3b2f0;border-radius:5px;outline:none}
.enr .eline{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:9px 0;font-size:12px;
 color:#6b5cae;border-bottom:1px dotted #d9cbf3;opacity:0;animation:enrRow .35s steps(3) both}
.enr .eline:nth-of-type(1){animation-delay:.30s}
.enr .eline:nth-of-type(2){animation-delay:.55s}
.enr .eline:nth-of-type(3){animation-delay:.80s}
.enr .eline:nth-of-type(4){animation-delay:1.05s}
.enr .eline:nth-of-type(5){animation-delay:1.30s}

@keyframes enrRow{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
/* 방 목록: 크롬 스타 월페이퍼 위 메신저 창 */

/* 탭 — 낝작한 사각형 대신 광택 있는 둥근 탭. 윈도우 밖으로 튀어나오는 느낌 */
.tabs{flex:none;display:flex;gap:5px;padding:9px 12px 0}

 background:linear-gradient(180deg,#faf8ff,#ece7fa)}

 background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}

.roomswrap{position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;margin:0 12px;
 border:1.5px solid rgba(255,255,255,.85);border-radius:8px;

 backdrop-filter:blur(22px) saturate(1.15);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(150,135,210,.22);overflow:hidden}
/* 창 위쪽 무지개 1px — 목록이 좀 더 놓았다 */
.roomswrap::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;z-index:2;
 background:linear-gradient(90deg,#c3b2f0,#a8c8ff,#c3b2f0)}
.rooms{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:10px}
/* 섹션 헤더 — 한쪽 끝이 잘린 기울언 띄 (Y2K 카드드 헤더) */
/* 섹션 라벨 — 레퍼런스의 보라 깃발 바. 오른쪽 끝이 사선으로 잘린다 */
/* 목록 바닥의 물방울 — 조용히 떠올랐다 사라진다 */
.bub{position:absolute;bottom:-16px;border-radius:50%;pointer-events:none;z-index:0;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.25) 42%,rgba(196,180,240,.28) 70%,rgba(255,255,255,.12));
 border:1px solid rgba(255,255,255,.75);box-shadow:inset -2px -3px 6px rgba(150,135,210,.18);
 animation:bubup linear infinite}
@keyframes bubup{
  0%{transform:translateY(0) scale(.9);opacity:0}
  14%{opacity:.85}
  78%{opacity:.45}
  100%{transform:translateY(-280px) scale(1.05);opacity:0}}
.sect{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 5px;border-radius:999px;
 font-size:9px;letter-spacing:.24em;color:#fff;text-shadow:0 1px 0 rgba(110,120,180,.5);
 border:1.5px solid #fff;background:linear-gradient(180deg,#cfc0f5,#ae98ea);
 box-shadow:0 2px 0 rgba(150,135,210,.28)}
.roomcard{position:relative;display:flex;align-items:center;gap:11px;padding:11px 9px;cursor:pointer;
 border-bottom:none;border-radius:7px;animation:fadeUp .3s steps(4) both;transition:transform .08s steps(2)}
/* 카드 사이 구분선 — 점선 대신 하트 점이 떨어진다 */
.roomcard::after{content:"♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡ · ♡";
 position:absolute;left:6px;right:6px;bottom:-2px;overflow:hidden;white-space:nowrap;
 font-size:7px;letter-spacing:.32em;color:#e7dcf5;pointer-events:none}
.roomcard:last-of-type::after{display:none}
.roomcard:hover{background:#f8f2ff}
.roomcard:active{background:#efe6fc;transform:translate(1px,1px)}
.roomcard.watch{position:relative;overflow:hidden;margin:8px 0 4px;padding:11px 12px;border-radius:16px;border-bottom:0;
 background:linear-gradient(135deg,#ffd9ec 0%,#e6d2fb 42%,#cfd8fb 100%);
 border:2px solid #fff;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 0 rgba(150,135,210,.35),0 0 0 1px #dfd2f5}
.roomcard.watch::before{content:"";position:absolute;left:0;right:0;top:0;height:22%;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.45),transparent)}
.roomcard.watch:hover{background:linear-gradient(180deg,#fff 0%,#ece4fd 46%,#e2d7f9 100%)}
.roomcard.watch .rname{color:#4a4276}
.roomcard.watch .rprev{color:#8d7fc0;letter-spacing:.04em}
.roomcard.watch .avatar{border:1.5px solid #fff;background:linear-gradient(180deg,#fff,#e7dcfb);
 box-shadow:0 0 0 1px #d9cdf5,0 2px 0 rgba(150,135,210,.25)}
/* 라이브 표시 — 카드 오른쪽 위에 작게 깜빡이는 점 */
.roomcard.watch::after{content:"";display:block;position:absolute;right:11px;top:11px;
 width:7px;height:7px;border-radius:50%;background:#ff7fae;border:1.5px solid #fff;
 box-shadow:0 0 6px rgba(255,127,174,.8);animation:recblink 1.4s infinite}
.roomcard.watch::after{display:none}
/* 관전방 — 색으로 튀지 않는다. 채도를 빼서 다른 방처럼 보이게만 한다 */
.roomcard.watch::before{display:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.roomcard.watch:hover{background:linear-gradient(180deg,#ffffff,#f4f6ff)}
.avatar{position:relative;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
 border:1px solid #8a7fc0;border-radius:50%;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(93,84,144,.14),1px 2px 0 rgba(93,84,144,.28)}
/* 사진 아바타는 안쪽 베벨을 빼서 얼굴을 가리지 않게 한다.
   아이콘 아바타(단톡방·두 사람)는 그대로 입체감을 유지한다. */
.avatar.face{box-shadow:1px 2px 0 rgba(93,84,144,.28)}
.mavatar.face{box-shadow:1px 1px 0 rgba(93,84,144,.25)}
.rinfo{flex:1;min-width:0}
.rtop{display:flex;align-items:baseline;gap:7px}
.rname{font-size:13.5px}
/* ── 프로필이 바뀌면 목록이 알려준다 ──
   말풍선으로 알리지 않는다 — 그건 그 사람이 나한테 한 말이 아니니까.
   아바타 테두리가 홀로그램으로 한 바퀴 돈다. 그게 전부다.
   프로필을 한 번 열어보면 꺼진다. */
.avatar.nu::after{content:"";position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
 background:conic-gradient(from 0deg,#ffb0d4,#c3b2f0,#9ae6f0,#ffe9a8,#ffb0d4);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
 mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
 animation:nuspin 3.6s linear infinite}
@keyframes nuspin{to{transform:rotate(360deg)}}
.rtag{font-size:9px;padding:2px 6px;border:1px solid currentColor;border-radius:8px;letter-spacing:.05em;white-space:nowrap;flex:none}

.rbadge{position:relative;flex:none;min-width:20px;height:20px;padding:0 6px;font-size:10px;color:#fff;border-radius:10px;

 background:rgba(255,255,255,.6)}

.dbar i.gone{background:#f3effc}
.dbar i.now{background:#ff7fae}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 12px 10px;display:flex;flex-direction:column;gap:3px;
 background:#fdfcff;border-top:1px solid #fff;box-shadow:inset 1px 2px 4px rgba(93,84,144,.14)}
/* 스크롤 끝의 여백을 컨테이너 padding-bottom에 기대지 않는다.
   일부 모바일 브라우저는 스크롤 영역의 아래쪽 padding을 scrollHeight에 안 넣어서
   끝까지 내려도 마지막 줄이 잘린다(.hidden 탭 안내문이 반쯤 잘리던 원인).
   진짜 자식으로 만들어두면 어느 브라우저에서나 끝까지 닿는다. */
.gal::after,.rooms::after,.msgs::after{content:"";display:block;flex:none;height:20px}
/* 관전방: 미디어 플레이어 흰 스크린 */
.watchbg .msgs{background:#fdfffe}
.divider{align-self:center;margin:12px 0 8px;font-size:9.5px;color:#c39ede;letter-spacing:.1em}
/* ── 같이 간 자리 ──
   사진을 깔고 말풍선을 걷는다. 그라데이션은 안 깐다 — 장소 사진들이 아래쪽
   밝기 17~32라 흰 글씨가 그냥 읽힌다. 그림자는 나중에 밝은 사진이 들어와도
   안 깨지라고 걸어두는 보험이다. */
.scenewrap{display:flex;flex-direction:column;background-size:cover;background-position:center;background-color:#14121c}
.scenewrap .scenebody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 12px}
.scenewrap .scenelines{display:flex;flex-direction:column;gap:9px}
.scenewrap .sline{max-width:88%}
.scenewrap .sline.me{align-self:flex-end;text-align:right}
.scenewrap .sname{font-size:9px;letter-spacing:.14em;color:rgba(255,255,255,.62);margin-bottom:3px;
 text-shadow:0 1px 3px rgba(0,0,0,.55)}
.scenewrap .stext{font-size:14px;line-height:1.55;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.scenewrap .stext.dim{color:rgba(255,255,255,.5)}
.scenewrap .sphoto{display:block;max-width:172px;border-radius:6px;margin-bottom:5px;
 box-shadow:0 2px 10px rgba(0,0,0,.45)}
.scenewrap .scenebar{background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border-top:1px solid rgba(255,255,255,.5)}

/* 괄호 지문 — 말풍선이 아니라 채팅창에 쳐진 한 줄 */
.narr{align-self:center;max-width:82%;margin:7px 0;padding:0 6px;text-align:center;
 font-size:10px;line-height:1.75;letter-spacing:.03em;color:#9a8fc8}
.mrow{display:flex;align-items:flex-end;gap:8px;animation:fadeUp .28s steps(4) both}
.mrow.me{justify-content:flex-end}
.mrow .sp{width:26px;flex:none}
.mavatar{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
 border:1px solid #8a7fc0;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),1px 1px 0 rgba(93,84,144,.25)}
.mcol{display:flex;flex-direction:column;max-width:76%}
.mname{font-size:9.5px;margin:6px 0 3px 2px;letter-spacing:.04em;color:#9a8fc8}
.bubble{padding:8px 11px;font-size:12.5px;line-height:1.65;word-break:break-word;white-space:pre-wrap;border-radius:8px;
 background:#fff;border:1px solid #8a7fc0;color:#4a4276;box-shadow:2px 2px 0 rgba(138,127,192,.28)}
.mrow:not(.me) .bubble{border-bottom-left-radius:2px}
.mrow.me .bubble{border-bottom-right-radius:2px;box-shadow:-2px 2px 0 rgba(255,143,190,.4)}
/* 사진 말풍선 */
.bubble.photo{padding:4px;white-space:normal}
.bubble.photo img{display:block;width:100%;max-width:172px;border-radius:5px;border:1px solid #cfc6ee;
 background:#efeaf9;cursor:pointer;aspect-ratio:2/3;object-fit:cover}
.bubble.photo img:active{opacity:.82}
.bubble.photo .cap{padding:5px 7px 3px;font-size:12.5px;line-height:1.6;color:#4a4276;white-space:pre-wrap}
.lightbox{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
 background:rgba(43,36,78,.82);animation:fadeUp .18s steps(3) both;cursor:pointer;padding:22px}
.lightbox img{max-width:100%;max-height:100%;border:2px solid #fff;border-radius:4px;
 box-shadow:0 6px 24px rgba(0,0,0,.45)}
.lightcard{max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lightcard:not(.solo) img{min-height:0;max-height:calc(100% - 68px)}
.lightcap{width:min(100%,520px);box-sizing:border-box;margin-top:8px;padding:8px 10px;
 border:1px solid #cfc6ee;background:rgba(255,253,255,.96);color:#4a4276;text-align:left;
 box-shadow:2px 2px 0 rgba(138,127,192,.28);cursor:pointer}
.lightcap .lt{font-size:10px;letter-spacing:.14em;color:#8a7fc0;margin-bottom:4px}
.lightcap .ln{font-size:11.5px;line-height:1.65;word-break:keep-all}
.typing{display:flex;gap:5px;padding:12px 12px}
.typing i{width:5px;height:5px;border-radius:50%;background:#8a7fc0;animation:blink 1s steps(2) infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.retry{align-self:flex-start;margin:8px 0 4px 34px;padding:8px 13px;font-family:inherit;font-size:11px;border-radius:0;
 border:1px solid #d4586b;background:#fff0f3;color:#c23b50;cursor:pointer;
 box-shadow:inset 1px 1px 0 #fff,2px 2px 0 rgba(212,88,107,.3);animation:fadeUp .3s steps(4)}
.retry:active{transform:translate(1px,1px);box-shadow:inset 1px 1px 0 #ffd7de}
.retry .why{display:block;margin-top:5px;font-size:9.5px;line-height:1.5;color:#a04255;
 opacity:.85;word-break:break-all;text-align:left;max-width:250px}
/* 입력바 */
.inputbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 10px calc(11px + env(safe-area-inset-bottom));
 background:#dcd6f2;border-top:1px solid #8a7fc0;box-shadow:inset 0 1px 0 #fff}
.inputbar input{flex:1;padding:10px 12px;font-size:16px;font-family:inherit;color:#4a4276;outline:none;border-radius:0}
.inputbar input::placeholder{color:#b0a6d8}
/* 보내기 — 방 색을 그대로 쓰되 유리 단추로 */
.sendbtn{position:relative;overflow:hidden;width:40px;height:37px;display:flex;align-items:center;justify-content:center;
 flex:none;color:#fff;border-radius:999px;border:1.5px solid rgba(93,84,144,.35);
 text-shadow:0 1px 0 rgba(93,84,144,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 0 rgba(93,84,144,.22)}
.sendbtn::after{content:"";position:absolute;left:7%;right:7%;top:2px;height:36%;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.sendbtn:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(93,84,144,.3)}
.watchbar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
 padding:12px 14px calc(14px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.08em;color:#2f9e5a;
 background:#dcd6f2;border-top:1px solid #8a7fc0;box-shadow:inset 0 1px 0 #fff}
.rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5470;animation:recblink 1.2s infinite}
.empty{margin:auto;text-align:center;color:#b0a6d8;font-size:11.5px;line-height:2;letter-spacing:.04em;padding:0 30px}
.msgs::-webkit-scrollbar,.rooms::-webkit-scrollbar,.gal::-webkit-scrollbar{width:0}
/* ── 캐릭터 프로필 — Y2K 미니홈피 카드 ── */
.avatar.clickable,.mavatar.clickable{cursor:pointer}
.avatar.clickable:active,.mavatar.clickable:active{transform:translateY(1px)}
.pfscreen{position:absolute;inset:0;z-index:38;background:#2b244e center/cover no-repeat;
 animation:fadeUp .22s steps(4) both}
.pfdim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 overflow-y:auto;padding:22px;background:rgba(20,14,44,.42)}
.pfcard{position:relative;width:100%;max-width:320px;overflow:hidden;border-radius:18px;border:2px solid #fff;
 background:linear-gradient(180deg,#ffffff 0%,#f6f1ff 44%,#efe7fc 100%);
 box-shadow:0 3px 0 rgba(150,135,210,.4),0 0 0 1px #e4dbf8,0 12px 28px rgba(20,14,44,.4)}
/* 배경만 크게 — 카드도 어둡기도 없이 사진 그대로 */
.bgfull{position:absolute;inset:0;z-index:44;background:#2b244e center/cover no-repeat;cursor:pointer;
 animation:fadeUp .2s steps(3) both}
.bgclose{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:9px;letter-spacing:.2em;
 color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pftop{display:flex;flex-direction:column;align-items:center;padding:22px 18px 0}
.pfpola{position:relative;background:#fff;padding:8px 8px 6px;border:1.5px solid #fff;border-radius:10px;
 box-shadow:0 0 0 1px #e4dbf8,0 3px 0 rgba(150,135,210,.28)}
.pfpola .tape{position:absolute;width:44px;height:15px;border-radius:3px}
.pfpola .t1{left:-14px;top:-8px;transform:rotate(-18deg);background:rgba(255,158,198,.75)}
.pfpola .t2{right:-14px;bottom:14px;transform:rotate(12deg);background:rgba(175,152,234,.75)}
.pfpola .shot{display:block;width:126px;height:126px;border-radius:7px;background:#efeaf9;background-repeat:no-repeat}
.pfpola .cap{margin-top:6px;font-size:8.5px;letter-spacing:.1em;color:#b3a6cf;text-align:center}
.pfnamerow{display:flex;align-items:center;gap:7px;margin-top:14px}
.pfnamerow .nm{font-size:16px;color:#4a4276;letter-spacing:.06em}
.pfnamerow .deco{font-size:11px}
/* 상태메시지 말풍선 */
.pfbubble{margin-top:12px;display:flex;flex-direction:column;align-items:center}
.pfbubble .b{max-width:250px;padding:10px 15px;background:#fff;border:1.5px solid #fff;border-radius:14px;
 box-shadow:0 0 0 1px #e4dbf8,0 2px 0 rgba(150,135,210,.22);
 font-size:11.5px;line-height:1.7;color:#6b5cae;text-align:center;white-space:pre-wrap}
.pfbubble .tail{width:9px;height:9px;margin-top:-5px;background:#fff;
 border-right:1.5px solid #e4dbf8;border-bottom:1.5px solid #e4dbf8;transform:rotate(45deg)}
/* BGM 바 */
.pfbgm{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;margin:18px 18px 0;
 padding:9px 13px;width:calc(100% - 36px);cursor:pointer;font-family:inherit;border-radius:999px;
 border:1.5px solid #fff;background:linear-gradient(180deg,#ffffff,#efe8fc);
 box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(150,135,210,.24),0 0 0 1px #e4dbf8}
.pfbgm:active{transform:translateY(1px);background:#ece3ff}
.pfbgm .play{flex:none;width:21px;height:21px;border-radius:50%;border:1.5px solid #fff;background:#fff;
 box-shadow:0 0 0 1px #ddd2f4;display:flex;align-items:center;justify-content:center;font-size:9px}
.pfbgm .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
 font-family:inherit;font-size:9.5px;letter-spacing:.1em;color:#7a6cae}
.pfbgm .eq{flex:none;display:flex;align-items:flex-end;gap:2px;height:14px}
.pfbgm .eq i{width:3px;height:3px;border-radius:1px;background:currentColor}
.pfbgm.on .eq i{animation:eq .7s steps(3) infinite}
.pfbgm.on .eq i:nth-child(2){animation-delay:.2s}
.pfbgm.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
.pfbgmoff{margin:18px 18px 0;padding:9px 0;width:calc(100% - 36px);text-align:center;
 background:#f6f3fd;border:1px solid #e0d8f4;border-radius:20px;
 font-size:9.5px;letter-spacing:.1em;color:#c0b5dd}
/* TODAY / TALK */
.pfstats{display:flex;gap:8px;margin:14px 18px 0}
.pfstats .s{flex:1;padding:9px 0;text-align:center;background:#fff;border:1px solid #ecdff2}
.pfstats .l{display:block;font-size:8px;letter-spacing:.25em;color:#c3aacd}
.pfstats .v{display:block;margin-top:4px;font-size:14px}
.pfstickers{display:flex;justify-content:center;gap:12px;margin-top:16px;font-size:12px}
.pfclose{position:relative;display:block;width:calc(100% - 36px);margin:14px 18px 18px;padding:11px 0;
 font-family:inherit;font-size:11px;letter-spacing:.2em;cursor:pointer;border-radius:999px;
 color:#fff;text-shadow:0 1px 0 rgba(120,100,180,.5);border:1.5px solid #fff;
 background:linear-gradient(180deg,#cfc0f5,#ae98ea);box-shadow:0 2px 0 rgba(150,135,210,.3)}
.pfclose:active{transform:translateY(2px);box-shadow:none}
/* ── 접속 상태 점 ── */
.pres{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:9px;color:#a79cd0}
.pres i{width:6px;height:6px;border-radius:50%;flex:none}
.pres.on i{background:#4fc98a;box-shadow:0 0 0 2px rgba(79,201,138,.22)}
.pres.away i{background:#f0b34a;box-shadow:0 0 0 2px rgba(240,179,74,.2)}
.pres.off i{background:#c3bcd8}
/* ── 🌙 관찰 버튼 ── */
.moonbtn{position:relative;display:flex;align-items:center;gap:6px;padding:0 12px;height:30px;
 font-family:inherit;font-size:10px;letter-spacing:.06em;color:#4a4276;white-space:nowrap;overflow:hidden;
 border:1.5px solid #b9a7e6;border-radius:999px;
 background:linear-gradient(180deg,#faf6ff 0%,#ece3fc 48%,#ded2f8 52%,#f1ebfe 100%);
 box-shadow:inset 0 1px 0 #fff,0 3px 0 #d8cdf2}
.moonbtn::after{content:"";position:absolute;left:8%;right:8%;top:2px;height:34%;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.moonbtn:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(120,100,170,.28)}
.moonbtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(195,178,240,.5);
 transition:width .4s linear;pointer-events:none}
.moonbtn span{position:relative}
.moonbtn.cool{color:#9a8fc8}
/* ── 이름 빈칸 — 불릴수록 채워진다. 방문자 카운터 자리를 대신한다 ── */
/* NULL 줄 — 납작한 이름표 */
.nmcard{flex:none;position:sticky;bottom:0;z-index:3;overflow:hidden;display:flex;align-items:center;gap:8px;
 margin:9px 0 0;padding:7px 12px;border-radius:11px;
 background:linear-gradient(180deg,#ffffff 0%,#f7f3ff 44%,#eee6fc 52%,#f6f1ff 100%);
 border:1.5px solid #fff;
 box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(150,135,210,.22),0 0 0 1px #e4dbf8}
/* 유리 광택 한 줄 — 위쪽 창들과 같은 재질로 보이게 */
.nmcard::after{content:"";position:absolute;left:0;right:0;top:0;height:22%;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.5),transparent)}
.nmline{display:flex;align-items:center;gap:4px}
.nmline>.k{flex:none;margin-right:3px;font-size:9px;letter-spacing:.26em;color:#8f7ccb}
.nmbx{position:relative;width:12px;height:13px;flex:none;display:inline-flex;align-items:center;
 justify-content:center;font-size:8px;border-radius:3px;color:#c0b0e8;border:0;background:#ece5fa}
.nmbx.on{color:#4a4276;box-shadow:0 0 0 1px #c9b8ef,inset 0 1px 0 #fff;
 background:linear-gradient(180deg,#fff 0%,#fff 52%,#f4eeff 100%)}
.nmbx.next{animation:recblink 1.4s infinite}
.nmline>.n{display:none}
.nmbar{display:none}
/* 라벨과 아이콘 사이의 빈 구간 — 비워두면 카드가 헐거워 보인다 */
.nmcard::before{content:"";flex:1;height:1px;margin:0 2px;
 background:repeating-linear-gradient(90deg,#ddd2f4 0 2px,transparent 2px 6px)}
.nmpct{flex:none;display:flex;align-items:center;gap:4px;line-height:0;order:3}
.nmline{order:1}
.nmcard::before{order:2}
/* ── D-0 · 계속 살아갈지 묻는 창 ── */
.ddq{position:relative;text-align:center;padding:4px 2px 2px}
.ddq .k{font-size:8.5px;letter-spacing:.28em;color:#d0b3dd}
.ddq .q{margin-top:9px;font-size:15px;letter-spacing:.04em;color:#4a4276}
.ddq .s{margin-top:9px;font-size:9.5px;letter-spacing:.06em;color:#b09ecf;line-height:1.95}
/* null.exe의 상태 줄. 다른 창과 같은 껍데기(.ddq)를 쓰고 여기만 더한다 —
   웹소설 상태창 형식이라 항목과 값만 적는다. 「어떻게 채우냐」를 쓸 자리가
   형식에 없다: 판돈만 알려주고 방법은 못 알려준다.
   존재값에 칸을 그리면 몇 칸인지가 힌트가 되므로 그것도 「비밀」이다. */
.ddrows{margin:12px auto 0;max-width:190px;display:flex;flex-direction:column;gap:6px}
.ddrows .r{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.06em;color:#8f7ccb}
.ddrows .r .k2{flex:none;width:42px;text-align:left;letter-spacing:.2em;color:#d0b3dd}
.ddrows .r .dot{flex:1;height:1px;background:repeating-linear-gradient(90deg,#e0d5f7 0 2px,transparent 2px 5px)}
.ddrows .r .v{flex:none;color:#6b5fa8;letter-spacing:.1em}
.ddrows .r .v.hush{color:#c98fb8}
/* 이모티콘은 픽셀 글꼴에 없는 글자다. 여기만 시스템 글꼴로 두지 않으면 두부가 뜬다 */
.kao{font-family:"Apple SD Gothic Neo","Malgun Gothic","Segoe UI Symbol",sans-serif;letter-spacing:0}
.ddyn{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.ddyn button{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;width:100%;
 padding:12px 14px;font-family:inherit;font-size:11.5px;letter-spacing:.08em;cursor:pointer;text-align:left;
 color:#fff;text-shadow:0 1px 0 rgba(170,80,140,.5);border:1.5px solid #fff;border-radius:999px;
 background:linear-gradient(180deg,#ffc2e2,#f78fc6);box-shadow:0 2px 0 rgba(180,110,160,.3)}
.ddyn button::after{display:none}
.ddyn button .g{font-size:13px;line-height:1}
.ddyn button .tail{margin-left:auto;font-size:9px;letter-spacing:.1em;opacity:.9}
.ddyn button.no{color:#fff;text-shadow:0 1px 0 rgba(120,100,180,.5);border-color:#fff;
 background:linear-gradient(180deg,#cfc0f5,#ae98ea);box-shadow:0 2px 0 rgba(150,135,210,.3)}
.ddyn button:active{transform:translateY(3px);box-shadow:inset 0 2px 4px rgba(176,86,127,.28)}
.ddyn button.dead{color:#d9cbe4;text-shadow:none;border-color:#eddff2;cursor:default;
 background:linear-gradient(180deg,#fdfaff,#f7f1fb);box-shadow:none}
.ddyn button.dead::after{display:none}
.ddyn button.dead:active{transform:none}
/* ── 진행도 헤더 ── */
.progline{display:flex;align-items:center;gap:8px;margin:12px 4px 8px}
.progline .t{font-size:9.5px;letter-spacing:.3em;color:#b0a6d8;white-space:nowrap}
.progline .bar{flex:1;height:5px;background:#e6e0f6;border:1px solid #cfc6ee;overflow:hidden}
.progline .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb0d4,#c3b2f0)}
.progline .n{font-size:9.5px;color:#8a7fc0;white-space:nowrap}
.galcell{position:relative;aspect-ratio:2/3;border-radius:5px;overflow:hidden;border:1px solid #cfc6ee;
 background:#efeaf9;cursor:pointer;box-shadow:1px 2px 0 rgba(93,84,144,.2)}
.galcell img{width:100%;height:100%;object-fit:cover;display:block}
.galcell:active{opacity:.85}
.galcell.lock{background:#efeaf9;cursor:default}
.galcell.lock img{filter:blur(9px) grayscale(.8) brightness(1.06);transform:scale(1.1);opacity:.5}
.galcell .glock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;

function presence(id, now){
  const h=(now||new Date()).getHours();
  if(id==="jaeeon"){
    if(h>=8&&h<17)  return {s:"on",  t:"보건실"};
    if(h>=17&&h<23) return {s:"away",t:"퇴근"};
    if(h>=23||h<1)  return {s:"away",t:"집"};
    return {s:"off", t:"자는 중"};
  }
  if(id==="minhyun"){
    if(h>=8&&h<16)  return {s:"away",t:"수업 중"};
    if(h>=16&&h<22) return {s:"on",  t:"야자"};
    if(h>=22||h<2)  return {s:"on",  t:"안 자는 중"};
    return {s:"off", t:"꺼짐"};
  }
  return null;
}

/* ── 조사 ──
   「밴드을(를) 받았다」가 화면에 그대로 찍혔다. 괄호로 둘 다 적어두는 건
   글로 쓸 때 쓰는 표기지 사람이 읽는 문장이 아니다.
   받침이 있으면 앞의 것, 없으면 뒤의 것. 한글이 아닌 글자로 끝나면(LP·CD)
   받침 없는 쪽으로 읽는다 — 「엘피를」 「씨디를」이 자연스럽다. */
const jos=(w,pair)=>{
  const [a,b]=pair.split("/");
  const c=(w||"").trim().slice(-1).charCodeAt(0);
  if(!(c>=0xac00&&c<=0xd7a3))return w+b;          // 한글 음절이 아니면 받침 없음으로
  return w+(((c-0xac00)%28)?a:b);
};

/* 프로필 사진 줄맄 스타일 */
/* 확대율·위치는 사진마다 다르다. 사진을 갈아끼우면 CHARS의 zoom/pos를 다시 잡을 것.
   너무 키우면 머리 위가 잘린다 — 150% 근처가 머리 전체가 들어오는 한계다. */
const faceBg=ch=>({backgroundImage:`url("${ch.img+AV_V}")`,backgroundSize:ch.zoom||"150%",backgroundPosition:ch.pos,backgroundColor:ch.pale});
function Avatar({room,size=42,onProfile,heat,nu}){
  const st={width:size,height:size,...(heat!=null?heatRing(CHARS[room.id],heat):null)};
  const on=nu?" nu":"";   // 프로필이 바뀌었는데 아직 안 봤다
  // 1:1 방의 얼굴만 눌러서 프로필로 들어간다. 단톡/관전방은 대상이 없다.
  const hit=onProfile&&room.type==="dm"
    ? {className:"avatar face clickable"+on,onClick:e=>{e.stopPropagation();onProfile(room.id)}}
    : {className:"avatar face"+on};
  if(room.type==="group"){ // 물방울
    return <div className="avatar" style={{...st,background:"linear-gradient(180deg,#ffffff,#e0ecfa)"}}><BubbleIcon size={size*.6}/></div>;
  }
  if(room.type==="watch"){ // 관전방: 달
    return <div className="avatar" style={{...st,color:"#8a7fc0",background:"linear-gradient(180deg,#ffffff,#dde3f4)"}}><MoonIcon size={size*.5}/></div>;
  }
  return <div {...hit} style={{...st,...faceBg(CHARS[room.id])}}/>;
}

/* ── 캐릭터 프로필 ──
   관계 단계에 따라 상태메시지와 프로필 뮤직이 바뀐다.
   단계 기준(0/16/40/80)은 worker.js의 STAGES와 같아야 한다. */
/* 프로필이 바뀌는 지점. 마지막 120은 .hidden의 일기가 열리는 지점과 같다 —
   마지막 달에 배경과 일기가 함께 열린다.
   worker.js의 STAGES는 0/16/40/80 네 단계로 모델의 연기 톤을 정한다.
   그쪽은 "관계가 어디까지 왔나"고 이쪽은 "화면이 어떻게 보이나"라 길이가 달라도 된다.
   다만 HEAT는 이 배열과 길이가 같아야 한다. */
/* 대화 수와 날짜를 둘 다 넘어야 다음 단계다. 느린 쪽이 정한다.
   전에는 대화 수만 봤는데 유저는 하루에 백 개씩 보낸다. 그러면 첫날 밤에
   마지막 단계까지 가버린다 — 화면에는 D-29라고 적혀 있는데.
   1일은 1일이어야 한다. worker.js의 STAGES와 같아야 한다. */
const STAGE_AT=[0,16,40,80,120];
const STAGE_DAY=[0,4,10,18,25];
const stageIdx=(n,days)=>{let i=0;STAGE_AT.forEach((a,k)=>{if(n>=a&&(days||0)>=STAGE_DAY[k])i=k});return i};

/* 떠난 뒤의 상메. 이건 대화 수가 아니라 시계가 정한다 —
   실습이 끝나는 건 몇 마디 했느냐와 상관없는 일이라서다.
   대화 수에 걸어놨더니 하루에 백스무 마디 하면 D-29에 작별 인사가 떴다.
   D-0이 되면 단계가 어디든 이걸로 덮는다. */
const STATUS_GONE={jaeeon:"잘 지내요. 항상.", minhyun:"모르는 걸로 할게요."};
/* D-0에서 멈춰만 두면 서른한 날째에도 백 일째에도 작별 인사를 걸어놓고
   유저와 계속 대화하는 화면이 된다. 떠난 뒤를 둘로 나눈다 —
   기준은 D-0 뒤에 유저가 말을 했느냐. 유저 발화만 센다. */
const STATUS_BACK={jaeeon:"아직 자리 있어요.", minhyun:"이제 와요?"};
const cameBackOf=store=>{
  const all=Object.values((store&&store.msgs)||{}).flat();
  if(!all.length)return false;
  const first=all.reduce((a,m)=>!a||m.ts<a?m.ts:a,0);
  const leaveAt=first+(ENROLL_DAYS+loadExtend())*864e5;
  return all.some(m=>m.sender==="user"&&m.ts>=leaveAt);
};

/* 본 단계와 지금 단계 사이에 실제로 달라진 것. 목록은 이게 비었는지만 본다.
   단계가 올랐어도 배경·곡·상메가 다 그대로면 알릴 일이 없다.
   두 단계를 건너뛰었어도 답은 "지금 무엇이 그때와 다른가" 하나다. */
const stageDiff=(char,seen,now)=>{
  const ss=(PROFILES[char]||{}).stages||[], a=ss[seen], b=ss[now];
  if(!a||!b||now<=seen)return [];
  return ["bg","track","status"].filter(k=>(a[k]||"")!==(b[k]||""));
};

/* 프로필 뮤직 — 눌러야 나온다. 곡 정보가 비어 있으면 "BGM 없음"으로 둔다.
   (없는 곡 제목을 지어내지 않기 위해 TRACKS의 artist/title은 비워둔 상태다) */
/* 배경 파일이 아직 없을 수 있다(사진은 나중에 올라온다).
   CSS background-image는 파일이 없어도 알려주지 않고 그냥 빈 화면이 되므로,
   먼저 불러보고 실패하면 그 인물의 기존 배경으로 돌아간다.
   파일을 올리는 순간 코드를 고치지 않아도 새 배경이 뜬다. */
function useBg(src,fallback){
  const [ok,setOk]=useState(null);   // null=확인 중
  useEffect(()=>{
    if(!src){setOk(false);return}
    let alive=true; const img=new Image();
    img.onload =()=>{if(alive)setOk(true)};
    img.onerror=()=>{if(alive)setOk(false)};
    img.src=src;
    return()=>{alive=false};
  },[src]);
  return ok?src:fallback;   // 확인 중에도 fallback을 보여준다 — 빈 화면이 깜빡이지 않게
}

function MusicBar({track,color,onPlay}){
  const ref=useRef(null);
  const [playing,setPlaying]=useState(false);
  const [dead,setDead]=useState(false);   // 파일이 없으면 재생 불가로 처리
  useEffect(()=>{const a=ref.current;return()=>{if(a)a.pause()}},[]);
  const label=track?[track.artist,track.title].filter(Boolean).join(" — "):"";
  if(!track||dead)return <div className="pfbgmoff">♪  no bgm</div>;
  const toggle=()=>{
    const a=ref.current;if(!a)return;
    if(playing){a.pause();setPlaying(false)}
    // 인물 BGM이 시작되면 데스크 CD는 멈춘다 — 두 곡이 겹쳐 나오면 안 된다
    else a.play().then(()=>{onPlay&&onPlay();setPlaying(true)}).catch(()=>setDead(true));
  };
  return <React.Fragment>
    <audio ref={ref} src={track.src} loop preload="none" onError={()=>setDead(true)} onEnded={()=>setPlaying(false)}/>
    <button className={"pfbgm"+(playing?" on":"")} onClick={toggle} style={{color}}>
      {playing&&<span className="np">now playing</span>}
      <span className="play" style={{borderColor:color,color}}>{playing?"❚❚":"▶"}</span>
      <span className="lab">{label||"press play ♪"}</span>
      <span className="eq"><i/><i/><i/></span>
    </button>
  </React.Fragment>;
}

function Profile({char,count,onBack,gifts,dLeft,back,days}){
  const ch=CHARS[char], p=PROFILES[char], room=roomOf(char);
  const [full,setFull]=useState(false);   // 배경만 크게 보기
  const st=p?(p.stages[stageIdx(count,days)]||p.stages[0]):null;
  /* 배경은 단계를 따라간다. 파일이 아직 없으면 그 인물의 기존 배경으로 돌아간다.
     훅은 아래 조건부 return보다 위에 있어야 한다 — 밑으로 내려가면 렌더마다
     훅 호출 수가 달라져서 React가 터진다. */
  /* 배경 우선순위: 유저가 준 선물 > 단계 배경. 자동으로 바뀌는 것보다
     유저가 건 것이 앞선다 — 그게 이 기능의 요지다.
     다만 GIFT_AT 단계는 지나야 한다. 주자마자 걸리면 사는 것이지 관계가 아니다. */
  const given=(gifts&&gifts[char])||[];
  /* 배경이 되는 건 사진이 있는 선물뿐이다. 그냥 마지막 선물을 집으면
     사진 없는 걸 방금 준 순간 단계 배경까지 같이 날아간다.
     그래서 뒤에서부터 사진 있는 것을 찾는다. */
  const hung=stageIdx(count,days)>=GIFT_AT
    ? given.slice().reverse().find(k=>(GIFTS.find(g=>g.key===k)||{}).bg) : null;
  const wanted=hung?(GIFTS.find(g=>g.key===hung)||{}).bg:(st&&st.bg);
  const bg=useBg(wanted,(p&&p.fallback)||char+"-bg.webp");
  if(!ch||!p)return null;
  /* 떠났으면 단계와 상관없이 작별 인사다. 시계가 단계를 이긴다 */
  const status=((dLeft===0?(back?STATUS_BACK:STATUS_GONE)[char]:null)||st.status||"").trim();
  return <div className="pfscreen" style={{backgroundImage:`url("${bg}")`}}>
    <div className="pfdim" onClick={e=>{if(e.target===e.currentTarget)setFull(true)}}>
      <Sparkles/>
      <div className="pfcard">
        <div className="tb" style={{background:`linear-gradient(90deg, ${rgba(ch.color,.95)}, #ffb0d4)`}}>
          {char}.hompy<WinDots onClose={onBack}/>
        </div>
        <div className="pftop">
          <div className="pfpola">
            <span className="tape t1"/><span className="tape t2"/>
            <div className="shot" style={faceBg(ch)}/>
            <div className="cap">{room?room.empty:""}</div>
          </div>
          <div className="pfnamerow">
            <span className="deco" style={{color:ch.dk}}>✦</span>
            <span className="nm">{ch.name}</span>
            <span className="deco" style={{color:"#ff7fae"}}>♡</span>
          </div>
          {status&&<div className="pfbubble"><div className="b">{status}</div><div className="tail"/></div>}
        </div>
        <MusicBar track={trackOf(st.track)} color={ch.dk}/>
        <div className="pfstats">
          <div className="s"><span className="l">TODAY</span><span className="v" style={{color:"#ff7fae"}}>1</span></div>
          <div className="s"><span className="l">TALK</span><span className="v" style={{color:ch.dk}}>{count}</span></div>
        </div>
        <div className="pfstickers">
          {["✿","★","♡","✧","☾"].map((x,i)=><span key={i} style={{color:["#c3b2f0","#b9a7e6","#a78fe0","#8fd8e8","#d5c8ff"][i]}}>{x}</span>)}
        </div>
        <button className="pfclose bevel" onClick={onBack}>◁  back</button>
      </div>
    </div>
    {full&&<div className="bgfull" style={{backgroundImage:`url("${bg}")`}} onClick={()=>setFull(false)}>
      <span className="bgclose">tap to close</span>
    </div>}
  </div>;
}

/* ── 오프닝 ──
   Y2K 데스크톱 한 장. 도는 CD, 올라오는 방울, 흩어진 가짜 오류창.
   설명하는 문장이 없다 — 오류창이 대신 말한다. "당신을 찾을 수 없습니다".
   그래서 이름 칸이 이 화면에 같이 있다. 이름을 넣는 것이 그 오류를 지우는 일이다.

   로고곡은 여기서 돌고 들어갈 때 페이드아웃된다. 브라우저는 사용자가 이 페이지에서
   아무것도 누르기 전에는 소리를 막으므로(자동재생 정책), 막히면 아무 데나 누를 때
   다시 켠다. 아래 글자가 지금 어느 쪽인지 알려준다. */
// 저장소에 같이 있는 파일이라 상대 경로로 잡는다 (R2를 안 거친다)
const LOGO_TRACK="null-logo.mp3";
const BOOT_VOL=.55;   // 앱(App.tsx)의 BOOT_VOL과 같아야 한다

/* 방울 — 음악과 같이 올라온다. [왼쪽%, 지름, 한 바퀴 초, 시작 지연] */
const BUBS=[[8,26,15,0],[22,14,11,1.4],[37,34,18,.6],[52,18,13,2.2],[68,44,21,.2],[80,20,12.5,3],[91,30,16,1.8]];
const Bubbles=()=><div className="bubbles">{BUBS.map((b,i)=>
  <span key={i} className="bub" style={{left:b[0]+"%",width:b[1],height:b[1],
    animationDuration:`${b[2]}s,${(b[2]*0.28).toFixed(1)}s`,animationDelay:b[3]+"s"}}/>)}</div>;

/* 데스크톱에 놓인 마우스 포인터. 아무 데도 안 붙어 있는 게 이 화면의 농담이다.
   System error 창의 왼쪽 아래 모서리에 매달아 둔다 — 화면 좌표로 놓으면
   높이가 바뀔 때마다 글자를 깔고 앉는다. */
const SpCursor=()=><svg className="spcursor" viewBox="0 0 15 21">
  <path d="M1 1 L1 17 L5 13 L8 20 L11 19 L8 12 L13 12 Z" fill="#fff" stroke="#4a4276" strokeWidth="1.2" strokeLinejoin="round"/>
</svg>;

function Splash({onEnter}){
  const [v,setV]=useState("");
  const [armed,setArmed]=useState(false);   // 자동재생이 됐는가
  const audio=useRef(null);
  useEffect(()=>{
    const a=new Audio(LOGO_TRACK); a.volume=0; a.loop=true; audio.current=a;
    a.play().then(()=>setArmed(true)).catch(()=>setArmed(false));
    /* loop만 켜두면 끝에서 앞으로 뚝 끊긴다. 끝 2.2초를 줄이고 처음 1.2초를 올려
       한 바퀴 돌 때 숨을 한 번 쉬는 것처럼 들리게 한다. timeupdate는 초당 네 번쯤이라
       그 간격으로 볼륨을 만지면 지직거려서, 50ms로 직접 잰다. */
    const ramp=setInterval(()=>{
      const d=a.duration, t=a.currentTime;
      if(!d||!isFinite(d)){a.volume=BOOT_VOL;return}
      const up=Math.min(1,t/1.2), down=Math.min(1,Math.max(0,d-t)/2.2);
      a.volume=BOOT_VOL*Math.min(up,down);
    },50);
    return()=>{
      clearInterval(ramp);   // 나가는 페이드와 싸우지 않게 먼저 끈다
      const f=setInterval(()=>{if(a.volume>.06)a.volume-=.06;else{a.pause();clearInterval(f)}},60);
      setTimeout(()=>{clearInterval(f);a.pause()},900);
    };
  },[]);
  const wake=()=>{const a=audio.current;if(!armed&&a)a.play().then(()=>setArmed(true)).catch(()=>{})};
  const go=()=>{const t=v.trim();if(t)onEnter(t)};
  return <div className="screen splash" onClick={wake}>
    <Bubbles/>
    <Sparkles/>
    <div className="spstack">
      <span className="spcd"/>
      <div className="spcard">
        <div className="sptb">null.exe<WinDots/></div>
        <div className="spbody">
          <div className="splogo">NULL<i className="cur">_</i></div>
          <input className="spinput" value={v} maxLength={12} placeholder="안녕, 널 입력해줘."
            onChange={e=>setV(e.target.value)} onFocus={wake} onKeyDown={e=>e.key==="Enter"&&go()}/>
          <button className="spgo" disabled={!v.trim()} onClick={go}>Click!</button>
        </div>
      </div>
      {/* 이 화면에서 이야기를 말하는 건 이 셋뿐이다 */}
      <div className="spwin w1" style={{animationDelay:".2s"}}>
        <div className="sptb" style={{background:"linear-gradient(90deg,#b9a8ea,#8a7fc0)"}}>Error<WinDots/></div>
        <div className="spbd">이름을 입력해야 존재할 수 있어요.<div className="spbtn">ok</div></div>
      </div>
      {/* 커서는 창에 매달아 둔다 — 좌표로 놓으면 글자를 깔고 앉는다 */}
      <div className="spcurwrap w2">
        <div className="spwin" style={{animationDelay:".35s"}}>
          <div className="sptb" style={{background:"linear-gradient(90deg,#ff7fae,#ff5fa8)"}}>System error<WinDots/></div>
          <div className="spbd">당신을 찾을 수 없습니다.<div className="spbtn">Cancel</div></div>
        </div>
        <SpCursor/>
      </div>
      <div className="spwin w3" style={{animationDelay:".5s"}}>
        <div className="sptb" style={{background:"linear-gradient(90deg,#8fd8e8,#c3b2f0)"}}>loading...<WinDots/></div>
        <div className="spbd" style={{background:"#fff8fc"}}>
          <span className="spbar"><i/></span>
        </div>
      </div>
    </div>
    <div className="sptap">{armed?"♪ NULL!":"TAP FOR MUSIC ♪"}</div>
  </div>;
}

function Enroll({name,profile,onSaveField,onRename,onDone}){
  const [out,setOut]=useState(false);

     가야 했는데, 그때는 이미 두 사람이 그 이름으로 부르기 시작한 뒤다. */
  const [edit,setEdit]=useState(false);
  const [nv,setNv]=useState(name||"");
  useEffect(()=>setNv(name||""),[name,edit]);
  const saveName=()=>{setEdit(false);const t=nv.trim();if(t&&t!==name)onRename(t)};
  /* 한 칸 채우고 엔터를 치면 다음 칸이 열린다. 네 칸을 채우는 데 클릭이
     네 번 필요할 이유가 없다. -1은 아무 칸도 안 열린 상태다. */
  const [focus,setFocus]=useState(-1);
  const filled=ENR_FIELDS.filter(f=>(profile[f.k]||"").trim()).length;
  const leave=()=>{if(out)return;setOut(true);setTimeout(onDone,440)};
  return <div className={"enr"+(out?" out":"")}>
    <div className="ecard">
      <div className="etb">registering...<WinDots/></div>
      <div className="ebody">

/* 탭하면 입력으로 바뀌는 빈칸 */
/* 열린 상태를 밖에서 쥘 수 있다(open/onOpen). 등록 화면은 그렇게 해서
   엔터 한 번에 다음 칸으로 넘긴다. 안 넘기면 제 안의 edit로 혼자 돈다 —
   프로필 창은 예전 그대로다. */
function Blank({value,onSave,width,open,onOpen,onNext}){
  const ctl=typeof open==="boolean";
  const [edit,setEdit]=useState(false);
  const on=ctl?open:edit;
  const set=o=>ctl?onOpen(o):setEdit(o);
  const [v,setV]=useState(value||"");
  useEffect(()=>setV(value||""),[value,on]);
  const done=next=>{onSave(v.trim());if(next&&onNext)onNext();else set(false)};
  if(on)return <input className="blankin sunken" style={width?{width}:null} value={v} autoFocus maxLength={20}
    onChange={e=>setV(e.target.value)} onBlur={()=>done(false)} onKeyDown={e=>e.key==="Enter"&&done(true)}/>;
  return <span className={"blank"+(value?" filled":"")} onClick={()=>set(true)}>{value||"□□"}</span>;
}

/* [당신] 프로필 카드 */
/* 장바구니 — 목록에서 고르고, 누구에게 보낼지와 쪽지를 그 자리에서 정한다.
   작은 다이얼로그가 아니라 창 하나를 통째로 쓴다. 목록 + 쪽지까지 들어가면
   290px 상자로는 스크롤만 생긴다. */
function Cart({gifts,hearts,onSend,onClose}){
  const [q,setQ]=useState("");
  const [cat,setCat]=useState("전체");
  const [pick,setPick]=useState(null);
  const [to,setTo]=useState(null);
  const [memo,setMemo]=useState("");
  const key=q.trim().toLowerCase();
  /* 검색어가 비면 그 분류를 전부 보여준다. 아이템이 몇 개 없어서 정확한 낱말을
     맞춰야만 나오면 뭐가 있는지 모르는 채로 헤매게 된다. */
  const hits=GIFTS.filter(g=>(cat==="전체"||g.cat===cat)
    &&(!key||(g.name+" "+g.tags).toLowerCase().includes(key)));
  const back=()=>{setPick(null);setTo(null);setMemo("")};
  const given=c=>(gifts[c]||[]).includes(pick&&pick.key);
  const poor=pick&&hearts<pick.cost;

  return <div className="cartscreen"><div className="cartwin">
    <div className="tb">✿ gift{pick?" / wrap":""}<WinDots onClose={onClose}/></div>

    {!pick&&<React.Fragment>
      <div className="cbar">
        <input className="csearch" value={q} placeholder="무엇을 찾고 있어?"
          onChange={e=>setQ(e.target.value)}/>
        <span className="ccoin">♡ {hearts}</span>
      </div>
      <div className="cchips">{GIFT_CATS.map(c=>
        <button key={c} className={"cchip"+(cat===c?" on":"")} onClick={()=>setCat(c)}>{c}</button>)}</div>
      <div className="cgrid">
        {hits.length?hits.map(g=>
          <button key={g.key} className="citem" onClick={()=>setPick(g)}>
            {g.badge&&<span className={"cbadge"+(g.badge==="HOT"?" mint":"")}>{g.badge}</span>}
            <span className="cthumb">{React.createElement(GiftIcon[g.key],{size:31})}</span>
            <span className="ciname">{g.name}</span>
            <span className="cprice">♡ {g.cost}</span>
          </button>)
         :<div className="cnone">no result</div>}
      </div>
      <div className="cfoot">TAP TO WRAP ♡</div>
    </React.Fragment>}

    {pick&&<div className="cwrap">
      <div className="cgcard"><span className="cribbon"/>
        <span className="cgthumb">{React.createElement(GiftIcon[pick.key],{size:34})}</span>
        <div>
          <div className="cgname">{pick.name}</div>
          <div className="cgdesc">{pick.desc}</div>
          <div className="cgprice">♡ {pick.cost}</div>
        </div>
      </div>
      <div className="csect">WHO GETS THIS</div>
      {["jaeeon","minhyun"].map(c=>{
        const done=given(c), sel=to===c;
        return <div key={c}>
          <button className={"cto"+(sel?" sel":"")} disabled={done}
            onClick={()=>{ if(done)return;
              if(!sel){setTo(c);return}
              if(poor)return;
              onSend(c,pick,memo); onClose(); }}>
            <span className="cradio"/>
            <span className="cface" style={faceBg(CHARS[c])}/>
            <span className="ctoname">{CHARS[c].name}</span>
            <span className={done?"csent":"csend"}>{done?"SENT ♡":(sel?(poor?`NEED ♡${pick.cost-hearts}`:"SEND ♡"):"WRAP ♡")}</span>
          </button>
          {sel&&!done&&<div className="chint">{GIFT_HINT[c]}</div>}
        </div>;
      })}
      <div className="csect">A NOTE (선택)</div>
      <textarea className="cmemo" value={memo} maxLength={60} placeholder="P.S. ♡"
        onChange={e=>setMemo(e.target.value)}/>
      <button className="cback" onClick={back}>◁ back</button>
    </div>}
  </div></div>;
}

     여기서는 안 넘어가면 그게 더 이상하다 — 항목도 ENR_FIELDS 하나만 본다. */
  const [focus,setFocus]=useState(-1);

    <div className="dlgbtns">
      <button className="bevel" onClick={()=>{setNv(name);setRenaming(true)}}>이름 변경</button>

}
